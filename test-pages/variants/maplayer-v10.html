/* ================================================================

function formatTime(t) {
  const min = Math.floor((1800 - t) / 60);
  const sec = (1800 - t) % 60;
  if (t >= 1800) return 'NOW';
  return `T-${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

function lerp(a, b, f) { return a + (b - a) * f; }

function getBuildingState(b, t) {
  let state = 'intact';
  for (const h of b.history) {
    if (t >= h.t) state = h.state;
  }
  return state;
}

function getZoneState(z, t) {
  let entry = z.history[0];
  for (const h of z.history) {
    if (t >= h.t) entry = h;
  }
  return entry;
}

function getSquadPos(s, t) {
  const p = s.path;
  if (t <= p[0].t) return { x: p[0].x, y: p[0].y };
  if (t >= p[p.length-1].t) return { x: p[p.length-1].x, y: p[p.length-1].y };
  for (let i = 0; i < p.length - 1; i++) {
    if (t >= p[i].t && t < p[i+1].t) {
      const f = (t - p[i].t) / (p[i+1].t - p[i].t);
      return { x: lerp(p[i].x, p[i+1].x, f), y: lerp(p[i].y, p[i+1].y, f) };
    }
  }
  return { x: p[p.length-1].x, y: p[p.length-1].y };
}

/* ================================================================

function drawGrid() {
  ctx.strokeStyle = 'rgba(40,40,40,0.5)';
  ctx.lineWidth = 1;
  const step = 40;
  for (let x = 0; x < W; x += step) {
    ctx.beginPath(); ctx.moveTo(x,0); ctx.lineTo(x,H); ctx.stroke();
  }
  for (let y = 0; y < H; y += step) {
    ctx.beginPath(); ctx.moveTo(0,y); ctx.lineTo(W,y); ctx.stroke();
  }
}

function drawRoads() {
  ctx.strokeStyle = '#2a2a2a';
  ctx.lineWidth = 4;
  for (const r of roads) {
    ctx.beginPath();
    ctx.moveTo(r.x1 * W, r.y1 * H);
    ctx.lineTo(r.x2 * W, r.y2 * H);
    ctx.stroke();
  }
  ctx.strokeStyle = '#3a3a3a';
  ctx.lineWidth = 2;
  for (const r of roads) {
    ctx.beginPath();
    ctx.moveTo(r.x1 * W, r.y1 * H);
    ctx.lineTo(r.x2 * W, r.y2 * H);
    ctx.stroke();
  }
}

function drawZones(t) {
  for (const z of zones) {
    const st = getZoneState(z, t);
    let col;
    if (st.control === 'allied') col = `rgba(51,136,255,${st.intensity * 0.35})`;
    else if (st.control === 'enemy') col = `rgba(255,51,51,${st.intensity * 0.35})`;
    else if (st.control === 'contested') col = `rgba(255,170,0,${st.intensity * 0.35})`;
    else col = `rgba(100,100,100,${st.intensity * 0.15})`;

    ctx.fillStyle = col;
    ctx.strokeStyle = col.replace(/[\d\.]+\)$/, '0.6)');
    ctx.lineWidth = 2;
    ctx.beginPath();
    const p = z.poly;
    ctx.moveTo(p[0][0]*W, p[0][1]*H);
    for (let i = 1; i < p.length; i++) ctx.lineTo(p[i][0]*W, p[i][1]*H);
    ctx.closePath();
    ctx.fill();
    ctx.stroke();

    // Zone label
    let cx = 0, cy = 0;
    for (const pt of p) { cx += pt[0]; cy += pt[1]; }
    cx /= p.length; cy /= p.length;
    ctx.fillStyle = '#888';
    ctx.font = '10px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(z.name, cx*W, cy*H);
  }
}

function drawBuildings(t) {
  for (const b of buildings) {
    const st = getBuildingState(b, t);
    const bx = b.x * W, by = b.y * H;
    const bw = b.w * W, bh = b.h * H;

    if (st === 'intact') {
      ctx.fillStyle = '#666';
      ctx.strokeStyle = '#888';
      ctx.lineWidth = 1;
      ctx.fillRect(bx - bw/2, by - bh/2, bw, bh);
      ctx.strokeRect(bx - bw/2, by - bh/2, bw, bh);
      // Window dots
      ctx.fillStyle = '#444';
      for (let wx = 3; wx < bw - 6; wx += 8) {
        for (let wy = 3; wy < bh - 6; wy += 8) {
          ctx.fillRect(bx - bw/2 + wx, by - bh/2 + wy, 3, 3);
        }
      }
    } else if (st === 'destroyed') {
      ctx.fillStyle = '#333';
      ctx.strokeStyle = '#444';
      ctx.lineWidth = 1;
      ctx.fillRect(bx - bw/2, by - bh/2, bw, bh);
      ctx.strokeRect(bx - bw/2, by - bh/2, bw, bh);
      // Rubble cross
      ctx.strokeStyle = '#222';
      ctx.beginPath();
      ctx.moveTo(bx - bw/2, by - bh/2);
      ctx.lineTo(bx + bw/2, by + bh/2);
      ctx.moveTo(bx + bw/2, by - bh/2);
      ctx.lineTo(bx - bw/2, by + bh/2);
      ctx.stroke();
    } else if (st === 'rebuild') {
      // Scaffolding look
      ctx.fillStyle = '#555';
      ctx.strokeStyle = '#aa8800';
      ctx.lineWidth = 1;
      ctx.fillRect(bx - bw/2, by - bh/2, bw, bh);
      ctx.strokeRect(bx - bw/2, by - bh/2, bw, bh);
      // Scaffold lines
      ctx.strokeStyle = '#aa8800';
      ctx.beginPath();
      ctx.moveTo(bx - bw/2 + 4, by - bh/2);
      ctx.lineTo(bx - bw/2 + 4, by + bh/2);
      ctx.moveTo(bx + bw/2 - 4, by - bh/2);
      ctx.lineTo(bx + bw/2 - 4, by + bh/2);
      ctx.stroke();
    }

    // Label
    ctx.fillStyle = '#aaa';
    ctx.font = 'bold 11px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(b.label, bx, by + 4);
  }
}

function drawSquads(t) {
  for (const s of squads) {
    const pos = getSquadPos(s, t);
    const sx = pos.x * W, sy = pos.y * H;
    const color = s.side === 'allied' ? '#00ff88' : '#ff4444';
    const glow = s.side === 'allied' ? 'rgba(0,255,136,0.15)' : 'rgba(255,68,68,0.15)';

    // Glow
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(sx, sy, 18, 0, Math.PI*2);
    ctx.fill();

    // Dots for squad members
    ctx.fillStyle = color;
    const spread = 6;
    const seed = s.side.charCodeAt(0) + s.size;
    for (let i = 0; i < s.size; i++) {
      const angle = ((i * 137.5 + seed) % 360) * Math.PI / 180;
      const dist = ((i * 7 + seed) % 10) / 10 * spread;
      const dx = sx + Math.cos(angle) * dist;
      const dy = sy + Math.sin(angle) * dist;
      ctx.beginPath();
      ctx.arc(dx, dy, 2, 0, Math.PI*2);
      ctx.fill();
    }

    // Label
    ctx.fillStyle = color;
    ctx.font = '9px Courier New';
    ctx.textAlign = 'center';
    ctx.fillText(s.side === 'allied' ? 'A' : 'E', sx, sy - 12);
  }
}

function drawExplosions(t) {
  for (const ex of explosions) {
    const dt = t - ex.t;
    if (dt < 0 || dt > 60) continue;
    const f = 1 - dt / 60;
    const r = ex.r * (1 + (1-f)*2);
    const x = ex.x * W, y = ex.y * H;

    ctx.strokeStyle = `rgba(255,170,0,${f*0.8})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI*2);
    ctx.stroke();

    ctx.fillStyle = `rgba(255,100,0,${f*0.3})`;
    ctx.beginPath();
    ctx.arc(x, y, r * 0.6, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawCompass() {
  const cx = 50, cy = H - 50;
  ctx.strokeStyle = '#555';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.arc(cx, cy, 20, 0, Math.PI*2);
  ctx.stroke();

  ctx.fillStyle = '#ff4444';
  ctx.font = 'bold 12px Courier New';
  ctx.textAlign = 'center';
  ctx.fillText('N', cx, cy - 24);

  ctx.strokeStyle = '#888';
  ctx.beginPath();
  ctx.moveTo(cx, cy - 15);
  ctx.lineTo(cx, cy + 15);
  ctx.moveTo(cx - 15, cy);
  ctx.lineTo(cx + 15, cy);
  ctx.stroke();
}

function render() {
  ctx.fillStyle = '#0f0f0f';
  ctx.fillRect(0, 0, W, H);

  drawGrid();
  drawRoads();
  drawZones(currentTime);
  drawBuildings(currentTime);
  drawSquads(currentTime);
  drawExplosions(currentTime);
  drawCompass();

  // Time overlay on map
  ctx.fillStyle = 'rgba(0,0,0,0.6)';
  ctx.fillRect(10, 10, 110, 22);
  ctx.fillStyle = '#ffaa00';
  ctx.font = 'bold 14px Courier New';
  ctx.textAlign = 'left';
  ctx.fillText(formatTime(currentTime), 18, 26);
}

/* ================================================================
   TIMELINE UI
   ================================================================ */

function buildTicks() {
  const tickContainer = document.getElementById('ticks');
  tickContainer.innerHTML = '';
  for (let m = 0; m <= 30; m += 5) {
    const t = 1800 - m * 60;
    const pct = (t / 1800) * 100;
    const tick = document.createElement('div');
    tick.className = 'tick';
    tick.style.left = pct + '%';
    tickContainer.appendChild(tick);

    const lbl = document.createElement('div');
    lbl.className = 'tick-label';
    lbl.style.left = pct + '%';
    lbl.textContent = m === 0 ? 'NOW' : `T-${m}m`;
    tickContainer.appendChild(lbl);
  }
}

function updateUI() {
  timeDisplay.textContent = formatTime(currentTime);
  slider.value = currentTime;

  // Find current event
  let ev = null;
  for (const e of events) {
    if (currentTime >= e.t) ev = e;
  }
  if (ev) {
    eventDisplay.textContent = `${formatTime(ev.t)} — ${ev.title}`;
  } else {
    eventDisplay.textContent = '—';
  }

  // Clock
  const now = new Date();
  clockEl.textContent = now.toLocaleTimeString('en-US', {hour12:false});
}

let popupTimer = null;
let lastEventIdx = -1;

function checkEventPopup() {
  let idx = -1;
  for (let i = 0; i < events.length; i++) {
    if (currentTime >= events[i].t) idx = i;
  }
  if (idx !== lastEventIdx && idx >= 0) {
    lastEventIdx = idx;
    const ev = events[idx];
    evtTime.textContent = formatTime(ev.t);
    evtTitle.textContent = ev.title;
    evtDesc.textContent = ev.desc;
    evtPopup.style.display = 'block';
    if (popupTimer) clearTimeout(popupTimer);
    popupTimer = setTimeout(() => {
      evtPopup.style.display = 'none';
    }, 2500);
  }
}

/* ================================================================
   PLAYBACK
   ================================================================ */

function tick(now) {
  const dt = (now - lastFrame) / 1000;
  lastFrame = now;

  if (isPlaying) {
    currentTime += dt * 30 * playSpeed; // 30 sec per real sec at 1x
    if (currentTime >= 1800) {
      currentTime = 1800;
      isPlaying = false;
      btnPlay.textContent = 'PLAY';
      btnPlay.classList.remove('active');
    }
    checkEventPopup();
  }

  updateUI();
  render();
  requestAnimationFrame(tick);
}

slider.addEventListener('input', () => {
  currentTime = parseFloat(slider.value);
  lastEventIdx = -1;
  checkEventPopup();
  updateUI();
  render();
});

btnPlay.addEventListener('click', () => {
  isPlaying = !isPlaying;
  if (currentTime >= 1800 && isPlaying) currentTime = 0;
  btnPlay.textContent = isPlaying ? 'PAUSE' : 'PLAY';
  btnPlay.classList.toggle('active', isPlaying);
});

btnSpeed.addEventListener('click', () => {
  speedIdx = (speedIdx + 1) % speeds.length;
  playSpeed = speeds[speedIdx];
  btnSpeed.textContent = playSpeed + 'x';
});

/* ================================================================
   INIT
   ================================================================ */

buildTicks();
updateUI();
render();
requestAnimationFrame(tick);

</script>
</body>
