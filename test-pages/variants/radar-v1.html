<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signal Lost — RADAR V1</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0a0a0a;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top HUD bar */
    .hud-bar {
      height: 36px;
      background: #111;
      border-bottom: 1px solid #1a3a1a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      flex-shrink: 0;
    }

    .hud-title {
      font-size: 13px;
      font-weight: 600;
      color: #4ade80;
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    .hud-stats {
      display: flex;
      gap: 20px;
      font-size: 11px;
      color: #888;
    }

    .hud-stats span {
      color: #4ade80;
    }

    /* Main game area */
    #game-viewport {
      flex: 1;
      position: relative;
      overflow: hidden;
      background: #0d0d0d;
    }

    #main-canvas {
      display: block;
    }

    /* Minimap container */
    .minimap-container {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 160px;
      height: 160px;
      background: #0a0a0a;
      border: 2px solid #1a3a1a;
      border-radius: 2px;
      overflow: hidden;
      box-shadow: 0 0 12px rgba(74, 222, 128, 0.08);
    }

    .minimap-label {
      position: absolute;
      top: 3px;
      left: 5px;
      font-size: 9px;
      color: #4ade80;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 2;
      text-shadow: 0 0 4px rgba(74, 222, 128, 0.5);
    }

    #minimap-canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    /* Corner accents for minimap */
    .minimap-container::before,
    .minimap-container::after {
      content: '';
      position: absolute;
      width: 8px;
      height: 8px;
      border-color: #4ade80;
      border-style: solid;
      pointer-events: none;
      z-index: 2;
    }

    .minimap-container::before {
      top: -1px;
      left: -1px;
      border-width: 1px 0 0 1px;
    }

    .minimap-container::after {
      bottom: -1px;
      right: -1px;
      border-width: 0 1px 1px 0;
    }
  </style>
</head>
<body>
  <div class="hud-bar">
    <div class="hud-title">RADAR V1</div>
    <div class="hud-stats">
      <div>UNITS: <span id="unit-count">0</span></div>
      <div>SIGNAL: <span id="signal-strength">--</span></div>
      <div>SECTOR: <span>A-7</span></div>
    </div>
  </div>

  <div id="game-viewport">
    <canvas id="main-canvas"></canvas>
    <div class="minimap-container">
      <span class="minimap-label">MINIMAP</span>
      <canvas id="minimap-canvas" width="100" height="100"></canvas>
    </div>
  </div>

  <script>
    // ============================================
    // CONFIGURATION
    // ============================================
    const MAP_SIZE = 100; // logical map size (minimap is 100x100)
    const UNIT_COUNT = 8;
    const COLORS = {
      bg: '#0d0d0d',
      grid: '#1a1a1a',
      gridMajor: '#222',
      player: '#4ade80',
      playerGlow: 'rgba(74, 222, 128, 0.3)',
      enemy: '#ef4444',
      enemyGlow: 'rgba(239, 68, 68, 0.3)',
      neutral: '#fbbf24',
      viewportRect: 'rgba(74, 222, 128, 0.15)',
      viewportBorder: '#4ade80',
      terrainDark: '#111',
      terrainLight: '#161616'
    };

    // ============================================
    // STATE
    // ============================================
    const units = [];
    const viewport = { x: 30, y: 30, w: 40, h: 40 };
    let cameraOffset = { x: 0, y: 0 };
    let isDragging = false;
    let dragStart = { x: 0, y: 0 };
    let lastTime = 0;

    // ============================================
    // SETUP CANVASES
    // ============================================
    const mainCanvas = document.getElementById('main-canvas');
    const mainCtx = mainCanvas.getContext('2d');
    const minimapCanvas = document.getElementById('minimap-canvas');
    const minimapCtx = minimapCanvas.getContext('2d');

    function resizeMainCanvas() {
      const container = document.getElementById('game-viewport');
      mainCanvas.width = container.clientWidth;
      mainCanvas.height = container.clientHeight;
    }
    resizeMainCanvas();
    window.addEventListener('resize', resizeMainCanvas);

    // ============================================
    // INITIALIZE UNITS
    // ============================================
    function initUnits() {
      units.length = 0;
      // Player units (green)
      for (let i = 0; i < 4; i++) {
        units.push({
          x: 20 + Math.random() * 30,
          y: 20 + Math.random() * 30,
          type: 'player',
          id: i,
          vx: (Math.random() - 0.5) * 0.15,
          vy: (Math.random() - 0.5) * 0.15
        });
      }
      // Enemy units (red)
      for (let i = 0; i < 3; i++) {
        units.push({
          x: 60 + Math.random() * 30,
          y: 50 + Math.random() * 30,
          type: 'enemy',
          id: 4 + i,
          vx: (Math.random() - 0.5) * 0.12,
          vy: (Math.random() - 0.5) * 0.12
        });
      }
      // Neutral objective (yellow)
      units.push({
        x: 50,
        y: 50,
        type: 'neutral',
        id: 7,
        vx: 0,
        vy: 0
      });
      document.getElementById('unit-count').textContent = UNIT_COUNT;
    }

    // ============================================
    // UPDATE
    // ============================================
    function update(dt) {
      // Move units
      for (const u of units) {
        if (u.type === 'neutral') continue;
        u.x += u.vx * dt;
        u.y += u.vy * dt;
        // Bounce off map edges
        if (u.x < 2 || u.x > MAP_SIZE - 2) u.vx *= -1;
        if (u.y < 2 || u.y > MAP_SIZE - 2) u.vy *= -1;
        u.x = Math.max(2, Math.min(MAP_SIZE - 2, u.x));
        u.y = Math.max(2, Math.min(MAP_SIZE - 2, u.y));
      }

      // Slowly drift viewport to follow average player position
      const players = units.filter(u => u.type === 'player');
      const avgX = players.reduce((s, u) => s + u.x, 0) / players.length;
      const avgY = players.reduce((s, u) => s + u.y, 0) / players.length;
      const targetVx = avgX - viewport.w / 2;
      const targetVy = avgY - viewport.h / 2;
      viewport.x += (targetVx - viewport.x) * 0.005 * dt;
      viewport.y += (targetVy - viewport.y) * 0.005 * dt;
      viewport.x = Math.max(0, Math.min(MAP_SIZE - viewport.w, viewport.x));
      viewport.y = Math.max(0, Math.min(MAP_SIZE - viewport.h, viewport.y));

      // Update signal strength HUD
      const distToNeutral = Math.hypot(
        avgX - units.find(u => u.type === 'neutral').x,
        avgY - units.find(u => u.type === 'neutral').y
      );
      const signal = Math.max(0, Math.min(100, Math.round(100 - distToNeutral)));
      document.getElementById('signal-strength').textContent = signal + '%';
    }

    // ============================================
    // DRAW MAIN VIEWPORT (RTS-style game view)
    // ============================================
    function drawMain() {
      const W = mainCanvas.width;
      const H = mainCanvas.height;
      const ctx = mainCtx;

      ctx.clearRect(0, 0, W, H);

      // Background
      ctx.fillStyle = COLORS.bg;
      ctx.fillRect(0, 0, W, H);

      // Camera transform: viewport -> screen
      const scaleX = W / viewport.w;
      const scaleY = H / viewport.h;

      ctx.save();
      ctx.translate(-viewport.x * scaleX, -viewport.y * scaleY);

      // Draw grid
      const gridSize = 10;
      const startGX = Math.floor(viewport.x / gridSize) * gridSize;
      const startGY = Math.floor(viewport.y / gridSize) * gridSize;

      for (let gx = startGX; gx <= viewport.x + viewport.w + gridSize; gx += gridSize) {
        const isMajor = gx % 50 === 0;
        ctx.strokeStyle = isMajor ? COLORS.gridMajor : COLORS.grid;
        ctx.lineWidth = isMajor ? 1.5 : 0.5;
        ctx.beginPath();
        ctx.moveTo(gx * scaleX, (viewport.y - 10) * scaleY);
        ctx.lineTo(gx * scaleX, (viewport.y + viewport.h + 10) * scaleY);
        ctx.stroke();
      }
      for (let gy = startGY; gy <= viewport.y + viewport.h + gridSize; gy += gridSize) {
        const isMajor = gy % 50 === 0;
        ctx.strokeStyle = isMajor ? COLORS.gridMajor : COLORS.grid;
        ctx.lineWidth = isMajor ? 1.5 : 0.5;
        ctx.beginPath();
        ctx.moveTo((viewport.x - 10) * scaleX, gy * scaleY);
        ctx.lineTo((viewport.x + viewport.w + 10) * scaleX, gy * scaleY);
        ctx.stroke();
      }

      // Draw terrain patches (decorative)
      ctx.fillStyle = COLORS.terrainLight;
      ctx.fillRect(15 * scaleX, 15 * scaleY, 20 * scaleX, 12 * scaleY);
      ctx.fillRect(70 * scaleX, 60 * scaleY, 18 * scaleX, 15 * scaleY);
      ctx.fillStyle = COLORS.terrainDark;
      ctx.fillRect(45 * scaleX, 35 * scaleY, 10 * scaleX, 25 * scaleY);

      // Draw units
      for (const u of units) {
        const sx = u.x * scaleX;
        const sy = u.y * scaleY;
        const radius = u.type === 'neutral' ? 6 : 4;

        // Glow
        ctx.fillStyle = u.type === 'player' ? COLORS.playerGlow :
                        u.type === 'enemy' ? COLORS.enemyGlow :
                        'rgba(251, 191, 36, 0.2)';
        ctx.beginPath();
        ctx.arc(sx, sy, radius * 2.5, 0, Math.PI * 2);
        ctx.fill();

        // Core
        ctx.fillStyle = u.type === 'player' ? COLORS.player :
                        u.type === 'enemy' ? COLORS.enemy :
                        COLORS.neutral;
        ctx.beginPath();
        ctx.arc(sx, sy, radius, 0, Math.PI * 2);
        ctx.fill();

        // Selection ring for player units
        if (u.type === 'player') {
          ctx.strokeStyle = COLORS.player;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.arc(sx, sy, radius + 3, 0, Math.PI * 2);
          ctx.stroke();
        }
      }

      ctx.restore();

      // Vignette overlay
      const grad = ctx.createRadialGradient(W / 2, H / 2, H * 0.3, W / 2, H / 2, H * 0.7);
      grad.addColorStop(0, 'transparent');
      grad.addColorStop(1, 'rgba(0,0,0,0.4)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, W, H);
    }

    // ============================================
    // DRAW MINIMAP (100x100 logical)
    // ============================================
    function drawMinimap() {
      const ctx = minimapCanvas;
      const c = minimapCtx;
      const W = ctx.width;
      const H = ctx.height;

      c.clearRect(0, 0, W, H);

      // Background
      c.fillStyle = '#0a0a0a';
      c.fillRect(0, 0, W, H);

      // Subtle grid
      c.strokeStyle = '#141414';
      c.lineWidth = 0.5;
      for (let i = 0; i <= W; i += 10) {
        c.beginPath();
        c.moveTo(i, 0);
        c.lineTo(i, H);
        c.stroke();
        c.beginPath();
        c.moveTo(0, i);
        c.lineTo(W, i);
        c.stroke();
      }

      // Terrain patches (same as main)
      c.fillStyle = '#111';
      c.fillRect(15, 15, 20, 12);
      c.fillRect(70, 60, 18, 15);
      c.fillStyle = '#0d0d0d';
      c.fillRect(45, 35, 10, 25);

      // Viewport rectangle
      c.strokeStyle = COLORS.viewportBorder;
      c.lineWidth = 0.8;
      c.strokeRect(viewport.x, viewport.y, viewport.w, viewport.h);
      c.fillStyle = COLORS.viewportRect;
      c.fillRect(viewport.x, viewport.y, viewport.w, viewport.h);

      // Units
      for (const u of units) {
        const size = u.type === 'neutral' ? 2.5 : 1.8;
        c.fillStyle = u.type === 'player' ? COLORS.player :
                      u.type === 'enemy' ? COLORS.enemy :
                      COLORS.neutral;
        c.fillRect(u.x - size / 2, u.y - size / 2, size, size);
      }

      // Scanline effect (subtle)
      c.strokeStyle = 'rgba(74, 222, 128, 0.04)';
      c.lineWidth = 0.5;
      const scanY = (Date.now() / 30) % H;
      c.beginPath();
      c.moveTo(0, scanY);
      c.lineTo(W, scanY);
      c.stroke();
    }

    // ============================================
    // INTERACTION
    // ============================================
    minimapCanvas.addEventListener('mousedown', (e) => {
      const rect = minimapCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (minimapCanvas.width / rect.width);
      const y = (e.clientY - rect.top) * (minimapCanvas.height / rect.height);
      viewport.x = Math.max(0, Math.min(MAP_SIZE - viewport.w, x - viewport.w / 2));
      viewport.y = Math.max(0, Math.min(MAP_SIZE - viewport.h, y - viewport.h / 2));
      isDragging = true;
    });

    window.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const rect = minimapCanvas.getBoundingClientRect();
      const x = (e.clientX - rect.left) * (minimapCanvas.width / rect.width);
      const y = (e.clientY - rect.top) * (minimapCanvas.height / rect.height);
      viewport.x = Math.max(0, Math.min(MAP_SIZE - viewport.w, x - viewport.w / 2));
      viewport.y = Math.max(0, Math.min(MAP_SIZE - viewport.h, y - viewport.h / 2));
    });

    window.addEventListener('mouseup', () => { isDragging = false; });

    // Click on main canvas to pan (simple)
    mainCanvas.addEventListener('mousedown', (e) => {
      isDragging = true;
      dragStart = { x: e.clientX, y: e.clientY };
    });

    mainCanvas.addEventListener('mousemove', (e) => {
      if (!isDragging) return;
      const dx = (e.clientX - dragStart.x) * (viewport.w / mainCanvas.width);
      const dy = (e.clientY - dragStart.y) * (viewport.h / mainCanvas.height);
      viewport.x -= dx;
      viewport.y -= dy;
      viewport.x = Math.max(0, Math.min(MAP_SIZE - viewport.w, viewport.x));
      viewport.y = Math.max(0, Math.min(MAP_SIZE - viewport.h, viewport.y));
      dragStart = { x: e.clientX, y: e.clientY };
    });

    // ============================================
    // MAIN LOOP
    // ============================================
    function loop(timestamp) {
      const dt = Math.min(timestamp - lastTime, 50);
      lastTime = timestamp;

      update(dt);
      drawMain();
      drawMinimap();

      requestAnimationFrame(loop);
    }

    initUnits();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
