<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Radar V1 — Rain</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0a0a0a;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #e0e0e0;
    }
    #canvas-container {
      width: 100vw;
      height: 100vh;
      position: relative;
    }
    canvas { display: block; }

    /* HUD Overlay */
    #hud {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 10;
    }

    /* Top-left title */
    .hud-title {
      position: absolute;
      top: 20px; left: 24px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #7ea8c4;
      text-shadow: 0 0 8px rgba(126,168,196,0.4);
    }
    .hud-title span {
      display: block;
      font-size: 10px;
      letter-spacing: 1.5px;
      color: #5a7a8e;
      margin-top: 3px;
    }

    /* Top-right info */
    .hud-info {
      position: absolute;
      top: 20px; right: 24px;
      text-align: right;
      font-size: 10px;
      letter-spacing: 1px;
      color: #5a7a8e;
      line-height: 1.8;
    }
    .hud-info .value {
      color: #9ecce6;
      font-weight: 600;
    }

    /* Bottom rain intensity slider */
    #rain-control {
      position: absolute;
      bottom: 28px;
      left: 50%;
      transform: translateX(-50%);
      pointer-events: auto;
      background: rgba(10, 20, 30, 0.85);
      border: 1px solid rgba(126,168,196,0.25);
      border-radius: 8px;
      padding: 14px 24px;
      display: flex;
      align-items: center;
      gap: 16px;
      backdrop-filter: blur(6px);
    }
    #rain-control label {
      font-size: 10px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: #7ea8c4;
      white-space: nowrap;
    }
    #rain-slider {
      -webkit-appearance: none;
      appearance: none;
      width: 200px;
      height: 3px;
      background: rgba(126,168,196,0.25);
      border-radius: 2px;
      outline: none;
      cursor: pointer;
    }
    #rain-slider::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #7ea8c4;
      box-shadow: 0 0 10px rgba(126,168,196,0.5);
      cursor: pointer;
    }
    #rain-slider::-moz-range-thumb {
      width: 14px; height: 14px;
      border-radius: 50%;
      background: #7ea8c4;
      box-shadow: 0 0 10px rgba(126,168,196,0.5);
      cursor: pointer;
      border: none;
    }
    #rain-value {
      font-size: 11px;
      color: #9ecce6;
      font-weight: 600;
      min-width: 36px;
      text-align: right;
    }

    /* Radar sweep line hint */
    .radar-hint {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      letter-spacing: 1.5px;
      color: rgba(126,168,196,0.4);
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="canvas-container">
    <div id="hud">
      <div class="hud-title">
        WEATHER V1 — RAIN
        <span>Rain Radar // Live Atmospheric</span>
      </div>
      <div class="hud-info">
        <div>Particles: <span class="value" id="particle-count">3000</span></div>
        <div>Wind: <span class="value">SW 12kt</span></div>
        <div>Visibility: <span class="value" id="vis-value">2.4km</span></div>
        <div>Temp: <span class="value">14°C</span></div>
      </div>
      <div class="radar-hint">Radar sweep active — blue-gray tint</div>
      <div id="rain-control">
        <label>Rain Intensity</label>
        <input type="range" id="rain-slider" min="0" max="100" value="65">
        <span id="rain-value">65%</span>
      </div>
    </div>
  </div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── Scene Setup ──
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    // Blue-gray fog for rain atmosphere
    scene.fog = new THREE.FogExp2(0x1a2530, 0.018);
    scene.background = new THREE.Color(0x0d141c);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 300);
    camera.position.set(0, 28, 42);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 0.85;
    container.appendChild(renderer.domElement);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2.15;
    controls.minDistance = 15;
    controls.maxDistance = 80;
    controls.target.set(0, 0, 0);

    // ── Lighting ──
    const ambientLight = new THREE.AmbientLight(0x2a3a4a, 0.6);
    scene.add(ambientLight);

    const moonLight = new THREE.DirectionalLight(0x6a8aaa, 0.9);
    moonLight.position.set(-20, 40, -15);
    moonLight.castShadow = true;
    moonLight.shadow.mapSize.width = 2048;
    moonLight.shadow.mapSize.height = 2048;
    moonLight.shadow.camera.near = 0.5;
    moonLight.shadow.camera.far = 120;
    moonLight.shadow.camera.left = -50;
    moonLight.shadow.camera.right = 50;
    moonLight.shadow.camera.top = 50;
    moonLight.shadow.camera.bottom = -50;
    moonLight.shadow.bias = -0.0005;
    scene.add(moonLight);

    // Blue-gray fill from opposite side
    const fillLight = new THREE.DirectionalLight(0x3a5060, 0.35);
    fillLight.position.set(20, 15, 20);
    scene.add(fillLight);

    // Subtle ground bounce
    const bounceLight = new THREE.HemisphereLight(0x2a3a4a, 0x0a1018, 0.3);
    scene.add(bounceLight);

    // ── Ground with Puddle Reflections ──
    const groundGeo = new THREE.PlaneGeometry(120, 120, 64, 64);

    // Create subtle height variation for puddles
    const groundPos = groundGeo.attributes.position;
    for (let i = 0; i < groundPos.count; i++) {
      const x = groundPos.getX(i);
      const y = groundPos.getY(i);
      // Slight unevenness + puddle depressions
      const h = Math.sin(x * 0.15) * Math.cos(y * 0.12) * 0.3
              + Math.sin(x * 0.4 + y * 0.3) * 0.1
              - Math.max(0, 1 - Math.sqrt(x*x + y*y) * 0.08) * 0.4; // center depression
      groundPos.setZ(i, h);
    }
    groundGeo.computeVertexNormals();

    const groundMat = new THREE.MeshStandardMaterial({
      color: 0x141e28,
      roughness: 0.15,
      metalness: 0.75,
      envMapIntensity: 0.8,
    });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    scene.add(ground);

    // ── City Grid / Blocks ──
    const blockGroup = new THREE.Group();
    const buildingColors = [0x1e2a35, 0x243040, 0x1a252f, 0x2a3540, 0x162028];

    function createBuilding(x, z, w, d, h) {
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({
        color: buildingColors[Math.floor(Math.random() * buildingColors.length)],
        roughness: 0.7,
        metalness: 0.2,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      return mesh;
    }

    // Generate city blocks
    const blocks = [
      [-18, -12, 6, 5, 14], [-8, -14, 5, 6, 10], [2, -12, 7, 5, 18],
      [14, -10, 5, 7, 12], [-20, 2, 6, 5, 8], [-10, 4, 5, 5, 16],
      [0, 6, 7, 6, 11], [12, 4, 6, 5, 14], [20, 2, 5, 6, 9],
      [-16, 14, 5, 5, 13], [-4, 16, 6, 6, 7], [8, 14, 5, 5, 15],
      [18, 16, 6, 5, 10], [-22, -4, 5, 6, 6], [22, -6, 5, 5, 8],
      [-6, -4, 4, 4, 5], [6, -2, 4, 5, 6], [16, -4, 4, 4, 5],
    ];
    blocks.forEach(b => {
      blockGroup.add(createBuilding(b[0], b[1], b[2], b[3], b[4]));
    });
    scene.add(blockGroup);

    // ── Water Dripping from Building Edges ──
    const dripGroup = new THREE.Group();
    const dripGeo = new THREE.CylinderGeometry(0.02, 0.01, 0.4, 4);
    const dripMat = new THREE.MeshBasicMaterial({
      color: 0x7ea8c4,
      transparent: true,
      opacity: 0.6,
    });

    const drips = [];
    blocks.forEach(b => {
      const [bx, bz, bw, bd, bh] = b;
      // Add drips along edges
      const edgeCount = Math.floor(bh / 3) + 2;
      for (let i = 0; i < edgeCount; i++) {
        // Random edge positions
        const side = Math.floor(Math.random() * 4);
        let dx, dz;
        switch(side) {
          case 0: dx = bx - bw/2; dz = bz + (Math.random()-0.5)*bd; break;
          case 1: dx = bx + bw/2; dz = bz + (Math.random()-0.5)*bd; break;
          case 2: dx = bx + (Math.random()-0.5)*bw; dz = bz - bd/2; break;
          default: dx = bx + (Math.random()-0.5)*bw; dz = bz + bd/2; break;
        }
        const drip = new THREE.Mesh(dripGeo, dripMat.clone());
        drip.position.set(dx, bh - Math.random() * 1.5, dz);
        drip.userData = {
          baseY: drip.position.y,
          speed: 0.3 + Math.random() * 0.5,
          offset: Math.random() * Math.PI * 2,
          active: Math.random() > 0.3,
        };
        dripGroup.add(drip);
        drips.push(drip);
      }
    });
    scene.add(dripGroup);

    // ── Player Dots with Wet Reflection Glow ──
    const playerGroup = new THREE.Group();
    const playerPositions = [
      { x: -8, z: -5, color: 0x4fc3f7, name: 'Alpha' },
      { x: 5, z: 8, color: 0x81c784, name: 'Beta' },
      { x: 12, z: -8, color: 0xffb74d, name: 'Gamma' },
      { x: -15, z: 10, color: 0xe57373, name: 'Delta' },
      { x: 0, z: 0, color: 0xba68c8, name: 'Command' },
    ];

    playerPositions.forEach(p => {
      const group = new THREE.Group();
      group.position.set(p.x, 0.3, p.z);

      // Main dot
      const dotGeo = new THREE.SphereGeometry(0.35, 16, 16);
      const dotMat = new THREE.MeshStandardMaterial({
        color: p.color,
        emissive: p.color,
        emissiveIntensity: 0.4,
        roughness: 0.2,
        metalness: 0.6,
      });
      const dot = new THREE.Mesh(dotGeo, dotMat);
      dot.position.y = 0.35;
      group.add(dot);

      // Wet reflection glow — larger, translucent sphere
      const glowGeo = new THREE.SphereGeometry(0.7, 16, 16);
      const glowMat = new THREE.MeshBasicMaterial({
        color: p.color,
        transparent: true,
        opacity: 0.12,
      });
      const glow = new THREE.Mesh(glowGeo, glowMat);
      glow.position.y = 0.35;
      group.add(glow);

      // Ground reflection (flattened ellipse)
      const reflGeo = new THREE.CircleGeometry(0.5, 16);
      const reflMat = new THREE.MeshBasicMaterial({
        color: p.color,
        transparent: true,
        opacity: 0.08,
      });
      const refl = new THREE.Mesh(reflGeo, reflMat);
      refl.rotation.x = -Math.PI / 2;
      refl.position.y = 0.02;
      group.add(refl);

      // Pulse ring
      const ringGeo = new THREE.RingGeometry(0.5, 0.55, 32);
      const ringMat = new THREE.MeshBasicMaterial({
        color: p.color,
        transparent: true,
        opacity: 0.25,
        side: THREE.DoubleSide,
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.03;
      group.add(ring);

      group.userData = {
        dot, glow, ring, refl,
        baseColor: new THREE.Color(p.color),
        pulseOffset: Math.random() * Math.PI * 2,
      };
      playerGroup.add(group);
    });
    scene.add(playerGroup);

    // ── Rain Particle System ──
    const RAIN_COUNT = 3000;
    const rainGeo = new THREE.BufferGeometry();
    const rainPositions = new Float32Array(RAIN_COUNT * 3);
    const rainVelocities = new Float32Array(RAIN_COUNT);
    const rainLengths = new Float32Array(RAIN_COUNT);

    for (let i = 0; i < RAIN_COUNT; i++) {
      rainPositions[i * 3] = (Math.random() - 0.5) * 100;
      rainPositions[i * 3 + 1] = Math.random() * 50 + 5;
      rainPositions[i * 3 + 2] = (Math.random() - 0.5) * 100;
      rainVelocities[i] = 0.4 + Math.random() * 0.6;
      rainLengths[i] = 0.3 + Math.random() * 0.7;
    }

    rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPositions, 3));

    // Custom rain shader for streaky lines
    const rainMat = new THREE.ShaderMaterial({
      uniforms: {
        uColor: { value: new THREE.Color(0x8ab4c7) },
        uOpacity: { value: 0.5 },
        uTime: { value: 0 },
        uIntensity: { value: 0.65 },
      },
      vertexShader: `
        attribute float velocity;
        attribute float length;
        uniform float uTime;
        uniform float uIntensity;
        varying float vAlpha;
        void main() {
          vec3 pos = position;
          // Fall motion
          float fall = mod(pos.y - uTime * velocity * (0.5 + uIntensity), 55.0);
          pos.y = fall;
          // Slight wind shear
          pos.x += (1.0 - fall / 55.0) * 3.0 * uIntensity;
          vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
          gl_Position = projectionMatrix * mvPosition;
          // Size based on depth
          gl_PointSize = (2.0 + length * 3.0) * (50.0 / -mvPosition.z);
          vAlpha = 1.0 - smoothstep(45.0, 55.0, fall);
        }
      `,
      fragmentShader: `
        uniform vec3 uColor;
        uniform float uOpacity;
        uniform float uIntensity;
        varying float vAlpha;
        void main() {
          // Streak shape: elongated vertically
          vec2 uv = gl_PointCoord - 0.5;
          float streak = 1.0 - smoothstep(0.0, 0.15, abs(uv.x));
          streak *= 1.0 - smoothstep(0.0, 0.45, abs(uv.y));
          float alpha = streak * uOpacity * vAlpha * (0.3 + uIntensity * 0.7);
          gl_FragColor = vec4(uColor, alpha);
        }
      `,
      transparent: true,
      depthWrite: false,
      blending: THREE.AdditiveBlending,
    });

    // We need to attach custom attributes — but ShaderMaterial with BufferGeometry
    // Let's use a simpler approach: line segments for each rain drop
    const rainLineGeo = new THREE.BufferGeometry();
    const rainLinePositions = new Float32Array(RAIN_COUNT * 6); // 2 points per line, 3 coords each
    rainLineGeo.setAttribute('position', new THREE.BufferAttribute(rainLinePositions, 3));

    const rainLineMat = new THREE.LineBasicMaterial({
      color: 0x8ab4c7,
      transparent: true,
      opacity: 0.35,
      blending: THREE.AdditiveBlending,
      depthWrite: false,
    });
    const rainLines = new THREE.LineSegments(rainLineGeo, rainLineMat);
    scene.add(rainLines);

    // ── Radar Scan (Blue-Gray Tinted) ──
    const radarGroup = new THREE.Group();
    // Main radar disc
    const radarGeo = new THREE.CircleGeometry(18, 64);
    const radarMat = new THREE.MeshBasicMaterial({
      color: 0x2a3a4a,
      transparent: true,
      opacity: 0.15,
      side: THREE.DoubleSide,
    });
    const radarDisc = new THREE.Mesh(radarGeo, radarMat);
    radarDisc.rotation.x = -Math.PI / 2;
    radarDisc.position.y = 0.05;
    radarGroup.add(radarDisc);

    // Radar rings
    for (let r = 4; r <= 16; r += 4) {
      const ringGeo = new THREE.RingGeometry(r - 0.05, r + 0.05, 64);
      const ringMat = new THREE.MeshBasicMaterial({
        color: 0x4a6070,
        transparent: true,
        opacity: 0.2,
        side: THREE.DoubleSide,
      });
      const ring = new THREE.Mesh(ringGeo, ringMat);
      ring.rotation.x = -Math.PI / 2;
      ring.position.y = 0.06;
      radarGroup.add(ring);
    }

    // Radar sweep line
    const sweepGeo = new THREE.PlaneGeometry(18, 0.15);
    const sweepMat = new THREE.MeshBasicMaterial({
      color: 0x6a9ab0,
      transparent: true,
      opacity: 0.5,
      side: THREE.DoubleSide,
    });
    const sweepLine = new THREE.Mesh(sweepGeo, sweepMat);
    sweepLine.rotation.x = -Math.PI / 2;
    sweepLine.position.y = 0.07;
    // Pivot at center
    const sweepPivot = new THREE.Group();
    sweepPivot.add(sweepLine);
    sweepLine.position.x = 9; // half width
    radarGroup.add(sweepPivot);

    // Sweep glow trail (cone sector)
    const trailGeo = new THREE.CircleGeometry(18, 32, 0, Math.PI / 6);
    const trailMat = new THREE.MeshBasicMaterial({
      color: 0x5a8aa0,
      transparent: true,
      opacity: 0.08,
      side: THREE.DoubleSide,
    });
    const trail = new THREE.Mesh(trailGeo, trailMat);
    trail.rotation.x = -Math.PI / 2;
    trail.position.y = 0.08;
    radarGroup.add(trail);

    // Crosshairs
    const crossMat = new THREE.LineBasicMaterial({ color: 0x4a6070, transparent: true, opacity: 0.3 });
    const crossPoints = [];
    crossPoints.push(new THREE.Vector3(-18, 0.06, 0), new THREE.Vector3(18, 0.06, 0));
    crossPoints.push(new THREE.Vector3(0, 0.06, -18), new THREE.Vector3(0, 0.06, 18));
    const crossGeo = new THREE.BufferGeometry().setFromPoints(crossPoints);
    radarGroup.add(new THREE.LineSegments(crossGeo, crossMat));

    radarGroup.position.set(0, 0, 0);
    scene.add(radarGroup);

    // ── Rain Intensity Slider ──
    const slider = document.getElementById('rain-slider');
    const rainValue = document.getElementById('rain-value');
    const visValue = document.getElementById('vis-value');
    let rainIntensity = parseInt(slider.value) / 100;

    slider.addEventListener('input', (e) => {
      const val = parseInt(e.target.value);
      rainIntensity = val / 100;
      rainValue.textContent = val + '%';
      // Update visibility text
      const vis = (5.0 - rainIntensity * 4.5).toFixed(1);
      visValue.textContent = vis + 'km';
      // Update particle count display
      const count = Math.floor(RAIN_COUNT * (0.2 + rainIntensity * 0.8));
      document.getElementById('particle-count').textContent = count;
    });

    // ── Animation Loop ──
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const time = clock.getElapsedTime();
      const delta = clock.getDelta();

      // Animate rain lines
      const positions = rainLines.geometry.attributes.position.array;
      const activeCount = Math.floor(RAIN_COUNT * (0.2 + rainIntensity * 0.8));
      for (let i = 0; i < activeCount; i++) {
        const idx = i * 6;
        const vx = rainVelocities[i];
        const len = rainLengths[i];
        const fallSpeed = vx * (0.5 + rainIntensity) * 20;

        // Top point
        let x = positions[idx];
        let y = positions[idx + 1];
        let z = positions[idx + 2];

        if (y === 0 && x === 0) {
          // Initialize
          x = (Math.random() - 0.5) * 100;
          y = 5 + Math.random() * 45;
          z = (Math.random() - 0.5) * 100;
        }

        y -= fallSpeed * 0.016;
        x += rainIntensity * 0.03; // wind

        if (y < 0) {
          x = (Math.random() - 0.5) * 100;
          y = 45 + Math.random() * 10;
          z = (Math.random() - 0.5) * 100;
        }

        positions[idx] = x;
        positions[idx + 1] = y;
        positions[idx + 2] = z;

        // Bottom point (streak)
        positions[idx + 3] = x - rainIntensity * 0.15;
        positions[idx + 4] = y - len * (0.8 + rainIntensity);
        positions[idx + 5] = z;
      }
      // Hide unused
      for (let i = activeCount; i < RAIN_COUNT; i++) {
        const idx = i * 6;
        positions[idx] = 0; positions[idx + 1] = -100; positions[idx + 2] = 0;
        positions[idx + 3] = 0; positions[idx + 4] = -100; positions[idx + 5] = 0;
      }
      rainLines.geometry.attributes.position.needsUpdate = true;
      rainLineMat.opacity = 0.15 + rainIntensity * 0.35;

      // Animate drips
      drips.forEach(drip => {
        if (!drip.userData.active) return;
        const t = time * drip.userData.speed + drip.userData.offset;
        const cycle = t % (Math.PI * 2);
        if (cycle < 1) {
          drip.position.y = drip.userData.baseY - cycle * 1.5;
          drip.material.opacity = 0.6 * (1 - cycle);
          drip.scale.y = 1 + cycle * 2;
        } else {
          drip.position.y = drip.userData.baseY;
          drip.material.opacity = 0;
        }
      });

      // Animate player glow/reflection
      playerGroup.children.forEach(group => {
        const data = group.userData;
        const pulse = Math.sin(time * 2 + data.pulseOffset) * 0.5 + 0.5;
        data.glow.material.opacity = 0.08 + pulse * 0.1;
        data.glow.scale.setScalar(1 + pulse * 0.15);
        data.refl.material.opacity = 0.05 + pulse * 0.06;
        const ringScale = 1 + pulse * 0.5;
        data.ring.scale.set(ringScale, ringScale, 1);
        data.ring.material.opacity = 0.15 + pulse * 0.15;
      });

      // Animate radar sweep
      sweepPivot.rotation.y = -time * 1.2;
      trail.rotation.z = -time * 1.2;

      // Subtle camera drift
      camera.position.x += Math.sin(time * 0.15) * 0.008;
      camera.position.z += Math.cos(time * 0.12) * 0.008;

      controls.update();
      renderer.render(scene, camera);
    }

    // Handle resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
