<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Loading V6 — Particle Signal</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', Courier, monospace;
      color: #0f0;
    }
    #canvas-container {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }
    #ui {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      padding-bottom: 60px;
    }
    #hud-top {
      position: fixed;
      top: 20px; left: 20px;
      z-index: 2;
      font-size: 12px;
      letter-spacing: 2px;
      opacity: 0.7;
    }
    #progress-container {
      width: 320px;
      text-align: center;
    }
    #progress-bar-bg {
      width: 100%; height: 4px;
      background: rgba(0,255,0,0.15);
      border: 1px solid rgba(0,255,0,0.3);
      margin-bottom: 10px;
      position: relative;
    }
    #progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #0f0;
      box-shadow: 0 0 10px #0f0;
      transition: width 0.1s linear;
    }
    #progress-digits {
      font-size: 11px;
      letter-spacing: 4px;
      opacity: 0.8;
    }
    #status-text {
      margin-top: 8px;
      font-size: 10px;
      letter-spacing: 3px;
      opacity: 0.5;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div id="hud-top">LOADING V6</div>
  <div id="canvas-container"></div>
  <div id="ui">
    <div id="progress-container">
      <div id="progress-bar-bg">
        <div id="progress-bar-fill"></div>
      </div>
      <div id="progress-digits">0000000000</div>
      <div id="status-text">INITIALIZING PARTICLE FIELD</div>
    </div>
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function() {
      // ─── Scene Setup ───
      const container = document.getElementById('canvas-container');
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x000000, 0.02);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 40;

      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      container.appendChild(renderer.domElement);

      // ─── Particle System ───
      const PARTICLE_COUNT = 1200;
      const positions = new Float32Array(PARTICLE_COUNT * 3);
      const colors = new Float32Array(PARTICLE_COUNT * 3);
      const sizes = new Float32Array(PARTICLE_COUNT);
      const velocities = new Float32Array(PARTICLE_COUNT * 3);
      const randoms = new Float32Array(PARTICLE_COUNT);

      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const i3 = i * 3;
        // Start in a vortex cylinder
        const angle = Math.random() * Math.PI * 2;
        const radius = Math.random() * 15 + 2;
        positions[i3] = Math.cos(angle) * radius;
        positions[i3 + 1] = (Math.random() - 0.5) * 40 - 20;
        positions[i3 + 2] = Math.sin(angle) * radius;

        // Green base color
        colors[i3] = 0.0;
        colors[i3 + 1] = 1.0;
        colors[i3 + 2] = 0.2;

        sizes[i] = Math.random() * 2 + 0.5;
        randoms[i] = Math.random();

        velocities[i3] = (Math.random() - 0.5) * 0.02;
        velocities[i3 + 1] = Math.random() * 0.05 + 0.02;
        velocities[i3 + 2] = (Math.random() - 0.5) * 0.02;
      }

      const geometry = new THREE.BufferGeometry();
      geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
      geometry.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

      // Custom shader material for glowing particles
      const particleMaterial = new THREE.ShaderMaterial({
        uniforms: {
          uTime: { value: 0 },
          uProgress: { value: 0 },
          uLogoForm: { value: 0 }
        },
        vertexShader: `
          attribute float size;
          attribute vec3 color;
          varying vec3 vColor;
          varying float vAlpha;
          uniform float uTime;
          uniform float uProgress;
          uniform float uLogoForm;

          void main() {
            vColor = color;
            vec3 pos = position;

            // Vortex swirl during loading
            float swirl = uProgress < 1.0 ? 1.0 : 0.0;
            float angle = uTime * 0.5 + pos.y * 0.1;
            float c = cos(angle * swirl);
            float s = sin(angle * swirl);
            mat2 rot = mat2(c, -s, s, c);
            pos.xz = rot * pos.xz;

            vec4 mvPosition = modelViewMatrix * vec4(pos, 1.0);
            gl_PointSize = size * (300.0 / -mvPosition.z);
            gl_Position = projectionMatrix * mvPosition;

            vAlpha = 1.0;
          }
        `,
        fragmentShader: `
          varying vec3 vColor;
          varying float vAlpha;

          void main() {
            float dist = length(gl_PointCoord - vec2(0.5));
            if (dist > 0.5) discard;
            float glow = 1.0 - dist * 2.0;
            glow = pow(glow, 1.5);
            gl_FragColor = vec4(vColor, vAlpha * glow);
          }
        `,
        transparent: true,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      const particles = new THREE.Points(geometry, particleMaterial);
      scene.add(particles);

      // ─── Logo Target Positions (SIGNAL LOST) ───
      // Pixel-art representation of "SIGNAL LOST" in a 64×16 grid
      const LOGO_TEXT = [
        "  ███████  ██ ███████  ██████   █████   ████      ██       █████   ██████  ███████  ████████",
        " ██       ███ ██   ██ ██       ██   ██ ██  ██    ████     ██   ██ ██       ██   ██ ██      ",
        "  ██████   ██ ███████ ██  ███  ███████ ██████   ██  ██    ███████  ██████  ███████  ██████ ",
        "       ██  ██ ██      ██   ██  ██   ██ ██  ██  ████████   ██   ██       ██ ██           ██",
        " ███████   ██ ██       ██████  ██   ██ ██  ██ ██      ██ ██   ██  ██████  ██      ██████ "
      ];

      const logoTargets = [];
      const logoRows = LOGO_TEXT.length;
      const logoCols = LOGO_TEXT[0].length;
      const logoScale = 0.35;
      const logoOffsetX = -(logoCols * logoScale) / 2;
      const logoOffsetY = (logoRows * logoScale) / 2;

      for (let row = 0; row < logoRows; row++) {
        for (let col = 0; col < logoCols; col++) {
          if (LOGO_TEXT[row][col] !== ' ') {
            logoTargets.push({
              x: logoOffsetX + col * logoScale,
              y: logoOffsetY - row * logoScale,
              z: 0
            });
          }
        }
      }

      // ─── State ───
      let progress = 0;
      let logoForming = false;
      let logoFormProgress = 0;
      const startTime = Date.now();
      const loadDuration = 5000; // 5 seconds loading

      // ─── UI Elements ───
      const progressFill = document.getElementById('progress-bar-fill');
      const progressDigits = document.getElementById('progress-digits');
      const statusText = document.getElementById('status-text');
      const statusMessages = [
        'INITIALIZING PARTICLE FIELD',
        'CALIBRATING VORTEX DYNAMICS',
        'SYNCHRONIZING SIGNAL STREAMS',
        'OPTIMIZING PARTICLE TRAJECTORIES',
        'FINALIZING LOGO CONSTRUCT'
      ];

      function updateUI(pct) {
        progressFill.style.width = pct + '%';
        const bin = Math.floor(pct * 10.23).toString(2).padStart(10, '0');
        progressDigits.textContent = bin;
        const msgIndex = Math.min(Math.floor(pct / 20), statusMessages.length - 1);
        statusText.textContent = statusMessages[msgIndex];
      }

      // ─── Animation Loop ───
      function animate() {
        requestAnimationFrame(animate);

        const now = Date.now();
        const elapsed = now - startTime;
        const time = elapsed * 0.001;

        // Update progress
        if (!logoForming) {
          progress = Math.min(elapsed / loadDuration, 1);
          updateUI(progress * 100);

          if (progress >= 1) {
            logoForming = true;
            statusText.textContent = 'SIGNAL ACQUIRED';
            statusText.style.opacity = '1';
            statusText.style.color = '#0ff';
          }
        } else {
          logoFormProgress = Math.min(logoFormProgress + 0.015, 1);
        }

        particleMaterial.uniforms.uTime.value = time;
        particleMaterial.uniforms.uProgress.value = progress;
        particleMaterial.uniforms.uLogoForm.value = logoFormProgress;

        const posArray = geometry.attributes.position.array;
        const colArray = geometry.attributes.color.array;

        for (let i = 0; i < PARTICLE_COUNT; i++) {
          const i3 = i * 3;

          if (!logoForming) {
            // Vortex + upward float
            const angle = time * 0.5 + posArray[i3 + 1] * 0.1;
            const radius = Math.sqrt(posArray[i3] * posArray[i3] + posArray[i3 + 2] * posArray[i3 + 2]);
            const swirlStrength = 1.0 - progress * 0.3;

            // Upward movement
            posArray[i3 + 1] += velocities[i3 + 1] * (1 + progress);

            // Spiral
            const spiralAngle = angle + randoms[i] * Math.PI * 2;
            posArray[i3] = Math.cos(spiralAngle) * radius;
            posArray[i3 + 2] = Math.sin(spiralAngle) * radius;

            // Reset if too high
            if (posArray[i3 + 1] > 25) {
              posArray[i3 + 1] = -25;
              const newAngle = Math.random() * Math.PI * 2;
              const newRadius = Math.random() * 15 + 2;
              posArray[i3] = Math.cos(newAngle) * newRadius;
              posArray[i3 + 2] = Math.sin(newAngle) * newRadius;
            }

            // Color shift: green → teal
            const tealShift = progress;
            colArray[i3] = tealShift * 0.0;
            colArray[i3 + 1] = 1.0 - tealShift * 0.3;
            colArray[i3 + 2] = 0.2 + tealShift * 0.8;

          } else {
            // Form logo
            const targetIndex = i % logoTargets.length;
            const target = logoTargets[targetIndex];
            const noise = (1 - logoFormProgress) * (Math.random() - 0.5) * 5;

            posArray[i3] += (target.x - posArray[i3]) * 0.05 + noise * 0.1;
            posArray[i3 + 1] += (target.y - posArray[i3 + 1]) * 0.05 + noise * 0.1;
            posArray[i3 + 2] += (target.z - posArray[i3 + 2]) * 0.05;

            // Settle to teal
            colArray[i3] = 0.0;
            colArray[i3 + 1] = 0.7;
            colArray[i3 + 2] = 1.0;
          }
        }

        geometry.attributes.position.needsUpdate = true;
        geometry.attributes.color.needsUpdate = true;

        // Subtle camera movement
        camera.position.x = Math.sin(time * 0.2) * 2;
        camera.position.y = Math.cos(time * 0.15) * 1;
        camera.lookAt(0, 0, 0);

        renderer.render(scene, camera);
      }

      animate();

      // ─── Resize Handler ───
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();
  </script>
</body>
</html>
