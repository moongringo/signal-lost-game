<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RADAR V8 — 3D Orbit Radar</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #000;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }
    #container {
      width: 100vw;
      height: 100vh;
    }
    #hud {
      position: absolute;
      top: 18px;
      left: 50%;
      transform: translateX(-50%);
      color: #00ffcc;
      font-size: 22px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 0 8px rgba(0,255,204,0.6), 0 0 18px rgba(0,255,204,0.3);
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
    #hint {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(0,255,204,0.55);
      font-size: 12px;
      letter-spacing: 1.5px;
      pointer-events: none;
      user-select: none;
      z-index: 10;
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="hud">RADAR V8</div>
  <div id="hint">Drag to rotate &middot; Scroll to zoom &middot; Right-drag to pan</div>
  <div id="container"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const container = document.getElementById('container');

    // Scene
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x060a10);
    scene.fog = new THREE.FogExp2(0x060a10, 0.018);

    // Camera
    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.1, 500);
    camera.position.set(18, 16, 22);

    // Renderer
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    container.appendChild(renderer.domElement);

    // Controls
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.08;
    controls.minDistance = 6;
    controls.maxDistance = 60;
    controls.target.set(0, 0, 0);
    controls.maxPolarAngle = Math.PI / 2 - 0.04;

    // Helpers
    const rand = (a, b) => a + Math.random() * (b - a);
    const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));

    // Terrain height using sine noise
    function terrainHeight(x, z) {
      const s1 = Math.sin(x * 0.35 + z * 0.22) * 1.4;
      const s2 = Math.sin(x * 0.72 - z * 0.55) * 0.7;
      const s3 = Math.sin((x + z) * 0.18) * 0.9;
      const s4 = Math.sin(x * 1.1 + z * 0.9) * 0.25;
      return s1 + s2 + s3 + s4;
    }

    // Terrain mesh
    const terrainSize = 60;
    const terrainSegs = 160;
    const terrainGeo = new THREE.PlaneGeometry(terrainSize, terrainSize, terrainSegs, terrainSegs);
    terrainGeo.rotateX(-Math.PI / 2);
    const posAttr = terrainGeo.attributes.position;
    for (let i = 0; i < posAttr.count; i++) {
      const x = posAttr.getX(i);
      const z = posAttr.getZ(i);
      posAttr.setY(i, terrainHeight(x, z));
    }
    terrainGeo.computeVertexNormals();

    const terrainMat = new THREE.MeshStandardMaterial({
      color: 0x1a2e1a,
      roughness: 0.95,
      metalness: 0.05,
      flatShading: true,
    });
    const terrain = new THREE.Mesh(terrainGeo, terrainMat);
    terrain.receiveShadow = true;
    scene.add(terrain);

    // Water / base plane for shadow consistency
    const baseGeo = new THREE.PlaneGeometry(terrainSize * 1.5, terrainSize * 1.5);
    baseGeo.rotateX(-Math.PI / 2);
    const baseMat = new THREE.MeshStandardMaterial({ color: 0x0b1218, roughness: 1, metalness: 0 });
    const basePlane = new THREE.Mesh(baseGeo, baseMat);
    basePlane.position.y = -3.5;
    basePlane.receiveShadow = true;
    scene.add(basePlane);

    // Buildings
    const buildingColors = [0x8899aa, 0x667788, 0x556677, 0x445566, 0x99aabb];
    const buildings = [];
    function addBuilding(x, z) {
      const y = terrainHeight(x, z);
      const w = rand(0.6, 1.4);
      const d = rand(0.6, 1.4);
      const h = rand(2.5, 7.5);
      const geo = new THREE.BoxGeometry(w, h, d);
      const mat = new THREE.MeshStandardMaterial({
        color: buildingColors[Math.floor(Math.random() * buildingColors.length)],
        roughness: 0.6,
        metalness: 0.2,
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.set(x, y + h / 2, z);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      buildings.push(mesh);

      // Window-like emissive strips on some buildings
      if (Math.random() > 0.5) {
        const winGeo = new THREE.BoxGeometry(w + 0.04, h * 0.6, d + 0.04);
        const winMat = new THREE.MeshStandardMaterial({
          color: 0x00ffcc,
          emissive: 0x00ffcc,
          emissiveIntensity: 0.25,
          roughness: 0.3,
          metalness: 0.8,
          transparent: true,
          opacity: 0.25,
        });
        const win = new THREE.Mesh(winGeo, winMat);
        win.position.set(x, y + h / 2, z);
        scene.add(win);
      }
    }

    // Trees (cone + cylinder)
    function addTree(x, z) {
      const y = terrainHeight(x, z);
      const trunkH = rand(0.6, 1.2);
      const trunkR = rand(0.08, 0.14);
      const trunkGeo = new THREE.CylinderGeometry(trunkR * 0.7, trunkR, trunkH, 8);
      const trunkMat = new THREE.MeshStandardMaterial({ color: 0x5c4033, roughness: 0.95 });
      const trunk = new THREE.Mesh(trunkGeo, trunkMat);
      trunk.position.set(x, y + trunkH / 2, z);
      trunk.castShadow = true;
      trunk.receiveShadow = true;
      scene.add(trunk);

      const coneH = rand(1.2, 2.2);
      const coneR = rand(0.5, 0.9);
      const coneGeo = new THREE.ConeGeometry(coneR, coneH, 10);
      const coneMat = new THREE.MeshStandardMaterial({ color: 0x2d5a27, roughness: 0.85, flatShading: true });
      const cone = new THREE.Mesh(coneGeo, coneMat);
      cone.position.set(x, y + trunkH + coneH / 2 - 0.1, z);
      cone.castShadow = true;
      cone.receiveShadow = true;
      scene.add(cone);
    }

    // Scatter buildings and trees
    for (let i = 0; i < 90; i++) {
      const x = rand(-22, 22);
      const z = rand(-22, 22);
      if (Math.sqrt(x * x + z * z) < 3.5) continue; // keep center clear
      if (Math.random() > 0.35) {
        addBuilding(x, z);
      } else {
        addTree(x, z);
      }
    }

    // Central radar installation
    (function addRadarBase() {
      const y = terrainHeight(0, 0);
      // Platform
      const platGeo = new THREE.CylinderGeometry(2.2, 2.6, 0.6, 32);
      const platMat = new THREE.MeshStandardMaterial({ color: 0x334455, roughness: 0.5, metalness: 0.4 });
      const plat = new THREE.Mesh(platGeo, platMat);
      plat.position.set(0, y + 0.3, 0);
      plat.receiveShadow = true;
      plat.castShadow = true;
      scene.add(plat);

      // Tower
      const towerGeo = new THREE.CylinderGeometry(0.35, 0.55, 3.5, 16);
      const towerMat = new THREE.MeshStandardMaterial({ color: 0x556677, roughness: 0.4, metalness: 0.5 });
      const tower = new THREE.Mesh(towerGeo, towerMat);
      tower.position.set(0, y + 0.6 + 3.5 / 2, 0);
      tower.castShadow = true;
      tower.receiveShadow = true;
      scene.add(tower);

      // Dish arm
      const armGeo = new THREE.BoxGeometry(0.15, 2.8, 0.15);
      const armMat = new THREE.MeshStandardMaterial({ color: 0x667788, roughness: 0.4, metalness: 0.5 });
      const arm = new THREE.Mesh(armGeo, armMat);
      arm.position.set(0, y + 0.6 + 3.5 + 0.2, 0);
      arm.castShadow = true;
      scene.add(arm);

      // Dish
      const dishGeo = new THREE.SphereGeometry(1.3, 32, 16, 0, Math.PI * 2, 0, Math.PI / 2.2);
      const dishMat = new THREE.MeshStandardMaterial({
        color: 0xeeeeee,
        roughness: 0.25,
        metalness: 0.7,
        side: THREE.DoubleSide,
      });
      const dish = new THREE.Mesh(dishGeo, dishMat);
      dish.position.set(0, y + 0.6 + 3.5 + 1.2, 0);
      dish.rotation.x = Math.PI;
      dish.castShadow = true;
      dish.receiveShadow = true;
      scene.add(dish);

      // Dish rim glow
      const rimGeo = new THREE.TorusGeometry(1.3, 0.04, 12, 48);
      const rimMat = new THREE.MeshStandardMaterial({ color: 0x00ffcc, emissive: 0x00ffcc, emissiveIntensity: 0.8 });
      const rim = new THREE.Mesh(rimGeo, rimMat);
      rim.position.set(0, y + 0.6 + 3.5 + 1.2 - 0.05, 0);
      rim.rotation.x = Math.PI / 2;
      scene.add(rim);

      // Spinning group for dish + rim
      const spinGroup = new THREE.Group();
      spinGroup.add(dish);
      spinGroup.add(rim);
      spinGroup.position.set(0, y + 0.6 + 3.5 + 1.2, 0);
      // re-center children relative to group
      dish.position.set(0, 0, 0);
      rim.position.set(0, -0.05, 0);
      scene.add(spinGroup);

      // Sweep plane (radar scan)
      const sweepGeo = new THREE.CircleGeometry(1.28, 48);
      const sweepMat = new THREE.MeshBasicMaterial({
        color: 0x00ffcc,
        transparent: true,
        opacity: 0.18,
        side: THREE.DoubleSide,
        depthWrite: false,
      });
      const sweep = new THREE.Mesh(sweepGeo, sweepMat);
      sweep.rotation.x = -Math.PI / 2;
      sweep.position.y = 0.02;
      spinGroup.add(sweep);

      // Beacon light on top
      const beaconGeo = new THREE.SphereGeometry(0.12, 16, 16);
      const beaconMat = new THREE.MeshStandardMaterial({ color: 0xff3333, emissive: 0xff3333, emissiveIntensity: 1.2 });
      const beacon = new THREE.Mesh(beaconGeo, beaconMat);
      beacon.position.set(0, y + 0.6 + 3.5 + 2.6, 0);
      scene.add(beacon);

      // Point light at beacon
      const beaconLight = new THREE.PointLight(0xff3333, 2, 8);
      beaconLight.position.copy(beacon.position);
      scene.add(beaconLight);

      // Animate
      scene.userData.radarSpin = spinGroup;
      scene.userData.beaconMat = beaconMat;
      scene.userData.beaconLight = beaconLight;
    })();

    // Cinematic lighting
    const ambient = new THREE.AmbientLight(0x223344, 0.6);
    scene.add(ambient);

    const hemi = new THREE.HemisphereLight(0x88bbff, 0x112211, 0.5);
    scene.add(hemi);

    const dir = new THREE.DirectionalLight(0xfff5e6, 2.2);
    dir.position.set(18, 28, 12);
    dir.castShadow = true;
    dir.shadow.mapSize.width = 2048;
    dir.shadow.mapSize.height = 2048;
    dir.shadow.camera.near = 0.5;
    dir.shadow.camera.far = 80;
    dir.shadow.camera.left = -30;
    dir.shadow.camera.right = 30;
    dir.shadow.camera.top = 30;
    dir.shadow.camera.bottom = -30;
    dir.shadow.bias = -0.0005;
    scene.add(dir);

    const fill = new THREE.DirectionalLight(0x4466aa, 0.6);
    fill.position.set(-12, 10, -8);
    scene.add(fill);

    // Rim light for drama
    const rim = new THREE.SpotLight(0x00ffcc, 1.5, 50, Math.PI / 5, 0.6, 1);
    rim.position.set(-10, 18, -14);
    rim.target.position.set(0, 0, 0);
    rim.castShadow = true;
    scene.add(rim);
    scene.add(rim.target);

    // Grid helper (subtle)
    const grid = new THREE.GridHelper(terrainSize, 60, 0x00ffcc, 0x112233);
    grid.position.y = -0.05;
    grid.material.transparent = true;
    grid.material.opacity = 0.12;
    scene.add(grid);

    // Resize
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Animation loop
    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();

      controls.update();

      if (scene.userData.radarSpin) {
        scene.userData.radarSpin.rotation.y -= 1.8 * 0.016; // ~1.8 rad/s
      }

      if (scene.userData.beaconMat) {
        const pulse = (Math.sin(t * 4) + 1) * 0.5;
        scene.userData.beaconMat.emissiveIntensity = 0.6 + pulse * 1.2;
      }
      if (scene.userData.beaconLight) {
        const pulse = (Math.sin(t * 4) + 1) * 0.5;
        scene.userData.beaconLight.intensity = 1 + pulse * 2;
      }

      renderer.render(scene, camera);
    }
    animate();
  </script>
</body>
</html>
