<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Maplayer V7 — Signal</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0a0a0a;
    color:#eee;
    font-family:'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow:hidden;
    height:100vh;
    width:100vw;
  }
  #map-container {
    position:relative;
    width:100%;
    height:100%;
  }
  canvas#mapCanvas {
    display:block;
    width:100%;
    height:100%;
  }
  /* HUD Overlay */
  .hud {
    position:absolute;
    top:0; left:0; width:100%; height:100%;
    pointer-events:none;
    z-index:10;
  }
  .hud-top {
    position:absolute;
    top:16px; left:16px; right:16px;
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    pointer-events:none;
  }
  .hud-title {
    font-size:1.1rem;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#0f0;
    text-shadow:0 0 6px #0f0, 0 0 12px #0f0;
  }
  .hud-coords {
    font-size:0.75rem;
    color:#888;
    margin-top:4px;
    font-family:monospace;
  }
  .hud-legend {
    display:flex;
    gap:12px;
    align-items:center;
    background:rgba(0,0,0,0.6);
    padding:6px 10px;
    border-radius:4px;
    border:1px solid #333;
  }
  .legend-item {
    display:flex;
    align-items:center;
    gap:6px;
    font-size:0.75rem;
    color:#ccc;
  }
  .legend-box {
    width:14px; height:14px;
    border-radius:2px;
    border:1px solid #555;
  }
  .legend-box.green { background:#2ecc40; }
  .legend-box.yellow { background:#ffdc00; }
  .legend-box.red { background:#ff4136; }
  .legend-box.dead {
    background:repeating-linear-gradient(
      45deg,
      #ff4136,
      #ff4136 2px,
      transparent 2px,
      transparent 6px
    );
    border-color:#ff4136;
  }

  .hud-bottom {
    position:absolute;
    bottom:16px; left:16px; right:16px;
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    pointer-events:none;
  }
  .hud-toggles {
    display:flex;
    gap:10px;
    pointer-events:auto;
  }
  .toggle-btn {
    background:rgba(0,0,0,0.7);
    border:1px solid #444;
    color:#ccc;
    padding:8px 14px;
    border-radius:4px;
    cursor:pointer;
    font-size:0.8rem;
    letter-spacing:1px;
    transition:all .2s;
    text-transform:uppercase;
  }
  .toggle-btn:hover { border-color:#0f0; color:#0f0; }
  .toggle-btn.active {
    border-color:#0f0;
    color:#0f0;
    box-shadow:0 0 8px rgba(0,255,0,0.3);
  }
  .hud-readout {
    text-align:right;
    font-family:monospace;
    font-size:0.75rem;
    color:#888;
    line-height:1.4;
  }
  .readout-strong { color:#2ecc40; }
  .readout-weak { color:#ffdc00; }
  .readout-none { color:#ff4136; }

  /* Scanline overlay */
  .scanlines {
    position:absolute;
    top:0; left:0; width:100%; height:100%;
    pointer-events:none;
    z-index:20;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.08) 2px,
      rgba(0,0,0,0.08) 4px
    );
  }
</style>
</head>
<body>
<div id="map-container">
  <canvas id="mapCanvas"></canvas>
  <div class="hud">
    <div class="hud-top">
      <div>
        <div class="hud-title">Maplayer V7 — Signal</div>
        <div class="hud-coords" id="coords">GRID: -- | --</div>
      </div>
      <div class="hud-legend">
        <div class="legend-item"><div class="legend-box green"></div> Strong</div>
        <div class="legend-item"><div class="legend-box yellow"></div> Weak</div>
        <div class="legend-item"><div class="legend-box red"></div> No Signal</div>
        <div class="legend-item"><div class="legend-box dead"></div> Dead Zone</div>
      </div>
    </div>
    <div class="hud-bottom">
      <div class="hud-toggles">
        <button class="toggle-btn active" id="btn-coverage">Show Coverage</button>
        <button class="toggle-btn active" id="btn-deadzones">Show Dead Zones</button>
      </div>
      <div class="hud-readout" id="readout">
        <div class="readout-strong">● Strong: 3 players</div>
        <div class="readout-weak">● Weak: 2 players</div>
        <div class="readout-none">● No Signal: 1 player</div>
      </div>
    </div>
  </div>
  <div class="scanlines"></div>
</div>

<script>
(() => {
  const canvas = document.getElementById('mapCanvas');
  const ctx = canvas.getContext('2d');
  const coordsEl = document.getElementById('coords');
  const readoutEl = document.getElementById('readout');
  const btnCoverage = document.getElementById('btn-coverage');
  const btnDeadZones = document.getElementById('btn-deadzones');

  let W, H;
  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Configuration
  const SHOW_COVERAGE = { value: true };
  const SHOW_DEADZONES = { value: true };

  btnCoverage.addEventListener('click', () => {
    SHOW_COVERAGE.value = !SHOW_COVERAGE.value;
    btnCoverage.classList.toggle('active', SHOW_COVERAGE.value);
  });
  btnDeadZones.addEventListener('click', () => {
    SHOW_DEADZONES.value = !SHOW_DEADZONES.value;
    btnDeadZones.classList.toggle('active', SHOW_DEADZONES.value);
  });

  // Towers
  const towers = [
    { x: 0.25, y: 0.30, range: 0.22, strength: 1.0 },
    { x: 0.70, y: 0.25, range: 0.18, strength: 0.9 },
    { x: 0.50, y: 0.65, range: 0.25, strength: 1.0 },
    { x: 0.15, y: 0.75, range: 0.15, strength: 0.7 },
    { x: 0.85, y: 0.70, range: 0.20, strength: 0.85 },
  ];

  // Players
  const players = [
    { x: 0.22, y: 0.28, name: 'Alpha' },
    { x: 0.68, y: 0.30, name: 'Bravo' },
    { x: 0.52, y: 0.62, name: 'Charlie' },
    { x: 0.48, y: 0.40, name: 'Delta' },
    { x: 0.80, y: 0.75, name: 'Echo' },
    { x: 0.12, y: 0.55, name: 'Foxtrot' },
  ];

  // Dead zones (rectangles in normalized coords)
  const deadZones = [
    { x: 0.35, y: 0.15, w: 0.12, h: 0.18 },
    { x: 0.60, y: 0.45, w: 0.10, h: 0.14 },
    { x: 0.10, y: 0.85, w: 0.15, h: 0.10 },
  ];

  // Terrain blocking (hills/mountains) - circles that reduce signal
  const terrainBlocks = [
    { x: 0.40, y: 0.50, radius: 0.12, block: 0.6 },
    { x: 0.75, y: 0.50, radius: 0.08, block: 0.4 },
    { x: 0.30, y: 0.15, radius: 0.06, block: 0.3 },
  ];

  // Noise for terrain heat gradient
  function noise(x, y) {
    return Math.sin(x * 12.9898 + y * 78.233) * 43758.5453 % 1;
  }

  function smoothNoise(x, y) {
    const ix = Math.floor(x);
    const iy = Math.floor(y);
    const fx = x - ix;
    const fy = y - iy;
    const a = noise(ix, iy);
    const b = noise(ix + 1, iy);
    const c = noise(ix, iy + 1);
    const d = noise(ix + 1, iy + 1);
    const ux = fx * fx * (3 - 2 * fx);
    const uy = fy * fy * (3 - 2 * fy);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }

  function getTerrainBlock(nx, ny) {
    let block = 0;
    for (const t of terrainBlocks) {
      const dx = nx - t.x;
      const dy = ny - t.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < t.radius) {
        block = Math.max(block, t.block * (1 - dist / t.radius));
      }
    }
    return block;
  }

  function getSignalStrength(nx, ny) {
    // Check dead zones
    for (const dz of deadZones) {
      if (nx >= dz.x && nx <= dz.x + dz.w && ny >= dz.y && ny <= dz.y + dz.h) {
        return -1; // dead zone
      }
    }

    let maxSignal = 0;
    for (const tower of towers) {
      const dx = nx - tower.x;
      const dy = ny - tower.y;
      const dist = Math.sqrt(dx * dx + dy * dy);
      if (dist < tower.range) {
        const signal = tower.strength * (1 - dist / tower.range);
        maxSignal = Math.max(maxSignal, signal);
      }
    }

    // Apply terrain blocking
    const block = getTerrainBlock(nx, ny);
    maxSignal = maxSignal * (1 - block);

    return maxSignal;
  }

  // Precompute signal grid for heat gradient
  const GRID_SIZE = 80;
  let signalGrid = [];
  function computeSignalGrid() {
    signalGrid = [];
    for (let gy = 0; gy < GRID_SIZE; gy++) {
      const row = [];
      for (let gx = 0; gx < GRID_SIZE; gx++) {
        const nx = gx / GRID_SIZE;
        const ny = gy / GRID_SIZE;
        row.push(getSignalStrength(nx, ny));
      }
      signalGrid.push(row);
    }
  }
  computeSignalGrid();

  let time = 0;
  let mouseX = 0, mouseY = 0;
  canvas.addEventListener('mousemove', e => {
    mouseX = e.clientX;
    mouseY = e.clientY;
    const nx = (mouseX / W).toFixed(2);
    const ny = (mouseY / H).toFixed(2);
    coordsEl.textContent = `GRID: ${nx} | ${ny}`;
  });

  function drawTerrainHeat() {
    if (!SHOW_COVERAGE.value) return;

    const cellW = W / GRID_SIZE;
    const cellH = H / GRID_SIZE;

    for (let gy = 0; gy < GRID_SIZE; gy++) {
      for (let gx = 0; gx < GRID_SIZE; gx++) {
        const signal = signalGrid[gy][gx];
        let r, g, b, a;

        if (signal < 0) {
          // Dead zone - dark red
          r = 80; g = 20; b = 20; a = 0.35;
        } else if (signal > 0.5) {
          // Strong - green
          const t = (signal - 0.5) * 2;
          r = 46; g = 204 + (51 - 204) * (1 - t); b = 64;
          a = 0.15 + t * 0.15;
        } else if (signal > 0.2) {
          // Weak - yellow
          const t = (signal - 0.2) / 0.3;
          r = 255; g = 220; b = 0;
          a = 0.12 + t * 0.1;
        } else if (signal > 0) {
          // Very weak - orange/red mix
          const t = signal / 0.2;
          r = 255; g = 65 + 155 * t; b = 54;
          a = 0.1;
        } else {
          // No signal
          r = 60; g = 20; b = 20; a = 0.08;
        }

        // Add terrain noise
        const n = smoothNoise(gx * 0.3 + time * 0.02, gy * 0.3);
        a *= (0.85 + n * 0.3);

        ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
        ctx.fillRect(gx * cellW, gy * cellH, cellW + 1, cellH + 1);
      }
    }
  }

  function drawTerrainBlocking() {
    for (const t of terrainBlocks) {
      const cx = t.x * W;
      const cy = t.y * H;
      const r = t.radius * Math.min(W, H);

      const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
      grad.addColorStop(0, `rgba(80, 60, 40, ${0.3 + t.block * 0.3})`);
      grad.addColorStop(0.7, `rgba(60, 45, 30, ${0.15 + t.block * 0.2})`);
      grad.addColorStop(1, 'rgba(60, 45, 30, 0)');

      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.fill();

      // Terrain contour lines
      ctx.strokeStyle = `rgba(100, 80, 50, ${0.2 + t.block * 0.2})`;
      ctx.lineWidth = 1;
      for (let i = 0.3; i <= 1; i += 0.25) {
        ctx.beginPath();
        ctx.arc(cx, cy, r * i, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  }

  function drawDeadZones() {
    if (!SHOW_DEADZONES.value) return;

    for (const dz of deadZones) {
      const x = dz.x * W;
      const y = dz.y * H;
      const w = dz.w * W;
      const h = dz.h * H;

      // Base fill
      ctx.fillStyle = 'rgba(255, 65, 54, 0.12)';
      ctx.fillRect(x, y, w, h);

      // Diagonal hatching
      ctx.save();
      ctx.beginPath();
      ctx.rect(x, y, w, h);
      ctx.clip();

      ctx.strokeStyle = 'rgba(255, 65, 54, 0.5)';
      ctx.lineWidth = 1.5;
      const spacing = 12;
      const offset = (time * 20) % spacing;

      for (let i = -h; i < w + h; i += spacing) {
        ctx.beginPath();
        ctx.moveTo(x + i + offset, y);
        ctx.lineTo(x + i + offset + h, y + h);
        ctx.stroke();
      }

      // Border
      ctx.strokeStyle = 'rgba(255, 65, 54, 0.7)';
      ctx.lineWidth = 2;
      ctx.strokeRect(x, y, w, h);

      // Label
      ctx.fillStyle = 'rgba(255, 65, 54, 0.9)';
      ctx.font = 'bold 11px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('DEAD ZONE', x + w / 2, y + h / 2);

      ctx.restore();
    }
  }

  function drawTowers() {
    for (const tower of towers) {
      const cx = tower.x * W;
      const cy = tower.y * H;
      const range = tower.range * Math.min(W, H);

      // Coverage ring (subtle)
      if (SHOW_COVERAGE.value) {
        const ringGrad = ctx.createRadialGradient(cx, cy, range * 0.3, cx, cy, range);
        ringGrad.addColorStop(0, 'rgba(46, 204, 64, 0.05)');
        ringGrad.addColorStop(0.6, 'rgba(46, 204, 64, 0.08)');
        ringGrad.addColorStop(1, 'rgba(46, 204, 64, 0)');
        ctx.fillStyle = ringGrad;
        ctx.beginPath();
        ctx.arc(cx, cy, range, 0, Math.PI * 2);
        ctx.fill();

        // Range circle outline
        ctx.strokeStyle = 'rgba(46, 204, 64, 0.2)';
        ctx.lineWidth = 1;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(cx, cy, range, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      // Pulsing marker
      const pulse = 1 + Math.sin(time * 3 + tower.x * 10) * 0.3;
      const pulse2 = 1 + Math.sin(time * 3 + tower.x * 10 + 1) * 0.2;

      // Outer pulse ring
      ctx.strokeStyle = `rgba(0, 255, 100, ${0.3 * pulse2})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, 18 * pulse, 0, Math.PI * 2);
      ctx.stroke();

      // Inner pulse ring
      ctx.strokeStyle = `rgba(0, 255, 100, ${0.5 * pulse})`;
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.arc(cx, cy, 12 * pulse, 0, Math.PI * 2);
      ctx.stroke();

      // Tower icon
      ctx.fillStyle = '#0f0';
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.fill();

      // Tower symbol (antenna)
      ctx.strokeStyle = '#0f0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(cx, cy + 5);
      ctx.lineTo(cx, cy - 12);
      ctx.moveTo(cx - 6, cy - 6);
      ctx.lineTo(cx, cy - 12);
      ctx.lineTo(cx + 6, cy - 6);
      ctx.stroke();

      // Label
      ctx.fillStyle = 'rgba(0, 255, 100, 0.8)';
      ctx.font = '10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText('TWR', cx, cy + 28);
    }
  }

  function drawPlayers() {
    let strongCount = 0, weakCount = 0, noneCount = 0;

    for (const p of players) {
      const cx = p.x * W;
      const cy = p.y * H;
      const signal = getSignalStrength(p.x, p.y);

      let color, ringColor, label, status;
      if (signal < 0) {
        color = '#ff4136';
        ringColor = 'rgba(255, 65, 54, 0.4)';
        label = 'DEAD';
        status = 'none';
        noneCount++;
      } else if (signal > 0.5) {
        color = '#2ecc40';
        ringColor = 'rgba(46, 204, 64, 0.4)';
        label = `${Math.round(signal * 100)}%`;
        status = 'strong';
        strongCount++;
      } else if (signal > 0.2) {
        color = '#ffdc00';
        ringColor = 'rgba(255, 220, 0, 0.4)';
        label = `${Math.round(signal * 100)}%`;
        status = 'weak';
        weakCount++;
      } else {
        color = '#ff4136';
        ringColor = 'rgba(255, 65, 54, 0.4)';
        label = signal > 0 ? `${Math.round(signal * 100)}%` : '0%';
        status = 'none';
        noneCount++;
      }

      // Signal strength indicator rings
      const ringCount = status === 'strong' ? 3 : status === 'weak' ? 2 : 1;
      for (let i = 0; i < ringCount; i++) {
        const ringRadius = 14 + i * 8;
        const ringAlpha = 0.3 - i * 0.08;
        ctx.strokeStyle = ringColor.replace(/[\d.]+\)$/, `${ringAlpha})`);
        ctx.lineWidth = 1.5;
        ctx.beginPath();
        ctx.arc(cx, cy, ringRadius, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Animated ring for active signal
      if (status !== 'none') {
        const animRadius = 10 + Math.sin(time * 4 + p.x * 20) * 4;
        ctx.strokeStyle = ringColor;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(cx, cy, animRadius, 0, Math.PI * 2);
        ctx.stroke();
      }

      // Player dot
      ctx.fillStyle = color;
      ctx.beginPath();
      ctx.arc(cx, cy, 5, 0, Math.PI * 2);
      ctx.fill();

      // Inner dot
      ctx.fillStyle = '#fff';
      ctx.beginPath();
      ctx.arc(cx, cy, 2, 0, Math.PI * 2);
      ctx.fill();

      // Label
      ctx.fillStyle = color;
      ctx.font = 'bold 10px monospace';
      ctx.textAlign = 'center';
      ctx.fillText(p.name, cx, cy - 20);
      ctx.font = '9px monospace';
      ctx.fillText(label, cx, cy + 28);
    }

    // Update readout
    readoutEl.innerHTML = `
      <div class="readout-strong">● Strong: ${strongCount} player${strongCount !== 1 ? 's' : ''}</div>
      <div class="readout-weak">● Weak: ${weakCount} player${weakCount !== 1 ? 's' : ''}</div>
      <div class="readout-none">● No Signal: ${noneCount} player${noneCount !== 1 ? 's' : ''}</div>
    `;
  }

  function drawGrid() {
    ctx.strokeStyle = 'rgba(255, 255, 255, 0.04)';
    ctx.lineWidth = 1;
    const gridSize = 40;

    for (let x = 0; x < W; x += gridSize) {
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, H);
      ctx.stroke();
    }
    for (let y = 0; y < H; y += gridSize) {
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(W, y);
      ctx.stroke();
    }
  }

  function drawCrosshair() {
    const cx = mouseX;
    const cy = mouseY;
    ctx.strokeStyle = 'rgba(0, 255, 0, 0.3)';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 2]);

    ctx.beginPath();
    ctx.moveTo(cx - 20, cy);
    ctx.lineTo(cx + 20, cy);
    ctx.stroke();

    ctx.beginPath();
    ctx.moveTo(cx, cy - 20);
    ctx.lineTo(cx, cy + 20);
    ctx.stroke();

    ctx.setLineDash([]);

    // Signal readout at crosshair
    const nx = cx / W;
    const ny = cy / H;
    const signal = getSignalStrength(nx, ny);
    let signalText, signalColor;
    if (signal < 0) {
      signalText = 'DEAD ZONE';
      signalColor = '#ff4136';
    } else if (signal > 0.5) {
      signalText = `STRONG ${Math.round(signal * 100)}%`;
      signalColor = '#2ecc40';
    } else if (signal > 0.2) {
      signalText = `WEAK ${Math.round(signal * 100)}%`;
      signalColor = '#ffdc00';
    } else {
      signalText = signal > 0 ? `NO SIGNAL ${Math.round(signal * 100)}%` : 'NO SIGNAL';
      signalColor = '#ff4136';
    }

    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    ctx.fillRect(cx + 12, cy - 24, 110, 18);
    ctx.fillStyle = signalColor;
    ctx.font = '10px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(signalText, cx + 16, cy - 12);
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);

    // Background
    ctx.fillStyle = '#0a0a0a';
    ctx.fillRect(0, 0, W, H);

    drawGrid();
    drawTerrainHeat();
    drawTerrainBlocking();
    drawDeadZones();
    drawTowers();
    drawPlayers();
    drawCrosshair();

    time += 0.016;
    requestAnimationFrame(draw);
  }

  draw();
})();
</script>
</body>
</html>
