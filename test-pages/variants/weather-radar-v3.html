<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Radar V3 — Sandstorm</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0705;
            overflow: hidden;
            font-family: 'Courier New', monospace;
            width: 100vw;
            height: 100vh;
        }

        #canvas-container {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        canvas {
            display: block;
        }

        /* Eye-squinting viewport effect */
        .squint-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 10;
            box-shadow:
                inset 0 80px 120px 40px rgba(10, 7, 5, 0.95),
                inset 0 -80px 120px 40px rgba(10, 7, 5, 0.95),
                inset 120px 0 150px 60px rgba(10, 7, 5, 0.9),
                inset -120px 0 150px 60px rgba(10, 7, 5, 0.9);
        }

        .squint-overlay::before {
            content: '';
            position: absolute;
            top: 15%;
            left: 10%;
            right: 10%;
            height: 8px;
            background: rgba(10, 7, 5, 0.7);
            border-radius: 50%;
            filter: blur(4px);
        }

        .squint-overlay::after {
            content: '';
            position: absolute;
            bottom: 15%;
            left: 10%;
            right: 10%;
            height: 8px;
            background: rgba(10, 7, 5, 0.7);
            border-radius: 50%;
            filter: blur(4px);
        }

        /* HUD */
        .hud {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 20;
            color: #d4a574;
            font-size: 14px;
            letter-spacing: 2px;
            text-shadow: 0 0 8px rgba(212, 165, 116, 0.5);
            pointer-events: none;
        }

        .hud-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 8px;
            color: #e8b87d;
            text-shadow: 0 0 12px rgba(232, 184, 125, 0.6);
        }

        .hud-line {
            width: 200px;
            height: 1px;
            background: linear-gradient(90deg, #d4a574, transparent);
            margin: 8px 0;
        }

        .hud-status {
            color: #c4946a;
            font-size: 11px;
            margin-top: 4px;
        }

        .hud-warning {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 20;
            color: #c4946a;
            font-size: 12px;
            letter-spacing: 1px;
            text-align: right;
            pointer-events: none;
        }

        .hud-warning .blink {
            animation: blink 1.5s infinite;
            color: #e8b87d;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Scanline effect */
        .scanlines {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 15;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 0, 0, 0.08) 2px,
                rgba(0, 0, 0, 0.08) 4px
            );
        }

        /* Vignette for extra atmosphere */
        .vignette {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 12;
            background: radial-gradient(
                ellipse at center,
                transparent 30%,
                rgba(10, 7, 5, 0.4) 70%,
                rgba(10, 7, 5, 0.8) 100%
            );
        }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js"
        }
    }
    </script>
</head>
<body>
    <div id="canvas-container"></div>
    <div class="squint-overlay"></div>
    <div class="vignette"></div>
    <div class="scanlines"></div>
    
    <div class="hud">
        <div class="hud-title">WEATHER V3 — SANDSTORM</div>
        <div class="hud-line"></div>
        <div class="hud-status">WIND: 65 KM/H NE</div>
        <div class="hud-status">VISIBILITY: < 50M</div>
        <div class="hud-status">PARTICLES: HIGH</div>
        <div class="hud-status">ALERT: SEEK SHELTER</div>
    </div>
    
    <div class="hud-warning">
        <div class="blink">⚠ SEVERE WEATHER</div>
        <div style="margin-top:4px; color:#a08060;">RADAR COMPROMISED</div>
    </div>

    <script type="module">
        import * as THREE from 'three';

        // Scene setup
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x3d2817, 0.035);
        scene.background = new THREE.Color(0x1a120b);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 100);
        camera.position.set(0, 8, 18);
        camera.lookAt(0, 2, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 0.7;
        document.getElementById('canvas-container').appendChild(renderer.domElement);

        // Lighting - dim, warm, diffused
        const ambientLight = new THREE.AmbientLight(0x8b6239, 0.4);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xc4946a, 0.6);
        dirLight.position.set(10, 15, 5);
        scene.add(dirLight);

        const hemiLight = new THREE.HemisphereLight(0x5a3d2b, 0x2a1f15, 0.3);
        scene.add(hemiLight);

        // Ground - sandy terrain
        const groundGeo = new THREE.PlaneGeometry(80, 80, 64, 64);
        const groundMat = new THREE.MeshStandardMaterial({
            color: 0x5a3d2b,
            roughness: 0.95,
            metalness: 0.05,
        });
        
        // Add noise to ground vertices for dunes
        const posAttr = groundGeo.attributes.position;
        for (let i = 0; i < posAttr.count; i++) {
            const x = posAttr.getX(i);
            const y = posAttr.getY(i);
            const z = Math.sin(x * 0.15) * 0.8 + Math.cos(y * 0.1) * 0.5 + Math.sin(x * 0.05 + y * 0.08) * 1.2;
            posAttr.setZ(i, z);
        }
        groundGeo.computeVertexNormals();
        
        const ground = new THREE.Mesh(groundGeo, groundMat);
        ground.rotation.x = -Math.PI / 2;
        ground.position.y = -1;
        scene.add(ground);

        // Buildings - vague shapes in the dust
        const buildingColors = [0x4a3525, 0x5a3f2d, 0x3d2b1f, 0x6a4d3a];
        const buildings = [];
        
        function createBuilding(x, z, w, h, d) {
            const geo = new THREE.BoxGeometry(w, h, d);
            const mat = new THREE.MeshStandardMaterial({
                color: buildingColors[Math.floor(Math.random() * buildingColors.length)],
                roughness: 0.9,
                metalness: 0.1,
                transparent: true,
                opacity: 0.7,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, h / 2 - 1, z);
            scene.add(mesh);
            buildings.push(mesh);
            return mesh;
        }

        // Create vague building silhouettes
        createBuilding(-8, -6, 3, 8, 3);
        createBuilding(-5, -8, 2.5, 12, 2.5);
        createBuilding(6, -5, 4, 6, 4);
        createBuilding(9, -7, 2, 10, 2);
        createBuilding(-10, 2, 3.5, 5, 3.5);
        createBuilding(4, 3, 2, 7, 2);
        createBuilding(-3, 6, 4, 4, 3);
        createBuilding(7, 5, 2.5, 9, 2.5);
        createBuilding(-7, 8, 3, 6, 2);
        createBuilding(2, -9, 3, 5, 3);

        // Player dots that flicker in and out
        const playerDots = [];
        const playerColors = [0xff6b35, 0xff8c42, 0xffa94d, 0xe85d04];
        
        function createPlayerDot(x, z) {
            const geo = new THREE.SphereGeometry(0.15, 8, 8);
            const mat = new THREE.MeshBasicMaterial({
                color: playerColors[Math.floor(Math.random() * playerColors.length)],
                transparent: true,
                opacity: 0.8,
            });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.position.set(x, 0.5, z);
            scene.add(mesh);
            
            // Glow sprite
            const spriteGeo = new THREE.PlaneGeometry(0.8, 0.8);
            const spriteMat = new THREE.MeshBasicMaterial({
                color: mesh.material.color,
                transparent: true,
                opacity: 0.2,
                side: THREE.DoubleSide,
                depthWrite: false,
            });
            const sprite = new THREE.Mesh(spriteGeo, spriteMat);
            sprite.position.copy(mesh.position);
            sprite.position.y += 0.1;
            scene.add(sprite);
            
            playerDots.push({
                mesh,
                sprite,
                baseOpacity: 0.6 + Math.random() * 0.4,
                flickerSpeed: 2 + Math.random() * 4,
                flickerOffset: Math.random() * Math.PI * 2,
                visibilityThreshold: 0.15 + Math.random() * 0.25,
            });
        }

        // Create player dots scattered around
        for (let i = 0; i < 12; i++) {
            const x = (Math.random() - 0.5) * 20;
            const z = (Math.random() - 0.5) * 20;
            createPlayerDot(x, z);
        }

        // Heavy dust particles swirling
        const particleCount = 8000;
        const particleGeo = new THREE.BufferGeometry();
        const particlePositions = new Float32Array(particleCount * 3);
        const particleVelocities = [];
        const particleSizes = new Float32Array(particleCount);
        
        for (let i = 0; i < particleCount; i++) {
            const i3 = i * 3;
            particlePositions[i3] = (Math.random() - 0.5) * 50;
            particlePositions[i3 + 1] = Math.random() * 15;
            particlePositions[i3 + 2] = (Math.random() - 0.5) * 50;
            
            particleVelocities.push({
                x: (Math.random() - 0.3) * 8,
                y: (Math.random() - 0.5) * 2,
                z: (Math.random() - 0.5) * 3,
                swirl: Math.random() * 2,
            });
            
            particleSizes[i] = 0.05 + Math.random() * 0.25;
        }
        
        particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
        particleGeo.setAttribute('size', new THREE.BufferAttribute(particleSizes, 1));
        
        // Custom shader for dust particles
        const particleUniforms = {
            uTime: { value: 0 },
            uColor: { value: new THREE.Color(0xc4946a) },
        };
        
        const particleMat = new THREE.ShaderMaterial({
            uniforms: particleUniforms,
            vertexShader: `
                attribute float size;
                varying float vAlpha;
                uniform float uTime;
                
                void main() {
                    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
                    gl_PointSize = size * (200.0 / -mvPosition.z);
                    gl_Position = projectionMatrix * mvPosition;
                    vAlpha = 0.4 + 0.3 * sin(uTime * 2.0 + position.x * 0.5);
                }
            `,
            fragmentShader: `
                uniform vec3 uColor;
                varying float vAlpha;
                
                void main() {
                    float dist = length(gl_PointCoord - vec2(0.5));
                    if (dist > 0.5) discard;
                    float alpha = (1.0 - dist * 2.0) * vAlpha * 0.7;
                    gl_FragColor = vec4(uColor, alpha);
                }
            `,
            transparent: true,
            depthWrite: false,
            blending: THREE.AdditiveBlending,
        });
        
        const particles = new THREE.Points(particleGeo, particleMat);
        scene.add(particles);

        // Larger sand chunks
        const sandChunkCount = 300;
        const sandChunkGeo = new THREE.BufferGeometry();
        const sandChunkPositions = new Float32Array(sandChunkCount * 3);
        const sandChunkVelocities = [];
        
        for (let i = 0; i < sandChunkCount; i++) {
            const i3 = i * 3;
            sandChunkPositions[i3] = (Math.random() - 0.5) * 40;
            sandChunkPositions[i3 + 1] = Math.random() * 12;
            sandChunkPositions[i3 + 2] = (Math.random() - 0.5) * 40;
            
            sandChunkVelocities.push({
                x: 3 + Math.random() * 6,
                y: (Math.random() - 0.5) * 1.5,
                z: (Math.random() - 0.5) * 2,
            });
        }
        
        sandChunkGeo.setAttribute('position', new THREE.BufferAttribute(sandChunkPositions, 3));
        
        const sandChunkMat = new THREE.PointsMaterial({
            color: 0xd4a574,
            size: 0.3,
            transparent: true,
            opacity: 0.5,
            depthWrite: false,
        });
        
        const sandChunks = new THREE.Points(sandChunkGeo, sandChunkMat);
        scene.add(sandChunks);

        // Wind gust lines
        const gustCount = 50;
        const gustLines = [];
        
        function createGust() {
            const points = [];
            const startX = -25;
            const y = 1 + Math.random() * 8;
            const z = (Math.random() - 0.5) * 20;
            
            for (let i = 0; i < 10; i++) {
                points.push(new THREE.Vector3(
                    startX + i * 2,
                    y + Math.sin(i * 0.5) * 0.5,
                    z + Math.cos(i * 0.3) * 0.3
                ));
            }
            
            const geo = new THREE.BufferGeometry().setFromPoints(points);
            const mat = new THREE.LineBasicMaterial({
                color: 0xc4946a,
                transparent: true,
                opacity: 0,
            });
            const line = new THREE.Line(geo, mat);
            scene.add(line);
            
            return {
                mesh: line,
                speed: 8 + Math.random() * 6,
                opacity: 0,
                fadeIn: true,
                life: 0,
                maxLife: 2 + Math.random() * 3,
            };
        }
        
        for (let i = 0; i < gustCount; i++) {
            const gust = createGust();
            gust.life = Math.random() * gust.maxLife;
            gust.mesh.position.x = (Math.random() - 0.5) * 40;
            gustLines.push(gust);
        }

        // Animation
        const clock = new THREE.Clock();
        
        function animate() {
            requestAnimationFrame(animate);
            
            const time = clock.getElapsedTime();
            const delta = clock.getDelta();
            
            particleUniforms.uTime.value = time;
            
            // Update dust particles - wind drift
            const positions = particles.geometry.attributes.position.array;
            for (let i = 0; i < particleCount; i++) {
                const i3 = i * 3;
                const vel = particleVelocities[i];
                
                positions[i3] += vel.x * 0.016 + Math.sin(time * vel.swirl + i * 0.1) * 0.02;
                positions[i3 + 1] += vel.y * 0.016 + Math.sin(time * 1.5 + i * 0.05) * 0.01;
                positions[i3 + 2] += vel.z * 0.016;
                
                // Wrap around
                if (positions[i3] > 25) positions[i3] = -25;
                if (positions[i3] < -25) positions[i3] = 25;
                if (positions[i3 + 1] > 15) positions[i3 + 1] = 0;
                if (positions[i3 + 1] < 0) positions[i3 + 1] = 15;
                if (positions[i3 + 2] > 25) positions[i3 + 2] = -25;
                if (positions[i3 + 2] < -25) positions[i3 + 2] = 25;
            }
            particles.geometry.attributes.position.needsUpdate = true;
            
            // Update sand chunks
            const chunkPositions = sandChunks.geometry.attributes.position.array;
            for (let i = 0; i < sandChunkCount; i++) {
                const i3 = i * 3;
                const vel = sandChunkVelocities[i];
                
                chunkPositions[i3] += vel.x * 0.016;
                chunkPositions[i3 + 1] += vel.y * 0.016 + Math.sin(time * 2 + i) * 0.02;
                chunkPositions[i3 + 2] += vel.z * 0.016;
                
                if (chunkPositions[i3] > 20) chunkPositions[i3] = -20;
                if (chunkPositions[i3 + 1] > 12) chunkPositions[i3 + 1] = 0;
                if (chunkPositions[i3 + 1] < 0) chunkPositions[i3 + 1] = 12;
                if (chunkPositions[i3 + 2] > 20) chunkPositions[i3 + 2] = -20;
                if (chunkPositions[i3 + 2] < -20) chunkPositions[i3 + 2] = 20;
            }
            sandChunks.geometry.attributes.position.needsUpdate = true;
            
            // Update gust lines
            gustLines.forEach(gust => {
                gust.life += 0.016;
                gust.mesh.position.x += gust.speed * 0.016;
                
                if (gust.fadeIn) {
                    gust.opacity += 0.016 * 2;
                    if (gust.opacity >= 0.3) gust.fadeIn = false;
                } else {
                    gust.opacity -= 0.016 * 1.5;
                }
                
                gust.mesh.material.opacity = Math.max(0, gust.opacity);
                
                if (gust.life >= gust.maxLife || gust.mesh.position.x > 25) {
                    gust.life = 0;
                    gust.fadeIn = true;
                    gust.opacity = 0;
                    gust.mesh.position.x = -25;
                    gust.mesh.position.y = 1 + Math.random() * 8;
                    gust.mesh.position.z = (Math.random() - 0.5) * 20;
                }
            });
            
            // Flicker player dots
            playerDots.forEach(player => {
                const flicker = Math.sin(time * player.flickerSpeed + player.flickerOffset);
                const visibility = (flicker + 1) / 2;
                
                if (visibility < player.visibilityThreshold) {
                    player.mesh.material.opacity = 0;
                    player.sprite.material.opacity = 0;
                } else {
                    player.mesh.material.opacity = player.baseOpacity * visibility;
                    player.sprite.material.opacity = 0.15 * visibility;
                }
                
                // Billboarding for glow sprites
                player.sprite.lookAt(camera.position);
            });
            
            // Subtle camera drift
            camera.position.x = Math.sin(time * 0.1) * 1;
            camera.position.y = 8 + Math.sin(time * 0.15) * 0.5;
            camera.lookAt(0, 2, 0);
            
            renderer.render(scene, camera);
        }
        
        animate();

        // Resize handler
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
