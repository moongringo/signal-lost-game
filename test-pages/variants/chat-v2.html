<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat V2 — Tactical Comms</title>
  <style>
    :root {
      --bg: #0b0d12;
      --panel: #11151d;
      --panel-2: #151a24;
      --ink: #e6e9ef;
      --muted: #9aa3b2;
      --accent: #2dd4bf;
      --accent-2: #22d3ee;
      --danger: #f87171;
      --warn: #fbbf24;
      --ok: #34d399;
      --border: rgba(148, 163, 184, 0.12);
      --grid: rgba(45, 212, 191, 0.08);
      --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--ink);
      font: 14px/1.45 system-ui, -apple-system, Segoe UI, Roboto, Ubuntu, Cantarell, Noto Sans, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      overflow: hidden;
    }

    .hud { position: fixed; top: 10px; left: 12px; z-index: 60; pointer-events: none; }
    .hud .badge {
      display: inline-block;
      background: rgba(17, 21, 29, 0.85);
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 6px 10px;
      border-radius: 999px;
      font-weight: 700;
      letter-spacing: 0.12em;
      font-size: 12px;
      backdrop-filter: blur(6px) saturate(1.1);
    }

    .app { display: flex; height: 100vh; width: 100vw; position: relative; }

    /* Main tactical map */
    .main {
      flex: 1 1 auto;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(1200px 800px at 20% 10%, rgba(34,211,238,0.06), transparent 60%),
        radial-gradient(1000px 700px at 80% 90%, rgba(45,212,191,0.05), transparent 60%),
        var(--bg);
    }
    .map-grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .map-layer { position: absolute; inset: 0; }

    .map-legend {
      position: absolute; bottom: 12px; left: 12px; z-index: 10;
      display: flex; gap: 10px; align-items: center;
      background: rgba(11,13,18,0.7);
      border: 1px solid var(--border);
      padding: 8px 10px; border-radius: 10px;
      backdrop-filter: blur(6px);
      font-size: 12px; color: var(--muted);
    }
    .map-legend .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .dot-friend { background: var(--ok); box-shadow: 0 0 8px var(--ok); }
    .dot-self   { background: var(--accent-2); box-shadow: 0 0 10px var(--accent-2); }
    .dot-enemy  { background: var(--danger); box-shadow: 0 0 8px var(--danger); }

    /* Player dots on map */
    .player-dot {
      position: absolute;
      width: 10px; height: 10px; border-radius: 50%;
      transform: translate(-50%, -50%);
      transition: transform .2s ease;
    }
    .player-dot::after {
      content: attr(data-name);
      position: absolute; left: 50%; top: -18px; transform: translateX(-50%);
      white-space: nowrap; font-size: 10px; color: var(--muted);
      opacity: 0; transition: opacity .2s ease; pointer-events: none;
    }
    .player-dot:hover::after { opacity: 1; }
    .player-dot.pulse { animation: pulse 2s infinite; }
    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(45,212,191,0.35); }
      70% { box-shadow: 0 0 0 10px rgba(45,212,191,0); }
      100% { box-shadow: 0 0 0 0 rgba(45,212,191,0); }
    }

    /* Chat side panel */
    .chat-panel {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 50;
      width: 380px;
      background: var(--panel);
      border-left: 1px solid var(--border);
      box-shadow: var(--shadow);
      display: flex; flex-direction: column;
      transform: translateX(0);
      transition: transform .35s cubic-bezier(.2,.9,.3,1);
    }
    .chat-panel.closed { transform: translateX(calc(100% - 44px)); }

    /* Toggle tab on right edge */
    .chat-toggle {
      position: absolute; left: -40px; top: 50%; transform: translateY(-50%);
      width: 40px; height: 96px;
      background: var(--panel-2);
      border: 1px solid var(--border);
      border-right: none;
      border-radius: 10px 0 0 10px;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; color: var(--accent);
      box-shadow: -6px 0 18px rgba(0,0,0,0.35);
      transition: background .2s ease, color .2s ease;
    }
    .chat-toggle:hover { background: #1b2230; color: #fff; }
    .chat-toggle .chevron {
      width: 10px; height: 10px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(135deg);
      transition: transform .3s ease;
    }
    .chat-panel.closed .chat-toggle .chevron { transform: rotate(-45deg); }

    /* Mini preview when closed */
    .chat-preview {
      position: absolute; left: -220px; top: 50%; transform: translateY(-50%);
      width: 200px;
      background: rgba(17,21,29,0.92);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      opacity: 0; pointer-events: none;
      transition: opacity .25s ease, transform .25s ease;
      box-shadow: var(--shadow);
    }
    .chat-panel.closed .chat-preview {
      opacity: 1; pointer-events: auto;
      transform: translateY(-50%) translateX(0);
    }
    .chat-preview .preview-label {
      font-size: 10px; letter-spacing: .12em; color: var(--accent);
      margin-bottom: 6px; display: flex; align-items: center; gap: 6px;
    }
    .chat-preview .preview-text {
      font-size: 12px; color: var(--ink);
      line-height: 1.4;
      display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
    }
    .chat-preview .preview-meta {
      margin-top: 6px; font-size: 11px; color: var(--muted);
    }

    /* Header */
    .chat-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px;
      border-bottom: 1px solid var(--border);
      background: linear-gradient(180deg, rgba(255,255,255,0.03), transparent);
    }
    .chat-header .title {
      font-weight: 800; letter-spacing: .14em; font-size: 12px; color: var(--accent);
    }
    .chat-header .meta {
      display: flex; align-items: center; gap: 10px;
      font-size: 12px; color: var(--muted);
    }
    .chat-header .pill {
      background: rgba(45,212,191,0.12); color: var(--accent);
      padding: 3px 8px; border-radius: 999px; font-weight: 700; font-size: 11px;
    }

    /* Messages */
    .chat-scroll {
      flex: 1 1 auto; overflow-y: auto; padding: 10px 12px;
      scroll-behavior: smooth;
    }
    .msg + .msg { margin-top: 10px; }
    .msg {
      display: flex; gap: 10px; align-items: flex-start;
      animation: msgIn .25s ease both;
    }
    @keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .msg-avatar {
      width: 30px; height: 30px; border-radius: 50%;
      display: grid; place-items: center; font-weight: 800; font-size: 12px; color: #fff;
      flex: 0 0 auto; text-shadow: 0 1px 0 rgba(0,0,0,.3);
    }
    .msg-body { min-width: 0; }
    .msg-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 2px; }
    .msg-name { font-weight: 700; font-size: 12px; }
    .msg-time { font-size: 11px; color: var(--muted); }
    .msg-text { font-size: 13px; color: var(--ink); line-height: 1.45; word-break: break-word; }
    .msg-text .cmd { color: var(--accent-2); font-weight: 700; }
    .msg-text .hl { color: var(--warn); }

    /* Command wheel */
    .cmd-wheel {
      position: relative;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: var(--panel-2);
    }
    .cmd-wheel .wheel-label {
      font-size: 10px; letter-spacing: .12em; color: var(--muted); margin-bottom: 8px;
    }
    .cmd-grid {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    }
    .cmd-btn {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 8px 6px; border-radius: 8px; cursor: pointer;
      font-size: 12px; text-align: center;
      transition: transform .08s ease, border-color .2s ease, background .2s ease;
    }
    .cmd-btn:hover { border-color: rgba(45,212,191,.35); background: rgba(45,212,191,.08); }
    .cmd-btn:active { transform: translateY(1px) scale(.98); }
    .cmd-btn .cmd-key { display: block; font-size: 10px; color: var(--accent); margin-top: 2px; }

    /* Input */
    .chat-inputbar {
      display: flex; gap: 8px; align-items: center;
      padding: 10px 12px;
      border-top: 1px solid var(--border);
      background: var(--panel);
    }
    .chat-inputbar input {
      flex: 1 1 auto;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      color: var(--ink);
      padding: 10px 12px; border-radius: 10px; outline: none; font-size: 13px;
    }
    .chat-inputbar input::placeholder { color: #6b7280; }
    .chat-inputbar input:focus { border-color: rgba(45,212,191,.45); background: rgba(45,212,191,.06); }
    .chat-inputbar button {
      background: linear-gradient(180deg, var(--accent), #0d9488);
      border: none; color: #062c27; font-weight: 800;
      padding: 10px 14px; border-radius: 10px; cursor: pointer; font-size: 12px; letter-spacing: .04em;
      transition: filter .2s ease, transform .08s ease;
    }
    .chat-inputbar button:hover { filter: brightness(1.08); }
    .chat-inputbar button:active { transform: translateY(1px); }

    /* Scrollbar */
    .chat-scroll::-webkit-scrollbar { width: 6px; }
    .chat-scroll::-webkit-scrollbar-thumb { background: rgba(148,163,184,.25); border-radius: 999px; }
    .chat-scroll::-webkit-scrollbar-track { background: transparent; }

    /* Responsive */
    @media (max-width: 640px) {
      .chat-panel { width: 100vw; }
      .chat-panel.closed { transform: translateX(calc(100% - 44px)); }
      .chat-preview { left: -210px; width: 190px; }
    }
  </style>
</head>
<body>
  <div class="hud"><div class="badge">CHAT V2</div></div>

  <div class="app">
    <div class="main" id="map">
      <div class="map-grid"></div>
      <div class="map-layer" id="dotsLayer"></div>
      <div class="map-legend">
        <span><span class="dot dot-self"></span>You</span>
        <span><span class="dot dot-friend"></span>Squad</span>
        <span><span class="dot dot-enemy"></span>Hostile</span>
      </div>
    </div>

    <div class="chat-panel" id="chatPanel">
      <div class="chat-toggle" id="chatToggle" title="Toggle tactical comms">
        <div class="chevron"></div>
      </div>

      <div class="chat-preview" id="chatPreview">
        <div class="preview-label">
          <span>COMMS</span>
          <span style="margin-left:auto;font-size:11px;color:var(--muted)">Latest</span>
        </div>
        <div class="preview-text" id="previewText">—</div>
        <div class="preview-meta" id="previewMeta">—</div>
      </div>

      <div class="chat-header">
        <div class="title">TACTICAL COMMS</div>
        <div class="meta">
          <span class="pill" id="playerCount">6 online</span>
          <span style="font-size:11px;opacity:.8">v2.0</span>
        </div>
      </div>

      <div class="chat-scroll" id="chatScroll"></div>

      <div class="cmd-wheel">
        <div class="wheel-label">COMMAND WHEEL</div>
        <div class="cmd-grid" id="cmdGrid"></div>
      </div>

      <div class="chat-inputbar">
        <input id="chatInput" type="text" placeholder="Enter command or message…" autocomplete="off" />
        <button id="sendBtn">SEND</button>
      </div>
    </div>
  </div>

  <script>
    const $ = (sel, el=document) => el.querySelector(sel);
    const chatPanel = $('#chatPanel');
    const chatToggle = $('#chatToggle');
    const chatScroll = $('#chatScroll');
    const chatInput = $('#chatInput');
    const sendBtn = $('#sendBtn');
    const previewText = $('#previewText');
    const previewMeta = $('#previewMeta');
    const dotsLayer = $('#dotsLayer');
    const playerCount = $('#playerCount');

    let isOpen = true;

    const palette = [
      ['#0ea5e9','#0c4a6e'], ['#8b5cf6','#4c1d95'], ['#f59e0b','#78350f'],
      ['#ef4444','#7f1d1d'], ['#10b981','#064e3b'], ['#ec4899','#831843'],
      ['#06b6d4','#164e63'], ['#f97316','#7c2d12']
    ];
    function hashColor(name) {
      let h = 0; for (let i=0;i<name.length;i++) h = name.charCodeAt(i) + ((h<<5)-h);
      const idx = Math.abs(h) % palette.length;
      return palette[idx];
    }

    const players = [
      { name: 'Viper', role: 'squad', x: 22, y: 28 },
      { name: 'Rook', role: 'squad', x: 38, y: 18 },
      { name: 'Jester', role: 'squad', x: 55, y: 42 },
      { name: 'Wraith', role: 'squad', x: 72, y: 30 },
      { name: 'Nomad', role: 'self', x: 45, y: 55 },
      { name: 'Specter', role: 'enemy', x: 80, y: 20 },
    ];

    function renderDots() {
      dotsLayer.innerHTML = '';
      players.forEach(p => {
        const el = document.createElement('div');
        el.className = 'player-dot' + (p.role==='self' ? ' pulse' : '');
        el.dataset.name = p.name;
        el.style.left = p.x + '%';
        el.style.top = p.y + '%';
        if (p.role === 'self') el.style.background = 'var(--accent-2)';
        else if (p.role === 'enemy') el.style.background = 'var(--danger)';
        else el.style.background = 'var(--ok)';
        dotsLayer.appendChild(el);
      });
      playerCount.textContent = players.filter(p => p.role !== 'enemy').length + ' online';
    }
    renderDots();

    const initialMessages = [
      { name: 'Viper', text: 'Squad, form up on my marker. <span class="cmd">/move alpha</span>' },
      { name: 'Rook', text: 'Copy that. Moving to <span class="hl">Alpha-7</span>.' },
      { name: 'Jester', text: 'Contact east—two hostiles near the ridge. <span class="cmd">/spot</span>' },
      { name: 'Wraith', text: 'I have eyes on. Taking overwatch.' },
      { name: 'Nomad', text: 'Roger. I\'ll push mid and draw fire. <span class="cmd">/cover</span>' },
      { name: 'Viper', text: 'Wait for my mark. Hostiles are patrolling.' },
      { name: 'Rook', text: 'Understood. Holding position.' },
      { name: 'Jester', text: 'They\'re splitting up—one heading south.' },
    ];

    function timeLabel() {
      const now = new Date();
      return now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    }

    function appendMessage({ name, text, time }) {
      const t = time || timeLabel();
      const [bg] = hashColor(name);
      const el = document.createElement('div');
      el.className = 'msg';
      el.innerHTML = `
        <div class="msg-avatar" style="background:${bg}">${name.slice(0,2).toUpperCase()}</div>
        <div class="msg-body">
          <div class="msg-head">
            <span class="msg-name" style="color:${bg}">${name}</span>
            <span class="msg-time">${t}</span>
          </div>
          <div class="msg-text">${text}</div>
        </div>
      `;
      chatScroll.appendChild(el);
      chatScroll.scrollTop = chatScroll.scrollHeight;
      updatePreview(name, text, t);
    }

    function updatePreview(name, text, time) {
      const plain = text.replace(/<[^>]+>/g, '');
      previewText.innerHTML = `<strong style="color:var(--accent)">${name}:</strong> ${plain}`;
      previewMeta.textContent = time;
    }

    initialMessages.forEach((m, i) => {
      setTimeout(() => appendMessage(m), i * 90);
    });

    const commands = [
      { label: 'Move', key: '/move', action: 'Squad, move to my marker.' },
      { label: 'Hold', key: '/hold', action: 'Hold position and watch angles.' },
      { label: 'Cover', key: '/cover', action: 'I need covering fire!' },
      { label: 'Spot', key: '/spot', action: 'Spotted hostiles at this location.' },
      { label: 'Regroup', key: '/regroup', action: 'Fall back and regroup on me.' },
      { label: 'Flank', key: '/flank', action: 'Flanking from the east.' },
      { label: 'Heal', key: '/heal', action: 'Requesting medical support.' },
      { label: 'Status', key: '/status', action: 'Squad status check—report in.' },
    ];

    const cmdGrid = $('#cmdGrid');
    commands.forEach(cmd => {
      const btn = document.createElement('button');
      btn.className = 'cmd-btn';
      btn.innerHTML = `${cmd.label}<span class="cmd-key">${cmd.key}</span>`;
      btn.addEventListener('click', () => {
        sendFromPlayer('Nomad', cmd.action);
      });
      cmdGrid.appendChild(btn);
    });

    function sendFromPlayer(name, text) {
      appendMessage({ name, text });
    }

    function handleSend() {
      const val = chatInput.value.trim();
      if (!val) return;
      sendFromPlayer('Nomad', val.replace(/</g, '&lt;'));
      chatInput.value = '';
      chatInput.focus();
    }

    sendBtn.addEventListener('click', handleSend);
    chatInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') handleSend();
    });

    chatToggle.addEventListener('click', () => {
      isOpen = !isOpen;
      chatPanel.classList.toggle('closed', !isOpen);
    });

    // Random ambient squad chatter
    const ambient = [
      { name: 'Viper', text: 'Check your six—drone activity detected.' },
      { name: 'Rook', text: 'Ammo count green. We\'re good for another push.' },
      { name: 'Jester', text: 'Smoke\'s clearing. Visuals returning.' },
      { name: 'Wraith', text: 'Sniper nest neutralized. Path is clear.' },
      { name: 'Viper', text: 'New waypoint set. ETA two minutes.' },
      { name: 'Rook', text: 'Reinforcements inbound from the north.' },
    ];
    setInterval(() => {
      if (Math.random() > 0.6) {
        const m = ambient[Math.floor(Math.random() * ambient.length)];
        appendMessage({ ...m });
      }
    }, 12000);
  </script>
</body>
</html>
