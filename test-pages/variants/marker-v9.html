<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Marker V9 — Timed / Countdown Markers</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0a0a0a;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* ===== HUD TOP BAR ===== */
    .hud-bar {
      height: 42px;
      background: linear-gradient(90deg, #1a1a2e 0%, #16213e 50%, #1a1a2e 100%);
      border-bottom: 2px solid #e94560;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: relative;
      z-index: 100;
    }

    .hud-title {
      color: #e94560;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .hud-coords {
      color: #888;
      font-size: 11px;
      font-family: 'Courier New', monospace;
      letter-spacing: 1px;
    }

    .hud-time {
      color: #e94560;
      font-size: 12px;
      font-family: 'Courier New', monospace;
      font-weight: 700;
    }

    /* ===== MAIN AREA ===== */
    .main-area {
      flex: 1;
      position: relative;
      overflow: hidden;
    }

    /* Tactical grid background */
    .tactical-bg {
      position: absolute;
      inset: 0;
      background:
        linear-gradient(rgba(20,30,50,0.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(20,30,50,0.3) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .tactical-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 40%, rgba(233,69,96,0.06) 0%, transparent 60%),
                  radial-gradient(ellipse at 70% 60%, rgba(0,200,255,0.05) 0%, transparent 50%);
    }

    /* ===== MAP CANVAS ===== */
    #mapCanvas {
      position: absolute;
      inset: 0;
      cursor: crosshair;
    }

    /* ===== MARKER STYLES ===== */
    .marker-container {
      position: absolute;
      transform: translate(-50%, -50%);
      pointer-events: none;
      z-index: 10;
    }

    .marker-ring {
      width: 64px;
      height: 64px;
      position: relative;
    }

    .marker-ring svg {
      width: 100%;
      height: 100%;
      transform: rotate(-90deg);
    }

    .marker-ring .bg-circle {
      fill: none;
      stroke: rgba(255,255,255,0.08);
      stroke-width: 4;
    }

    .marker-ring .progress-circle {
      fill: none;
      stroke-width: 4;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.1s linear;
    }

    .marker-icon {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 36px;
      height: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 50%;
    }

    .marker-icon svg {
      width: 22px;
      height: 22px;
    }

    .marker-time {
      position: absolute;
      bottom: -18px;
      left: 50%;
      transform: translateX(-50%);
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      text-shadow: 0 0 6px currentColor;
      letter-spacing: 1px;
    }

    .marker-label {
      position: absolute;
      top: -22px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 9px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      white-space: nowrap;
      opacity: 0.85;
    }

    /* ===== MARKER TYPE COLORS ===== */
    .marker-supply .progress-circle { stroke: #f39c12; }
    .marker-supply .marker-icon { background: rgba(243,156,18,0.15); }
    .marker-supply .marker-icon svg { fill: #f39c12; }
    .marker-supply .marker-time { color: #f39c12; }
    .marker-supply .marker-label { color: #f39c12; }

    .marker-artillery .progress-circle { stroke: #e74c3c; }
    .marker-artillery .marker-icon { background: rgba(231,76,60,0.15); }
    .marker-artillery .marker-icon svg { fill: #e74c3c; }
    .marker-artillery .marker-time { color: #e74c3c; }
    .marker-artillery .marker-label { color: #e74c3c; }

    .marker-airsupport .progress-circle { stroke: #3498db; }
    .marker-airsupport .marker-icon { background: rgba(52,152,219,0.15); }
    .marker-airsupport .marker-icon svg { fill: #3498db; }
    .marker-airsupport .marker-time { color: #3498db; }
    .marker-airsupport .marker-label { color: #3498db; }

    .marker-hacking .progress-circle { stroke: #2ecc71; }
    .marker-hacking .marker-icon { background: rgba(46,204,113,0.15); }
    .marker-hacking .marker-icon svg { fill: #2ecc71; }
    .marker-hacking .marker-time { color: #2ecc71; }
    .marker-hacking .marker-label { color: #2ecc71; }

    .marker-revive .progress-circle { stroke: #e94560; }
    .marker-revive .marker-icon { background: rgba(233,69,96,0.15); }
    .marker-revive .marker-icon svg { fill: #e94560; }
    .marker-revive .marker-time { color: #e94560; }
    .marker-revive .marker-label { color: #e94560; }

    .marker-extraction .progress-circle { stroke: #9b59b6; }
    .marker-extraction .marker-icon { background: rgba(155,89,182,0.15); }
    .marker-extraction .marker-icon svg { fill: #9b59b6; }
    .marker-extraction .marker-time { color: #9b59b6; }
    .marker-extraction .marker-label { color: #9b59b6; }

    /* Pulse animation for urgent markers */
    @keyframes pulse-ring {
      0% { box-shadow: 0 0 0 0 currentColor; }
      70% { box-shadow: 0 0 0 10px transparent; }
      100% { box-shadow: 0 0 0 0 transparent; }
    }

    .marker-urgent .marker-ring {
      border-radius: 50%;
      animation: pulse-ring 1.2s ease-out infinite;
    }

    .marker-urgent.marker-artillery .marker-ring { color: rgba(231,76,60,0.4); }
    .marker-urgent.marker-revive .marker-ring { color: rgba(233,69,96,0.4); }

    /* Hacking hex digits */
    .hacking-hex {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      font-family: 'Courier New', monospace;
      font-size: 10px;
      font-weight: 700;
      color: #2ecc71;
      letter-spacing: 1px;
      pointer-events: none;
    }

    /* ===== LEGEND ===== */
    .legend {
      position: absolute;
      bottom: 16px;
      left: 16px;
      background: rgba(10,10,20,0.9);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 8px;
      padding: 14px 18px;
      z-index: 50;
    }

    .legend-title {
      color: #ccc;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 6px;
      font-size: 11px;
      color: #aaa;
    }

    .legend-item:last-child { margin-bottom: 0; }

    .legend-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    .legend-supply { background: #f39c12; }
    .legend-artillery { background: #e74c3c; }
    .legend-airsupport { background: #3498db; }
    .legend-hacking { background: #2ecc71; }
    .legend-revive { background: #e94560; }
    .legend-extraction { background: #9b59b6; }

    /* ===== CONTROLS ===== */
    .controls {
      position: absolute;
      bottom: 16px;
      right: 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      z-index: 50;
    }

    .ctrl-btn {
      background: rgba(20,20,40,0.9);
      border: 1px solid rgba(255,255,255,0.12);
      color: #ccc;
      font-size: 11px;
      font-weight: 600;
      padding: 8px 14px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .ctrl-btn:hover {
      background: rgba(233,69,96,0.2);
      border-color: #e94560;
      color: #fff;
    }

    /* ===== SCANLINE OVERLAY ===== */
    .scanlines {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 90;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0,0,0,0.03) 2px,
        rgba(0,0,0,0.03) 4px
      );
    }

    /* ===== TOOLTIP ===== */
    .marker-tooltip {
      position: absolute;
      background: rgba(10,10,20,0.95);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 6px;
      padding: 8px 12px;
      font-size: 11px;
      color: #ccc;
      pointer-events: none;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.2s;
      white-space: nowrap;
    }

    .marker-tooltip.visible { opacity: 1; }

    .marker-tooltip strong {
      color: #fff;
      display: block;
      margin-bottom: 2px;
      font-size: 12px;
    }
  </style>
</head>
<body>

  <!-- HUD Bar -->
  <div class="hud-bar">
    <div class="hud-title">Marker V9 — Timers</div>
    <div class="hud-coords" id="coords">GRID: A-07 | X: 4521 | Y: 8893</div>
    <div class="hud-time" id="clock">00:00:00</div>
  </div>

  <!-- Main Area -->
  <div class="main-area">
    <div class="tactical-bg"></div>
    <canvas id="mapCanvas"></canvas>

    <!-- Markers container -->
    <div id="markersLayer"></div>

    <!-- Tooltip -->
    <div class="marker-tooltip" id="tooltip"></div>

    <!-- Legend -->
    <div class="legend">
      <div class="legend-title">Timer Types</div>
      <div class="legend-item"><div class="legend-dot legend-supply"></div>Supply Drop</div>
      <div class="legend-item"><div class="legend-dot legend-artillery"></div>Artillery Strike</div>
      <div class="legend-item"><div class="legend-dot legend-airsupport"></div>Air Support</div>
      <div class="legend-item"><div class="legend-dot legend-hacking"></div>Hacking Progress</div>
      <div class="legend-item"><div class="legend-dot legend-revive"></div>Revive Timer</div>
      <div class="legend-item"><div class="legend-dot legend-extraction"></div>Extraction ETA</div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button class="ctrl-btn" onclick="addRandomMarker()">Add Random</button>
      <button class="ctrl-btn" onclick="resetAll()">Reset All</button>
      <button class="ctrl-btn" onclick="togglePause()">Pause / Resume</button>
    </div>

    <div class="scanlines"></div>
  </div>

  <script>
    // ===== ICONS (SVG) =====
    const ICONS = {
      supply: `<svg viewBox="0 0 24 24"><path d="M12 2L2 7v2h20V7L12 2z"/><rect x="4" y="9" width="16" height="2" rx="1"/><path d="M6 13v7a2 2 0 002 2h8a2 2 0 002-2v-7"/><line x1="12" y1="11" x2="12" y2="22"/><path d="M8 4l-3 3M16 4l3 3"/></svg>`,
      artillery: `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="2"/><line x1="12" y1="2" x2="12" y2="22"/><line x1="2" y1="12" x2="22" y2="12"/><circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="2"/><circle cx="12" cy="12" r="1.5"/></svg>`,
      airsupport: `<svg viewBox="0 0 24 24"><path d="M21 10l-4-3v2H7V7L3 10l4 3v-2h10v2l4-3z"/><path d="M12 13v6"/><path d="M9 19h6"/></svg>`,
      hacking: `<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="14" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/><path d="M7 8h2M11 8h2M15 8h2M7 12h2M11 12h2M15 12h2"/></svg>`,
      revive: `<svg viewBox="0 0 24 24"><path d="M12 2v20M2 12h20" stroke="currentColor" stroke-width="3"/><circle cx="12" cy="12" r="4" fill="currentColor"/></svg>`,
      extraction: `<svg viewBox="0 0 24 24"><path d="M12 2L4 8v2h16V8L12 2z"/><rect x="6" y="10" width="12" height="2" rx="1"/><path d="M3 14h18v2a3 3 0 01-3 3H6a3 3 0 01-3-3v-2z"/><circle cx="12" cy="7" r="1.5"/></svg>`
    };

    // ===== MARKER DEFINITIONS =====
    const MARKER_TYPES = [
      { type: 'supply', label: 'Supply Drop', duration: 45, icon: ICONS.supply },
      { type: 'artillery', label: 'Artillery Strike', duration: 12, icon: ICONS.artillery },
      { type: 'airsupport', label: 'Air Support', duration: 30, icon: ICONS.airsupport },
      { type: 'hacking', label: 'Hacking Progress', duration: 60, icon: ICONS.hacking },
      { type: 'revive', label: 'Revive Timer', duration: 20, icon: ICONS.revive },
      { type: 'extraction', label: 'Extraction ETA', duration: 90, icon: ICONS.extraction }
    ];

    // ===== STATE =====
    let markers = [];
    let paused = false;
    let markerIdCounter = 0;
    const markersLayer = document.getElementById('markersLayer');
    const tooltip = document.getElementById('tooltip');
    const canvas = document.getElementById('mapCanvas');
    const ctx = canvas.getContext('2d');

    // ===== CANVAS SETUP =====
    function resizeCanvas() {
      const rect = canvas.parentElement.getBoundingClientRect();
      canvas.width = rect.width;
      canvas.height = rect.height;
      drawMap();
    }
    window.addEventListener('resize', resizeCanvas);

    function drawMap() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      // Draw terrain-like features
      ctx.strokeStyle = 'rgba(40,50,70,0.3)';
      ctx.lineWidth = 1;
      for (let i = 0; i < canvas.width; i += 120) {
        ctx.beginPath();
        ctx.moveTo(i, 0);
        ctx.lineTo(i, canvas.height);
        ctx.stroke();
      }
      for (let i = 0; i < canvas.height; i += 120) {
        ctx.beginPath();
        ctx.moveTo(0, i);
        ctx.lineTo(canvas.width, i);
        ctx.stroke();
      }
      // Draw some "buildings"
      ctx.fillStyle = 'rgba(30,40,60,0.4)';
      const buildings = [
        [80, 60, 100, 80], [300, 150, 80, 120], [500, 80, 120, 90],
        [200, 350, 140, 70], [450, 320, 90, 110], [650, 200, 110, 85],
        [100, 480, 130, 95], [380, 450, 100, 100], [600, 420, 120, 80]
      ];
      buildings.forEach(([x, y, w, h]) => {
        ctx.fillRect(x, y, w, h);
        ctx.strokeStyle = 'rgba(50,65,90,0.4)';
        ctx.strokeRect(x, y, w, h);
      });
      // Draw roads
      ctx.strokeStyle = 'rgba(60,75,100,0.25)';
      ctx.lineWidth = 8;
      ctx.beginPath();
      ctx.moveTo(0, 250);
      ctx.lineTo(canvas.width, 250);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(400, 0);
      ctx.lineTo(400, canvas.height);
      ctx.stroke();
    }

    // ===== MARKER CREATION =====
    function createMarker(typeInfo, x, y) {
      const id = markerIdCounter++;
      const el = document.createElement('div');
      el.className = `marker-container marker-${typeInfo.type}`;
      if (typeInfo.type === 'artillery' || typeInfo.type === 'revive') {
        el.classList.add('marker-urgent');
      }
      el.style.left = x + 'px';
      el.style.top = y + 'px';

      const circumference = 2 * Math.PI * 28;

      el.innerHTML = `
        <div class="marker-ring">
          <svg viewBox="0 0 64 64">
            <circle class="bg-circle" cx="32" cy="32" r="28"/>
            <circle class="progress-circle" cx="32" cy="32" r="28"
              stroke-dasharray="${circumference}"
              stroke-dashoffset="0"/>
          </svg>
          <div class="marker-icon">
            ${typeInfo.type === 'hacking' ? '<div class="hacking-hex" id="hex-' + id + '">0x00</div>' : typeInfo.icon}
          </div>
        </div>
        <div class="marker-label">${typeInfo.label}</div>
        <div class="marker-time" id="time-${id}">${typeInfo.duration.toFixed(1)}s</div>
      `;

      markersLayer.appendChild(el);

      // Hover events
      el.addEventListener('mouseenter', (e) => showTooltip(e, typeInfo, id));
      el.addEventListener('mouseleave', hideTooltip);
      el.addEventListener('mousemove', (e) => moveTooltip(e));

      return {
        id,
        type: typeInfo.type,
        label: typeInfo.label,
        duration: typeInfo.duration,
        remaining: typeInfo.duration,
        el,
        circumference,
        hexEl: typeInfo.type === 'hacking' ? document.getElementById('hex-' + id) : null,
        timeEl: document.getElementById('time-' + id),
        progressEl: el.querySelector('.progress-circle')
      };
    }

    // ===== TOOLTIP =====
    function showTooltip(e, typeInfo, id) {
      const marker = markers.find(m => m.id === id);
      if (!marker) return;
      tooltip.innerHTML = `<strong>${typeInfo.label}</strong>Time: ${marker.remaining.toFixed(1)}s / ${marker.duration}s<br>Progress: ${((1 - marker.remaining/marker.duration) * 100).toFixed(0)}%`;
      tooltip.classList.add('visible');
      moveTooltip(e);
    }

    function moveTooltip(e) {
      const rect = canvas.parentElement.getBoundingClientRect();
      tooltip.style.left = (e.clientX - rect.left + 16) + 'px';
      tooltip.style.top = (e.clientY - rect.top - 10) + 'px';
    }

    function hideTooltip() {
      tooltip.classList.remove('visible');
    }

    // ===== UPDATE LOOP =====
    function updateMarkers(dt) {
      if (paused) return;

      markers.forEach(m => {
        m.remaining -= dt;
        if (m.remaining < 0) m.remaining = 0;

        const progress = 1 - (m.remaining / m.duration);
        const offset = m.circumference * progress;
        m.progressEl.style.strokeDashoffset = offset;

        m.timeEl.textContent = m.remaining.toFixed(1) + 's';

        if (m.type === 'hacking' && m.hexEl) {
          const hexVal = Math.floor(progress * 255).toString(16).toUpperCase().padStart(2, '0');
          m.hexEl.textContent = '0x' + hexVal;
        }
      });

      // Remove completed markers after a delay
      markers = markers.filter(m => {
        if (m.remaining <= 0) {
          m.timeEl.textContent = 'DONE';
          m.timeEl.style.color = '#888';
          m.progressEl.style.stroke = '#444';
          setTimeout(() => {
            if (m.el.parentNode) m.el.parentNode.removeChild(m.el);
          }, 2000);
          return false;
        }
        return true;
      });
    }

    // ===== GAME LOOP =====
    let lastTime = performance.now();
    function loop(now) {
      const dt = (now - lastTime) / 1000;
      lastTime = now;
      updateMarkers(dt);
      requestAnimationFrame(loop);
    }

    // ===== CLOCK =====
    function updateClock() {
      const now = new Date();
      document.getElementById('clock').textContent = now.toLocaleTimeString('en-US', { hour12: false });
    }
    setInterval(updateClock, 1000);
    updateClock();

    // ===== CONTROLS =====
    function addRandomMarker() {
      const type = MARKER_TYPES[Math.floor(Math.random() * MARKER_TYPES.length)];
      const x = 80 + Math.random() * (canvas.width - 160);
      const y = 80 + Math.random() * (canvas.height - 160);
      markers.push(createMarker(type, x, y));
    }

    function resetAll() {
      markers.forEach(m => {
        if (m.el.parentNode) m.el.parentNode.removeChild(m.el);
      });
      markers = [];
      initMarkers();
    }

    function togglePause() {
      paused = !paused;
    }

    // ===== INIT =====
    function initMarkers() {
      const w = canvas.width;
      const h = canvas.height;
      markers.push(createMarker(MARKER_TYPES[0], w * 0.2, h * 0.25));
      markers.push(createMarker(MARKER_TYPES[1], w * 0.7, h * 0.2));
      markers.push(createMarker(MARKER_TYPES[2], w * 0.5, h * 0.5));
      markers.push(createMarker(MARKER_TYPES[3], w * 0.25, h * 0.7));
      markers.push(createMarker(MARKER_TYPES[4], w * 0.75, h * 0.65));
      markers.push(createMarker(MARKER_TYPES[5], w * 0.5, h * 0.85));
    }

    // Start
    resizeCanvas();
    initMarkers();
    requestAnimationFrame(loop);
  </script>
</body>
</html>
