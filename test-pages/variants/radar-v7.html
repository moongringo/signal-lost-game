<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Helmet HUD — Radar V7</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #0f0;
  }

  /* First-person view background */
  .world {
    position: absolute; inset: 0;
    background:
      radial-gradient(ellipse at 50% 80%, #1a2a1a 0%, #0a0f0a 60%, #000 100%);
    perspective: 800px;
    overflow: hidden;
  }
  /* Ground grid for depth */
  .ground {
    position: absolute;
    bottom: -30%; left: -50%; width: 200%; height: 80%;
    background:
      linear-gradient(to bottom, transparent 0%, #0f1f0f 100%),
      repeating-linear-gradient(0deg, rgba(0,255,0,0.08) 0px, rgba(0,255,0,0.08) 1px, transparent 1px, transparent 40px),
      repeating-linear-gradient(90deg, rgba(0,255,0,0.08) 0px, rgba(0,255,0,0.08) 1px, transparent 1px, transparent 40px);
    transform: rotateX(75deg);
    transform-origin: bottom center;
    animation: gridMove 2s linear infinite;
  }
  @keyframes gridMove {
    from { background-position: 0 0, 0 0, 0 0; }
    to { background-position: 0 0, 0 40px, 0 0; }
  }

  /* Scanlines overlay */
  .scanlines {
    position: absolute; inset: 0;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.25) 0px, rgba(0,0,0,0.25) 1px, transparent 1px, transparent 3px);
    pointer-events: none;
    z-index: 10;
  }
  /* Vignette */
  .vignette {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(0,0,0,0.7) 100%);
    pointer-events: none;
    z-index: 11;
  }

  /* HUD container */
  .hud {
    position: absolute; inset: 0;
    z-index: 20;
    pointer-events: none;
  }

  /* Compass strip at top */
  .compass {
    position: absolute;
    top: 12px; left: 50%;
    transform: translateX(-50%);
    width: 420px; height: 32px;
    background: rgba(0,20,0,0.6);
    border: 1px solid rgba(0,255,0,0.4);
    border-radius: 4px;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    letter-spacing: 2px;
    text-shadow: 0 0 4px #0f0;
  }
  .compass-ticks {
    position: absolute;
    top: 0; left: 0;
    width: 800px; height: 100%;
    display: flex;
    align-items: center;
    animation: compassScroll 8s linear infinite;
  }
  @keyframes compassScroll {
    from { transform: translateX(0); }
    to { transform: translateX(-200px); }
  }
  .compass-tick {
    position: absolute;
    top: 0; bottom: 0;
    width: 1px;
    background: rgba(0,255,0,0.5);
  }
  .compass-tick.major { height: 100%; background: rgba(0,255,0,0.9); }
  .compass-tick.minor { height: 40%; top: 30%; }
  .compass-label {
    position: absolute;
    top: 2px;
    font-size: 10px;
    color: #0f0;
    text-shadow: 0 0 3px #0f0;
    transform: translateX(-50%);
  }
  .compass-center {
    position: absolute;
    top: 0; bottom: 0; left: 50%;
    width: 2px;
    background: #0f0;
    box-shadow: 0 0 6px #0f0;
    transform: translateX(-50%);
    z-index: 2;
  }
  .compass-reading {
    position: relative;
    z-index: 3;
    background: rgba(0,10,0,0.8);
    padding: 2px 10px;
    border-radius: 2px;
    font-weight: bold;
  }

  /* Circular radar top-left */
  .radar-wrap {
    position: absolute;
    top: 60px; left: 20px;
    width: 200px; height: 200px;
  }
  .radar-label {
    position: absolute;
    top: -18px; left: 0;
    font-size: 11px;
    letter-spacing: 2px;
    color: #0f0;
    text-shadow: 0 0 4px #0f0;
    opacity: 0.9;
  }
  .radar {
    width: 100%; height: 100%;
    border-radius: 50%;
    background: rgba(0,20,0,0.5);
    border: 2px solid rgba(0,255,0,0.5);
    box-shadow: 0 0 15px rgba(0,255,0,0.15), inset 0 0 20px rgba(0,255,0,0.05);
    position: relative;
    overflow: hidden;
  }
  .radar-grid {
    position: absolute; inset: 10%;
    border-radius: 50%;
    border: 1px solid rgba(0,255,0,0.2);
  }
  .radar-grid:nth-child(2) { inset: 25%; }
  .radar-grid:nth-child(3) { inset: 40%; }
  .radar-cross {
    position: absolute; inset: 0;
  }
  .radar-cross::before, .radar-cross::after {
    content: '';
    position: absolute;
    background: rgba(0,255,0,0.2);
  }
  .radar-cross::before { top: 50%; left: 0; right: 0; height: 1px; }
  .radar-cross::after { left: 50%; top: 0; bottom: 0; width: 1px; }
  .radar-sweep {
    position: absolute;
    top: 50%; left: 50%;
    width: 50%; height: 2px;
    background: linear-gradient(90deg, rgba(0,255,0,0.8), transparent);
    transform-origin: 0 50%;
    animation: radarSweep 3s linear infinite;
    box-shadow: 0 0 6px rgba(0,255,0,0.5);
  }
  @keyframes radarSweep {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }
  .radar-player {
    position: absolute;
    top: 50%; left: 50%;
    width: 0; height: 0;
    transform: translate(-50%, -50%);
  }
  .radar-player::before {
    content: '';
    position: absolute;
    top: -6px; left: -3px;
    width: 0; height: 0;
    border-left: 3px solid transparent;
    border-right: 3px solid transparent;
    border-bottom: 8px solid #0f0;
    filter: drop-shadow(0 0 3px #0f0);
  }
  .radar-blip {
    position: absolute;
    width: 6px; height: 6px;
    background: #f00;
    border-radius: 50%;
    box-shadow: 0 0 6px #f00;
    animation: blipPulse 1.5s ease-in-out infinite;
  }
  @keyframes blipPulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.4); }
  }

  /* Health bar on left */
  .health-bar {
    position: absolute;
    left: 20px; top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 180px;
    background: rgba(0,20,0,0.5);
    border: 1px solid rgba(0,255,0,0.4);
    border-radius: 4px;
    display: flex;
    flex-direction: column-reverse;
    padding: 3px;
    gap: 2px;
  }
  .health-segment {
    flex: 1;
    background: rgba(0,255,0,0.7);
    border-radius: 1px;
    box-shadow: 0 0 3px rgba(0,255,0,0.4);
    transition: background 0.3s;
  }
  .health-segment.low { background: rgba(255,0,0,0.8); box-shadow: 0 0 4px #f00; }
  .health-segment.mid { background: rgba(255,200,0,0.8); box-shadow: 0 0 4px #fc0; }
  .health-label {
    position: absolute;
    left: 22px; top: calc(50% + 100px);
    font-size: 10px;
    letter-spacing: 1px;
    color: #0f0;
    text-shadow: 0 0 3px #0f0;
    transform: rotate(-90deg);
    transform-origin: left center;
  }
  .health-value {
    position: absolute;
    left: 54px; top: 50%;
    transform: translateY(-50%);
    font-size: 18px;
    font-weight: bold;
    color: #0f0;
    text-shadow: 0 0 6px #0f0;
  }

  /* Ammo counter bottom-right */
  .ammo {
    position: absolute;
    bottom: 30px; right: 30px;
    text-align: right;
  }
  .ammo-current {
    font-size: 48px;
    font-weight: bold;
    color: #0f0;
    text-shadow: 0 0 10px #0f0;
    line-height: 1;
  }
  .ammo-reserve {
    font-size: 14px;
    color: rgba(0,255,0,0.7);
    text-shadow: 0 0 4px rgba(0,255,0,0.5);
    margin-top: 4px;
  }
  .ammo-label {
    font-size: 10px;
    letter-spacing: 2px;
    color: rgba(0,255,0,0.6);
    margin-bottom: 2px;
  }

  /* Threat indicators (red arrows at edges) */
  .threat {
    position: absolute;
    width: 0; height: 0;
    filter: drop-shadow(0 0 6px #f00);
    animation: threatBlink 0.6s ease-in-out infinite alternate;
    z-index: 30;
  }
  @keyframes threatBlink {
    from { opacity: 0.6; }
    to { opacity: 1; }
  }
  .threat-top {
    top: 50px; left: 50%;
    transform: translateX(-50%);
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 14px solid #f00;
  }
  .threat-bottom {
    bottom: 50px; left: 50%;
    transform: translateX(-50%);
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-bottom: 14px solid #f00;
  }
  .threat-left {
    left: 50px; top: 50%;
    transform: translateY(-50%);
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-left: 14px solid #f00;
  }
  .threat-right {
    right: 50px; top: 50%;
    transform: translateY(-50%);
    border-top: 10px solid transparent;
    border-bottom: 10px solid transparent;
    border-right: 14px solid #f00;
  }
  .threat-tl {
    top: 55px; left: 55px;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 14px solid #f00;
    transform: rotate(-45deg);
  }
  .threat-tr {
    top: 55px; right: 55px;
    border-left: 10px solid transparent;
    border-right: 10px solid transparent;
    border-top: 14px solid #f00;
    transform: rotate(45deg);
  }

  /* Corner brackets */
  .corner {
    position: absolute;
    width: 30px; height: 30px;
    border-color: rgba(0,255,0,0.5);
    border-style: solid;
    pointer-events: none;
  }
  .corner-tl { top: 10px; left: 10px; border-width: 2px 0 0 2px; }
  .corner-tr { top: 10px; right: 10px; border-width: 2px 2px 0 0; }
  .corner-bl { bottom: 10px; left: 10px; border-width: 0 0 2px 2px; }
  .corner-br { bottom: 10px; right: 10px; border-width: 0 2px 2px 0; }

  /* HUD title bottom-left */
  .hud-title {
    position: absolute;
    bottom: 30px; left: 30px;
    font-size: 12px;
    letter-spacing: 4px;
    color: rgba(0,255,0,0.7);
    text-shadow: 0 0 4px rgba(0,255,0,0.4);
  }

  /* Data readouts top-right */
  .readouts {
    position: absolute;
    top: 60px; right: 20px;
    text-align: right;
    font-size: 11px;
    line-height: 1.8;
    color: rgba(0,255,0,0.7);
    text-shadow: 0 0 3px rgba(0,255,0,0.3);
  }
</style>
</head>
<body>

<div class="world">
  <div class="ground"></div>
</div>

<div class="scanlines"></div>
<div class="vignette"></div>

<div class="hud">
  <!-- Compass -->
  <div class="compass">
    <div class="compass-ticks" id="compassTicks"></div>
    <div class="compass-center"></div>
    <div class="compass-reading" id="compassReading">000° N</div>
  </div>

  <!-- Radar -->
  <div class="radar-wrap">
    <div class="radar-label">RADAR V7</div>
    <div class="radar">
      <div class="radar-grid"></div>
      <div class="radar-grid"></div>
      <div class="radar-grid"></div>
      <div class="radar-cross"></div>
      <div class="radar-sweep"></div>
      <div class="radar-player"></div>
      <div class="radar-blip" style="top:35%;left:65%;"></div>
      <div class="radar-blip" style="top:70%;left:30%;"></div>
      <div class="radar-blip" style="top:25%;left:45%;"></div>
    </div>
  </div>

  <!-- Health bar -->
  <div class="health-bar" id="healthBar"></div>
  <div class="health-label">INTEGRITY</div>
  <div class="health-value" id="healthValue">78</div>

  <!-- Ammo -->
  <div class="ammo">
    <div class="ammo-label">AMMUNITION</div>
    <div class="ammo-current" id="ammoCurrent">30</div>
    <div class="ammo-reserve" id="ammoReserve">/ 120</div>
  </div>

  <!-- Threat indicators -->
  <div class="threat threat-top"></div>
  <div class="threat threat-right"></div>
  <div class="threat threat-tl"></div>

  <!-- Corner brackets -->
  <div class="corner corner-tl"></div>
  <div class="corner corner-tr"></div>
  <div class="corner corner-bl"></div>
  <div class="corner corner-br"></div>

  <!-- Readouts -->
  <div class="readouts">
    <div>ALT: 142.3m</div>
    <div>SPD: 12.7 km/h</div>
    <div>O₂: 98%</div>
    <div>SIG: -42 dBm</div>
  </div>

  <!-- HUD title -->
  <div class="hud-title">RADAR V7</div>
</div>

<script>
  // Build compass ticks
  const tickContainer = document.getElementById('compassTicks');
  const directions = ['N','NE','E','SE','S','SW','W','NW'];
  const dirDeg = [0,45,90,135,180,225,270,315];
  for (let i = 0; i < 16; i++) {
    const deg = i * 22.5;
    const tick = document.createElement('div');
    tick.className = 'compass-tick ' + (deg % 45 === 0 ? 'major' : 'minor');
    tick.style.left = (deg / 360 * 100) + '%';
    tickContainer.appendChild(tick);
    if (deg % 45 === 0) {
      const label = document.createElement('div');
      label.className = 'compass-label';
      label.textContent = directions[(deg / 45) % 8];
      label.style.left = (deg / 360 * 100) + '%';
      tickContainer.appendChild(label);
    }
  }

  // Health bar segments
  const healthBar = document.getElementById('healthBar');
  const healthValue = document.getElementById('healthValue');
  const maxHealth = 10;
  const currentHealth = 7.8;
  for (let i = 0; i < maxHealth; i++) {
    const seg = document.createElement('div');
    seg.className = 'health-segment';
    if (i >= Math.ceil(currentHealth)) {
      seg.style.background = 'rgba(0,255,0,0.1)';
      seg.style.boxShadow = 'none';
    } else if (i >= 6) {
      seg.classList.add('low');
    } else if (i >= 4) {
      seg.classList.add('mid');
    }
    healthBar.appendChild(seg);
  }

  // Compass reading animation
  const compassReading = document.getElementById('compassReading');
  let heading = 0;
  setInterval(() => {
    heading = (heading + 0.3) % 360;
    const h = Math.floor(heading);
    const dirs = ['N','NE','E','SE','S','SW','W','NW'];
    const dir = dirs[Math.round(heading / 45) % 8];
    compassReading.textContent = String(h).padStart(3, '0') + '° ' + dir;
  }, 50);

  // Ammo counter animation
  const ammoCurrent = document.getElementById('ammoCurrent');
  let ammo = 30;
  setInterval(() => {
    if (Math.random() > 0.85 && ammo > 0) {
      ammo--;
      ammoCurrent.textContent = ammo;
      ammoCurrent.style.color = ammo < 10 ? '#f00' : '#0f0';
      ammoCurrent.style.textShadow = ammo < 10 ? '0 0 10px #f00' : '0 0 10px #0f0';
    }
  }, 800);
</script>

</body>
</html>
