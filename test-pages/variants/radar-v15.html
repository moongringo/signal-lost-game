<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Radar V15 — Satellite View</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0f0a;
    overflow: hidden;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
  }
  canvas { display: block; }
  #hud {
    position: absolute;
    top: 14px;
    left: 18px;
    color: #c8e6c9;
    font-size: 13px;
    letter-spacing: 2px;
    text-transform: uppercase;
    pointer-events: none;
    text-shadow: 0 0 6px rgba(100,255,100,0.35);
  }
  #hud b {
    font-size: 18px;
    color: #a5d6a7;
    display: block;
    margin-bottom: 2px;
  }
  #inset {
    position: absolute;
    bottom: 14px;
    right: 14px;
    background: rgba(10, 18, 10, 0.82);
    border: 1px solid rgba(120, 200, 120, 0.35);
    border-radius: 4px;
    padding: 10px 14px;
    color: #a5d6a7;
    font-size: 11px;
    font-family: 'Courier New', Courier, monospace;
    letter-spacing: 1px;
    pointer-events: none;
    box-shadow: 0 0 12px rgba(80, 180, 80, 0.15);
  }
  #inset div { margin: 2px 0; }
  #inset .label { color: #81c784; opacity: 0.8; }
</style>
</head>
<body>
<canvas id="radar"></canvas>
<div id="hud"><b>RADAR V15</b>SATELLITE VIEW</div>
<div id="inset">
  <div><span class="label">ZOOM:</span> <span id="zoomVal">1.0x</span></div>
  <div><span class="label">LAT:</span> <span id="latVal">34.0522 N</span></div>
  <div><span class="label">LON:</span> <span id="lonVal">118.2437 W</span></div>
  <div><span class="label">ALT:</span> <span id="altVal">420 km</span></div>
</div>

<script>
(function(){
  const canvas = document.getElementById('radar');
  const ctx = canvas.getContext('2d');
  let W, H;

  function resize() {
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }
  window.addEventListener('resize', resize);
  resize();

  // Terrain seed noise
  const terrainSeed = Math.random() * 1000;
  function noise(x, y) {
    const n = Math.sin(x * 12.9898 + y * 78.233 + terrainSeed) * 43758.5453;
    return n - Math.floor(n);
  }
  function smoothNoise(x, y) {
    const ix = Math.floor(x), iy = Math.floor(y);
    const fx = x - ix, fy = y - iy;
    const a = noise(ix, iy);
    const b = noise(ix + 1, iy);
    const c = noise(ix, iy + 1);
    const d = noise(ix + 1, iy + 1);
    const ux = fx * fx * (3 - 2 * fx);
    const uy = fy * fy * (3 - 2 * fy);
    return a + (b - a) * ux + (c - a) * uy + (a - b - c + d) * ux * uy;
  }
  function fbm(x, y, octaves) {
    let v = 0, a = 0.5;
    for (let i = 0; i < octaves; i++) {
      v += a * smoothNoise(x * (1 << i), y * (1 << i));
      a *= 0.5;
    }
    return v;
  }

  // Terrain color from noise value
  function terrainColor(v) {
    // v in 0..1
    if (v < 0.28) return `rgb(${30 + v*60}, ${50 + v*80}, ${25 + v*50})`; // deep forest
    if (v < 0.42) return `rgb(${60 + v*80}, ${90 + v*90}, ${40 + v*50})`; // grass
    if (v < 0.55) return `rgb(${100 + v*60}, ${110 + v*60}, ${50 + v*30})`; // dry grass
    if (v < 0.70) return `rgb(${140 + v*40}, ${120 + v*40}, ${60 + v*20})`; // dirt
    if (v < 0.82) return `rgb(${160 + v*30}, ${140 + v*20}, ${90 + v*10})`; // rock
    return `rgb(${180 + v*40}, ${170 + v*30}, ${150 + v*20})`; // mountain
  }

  // Pre-render terrain texture (larger than screen for panning)
  const TEX_W = 2400, TEX_H = 2400;
  const terrainCanvas = document.createElement('canvas');
  terrainCanvas.width = TEX_W;
  terrainCanvas.height = TEX_H;
  const tctx = terrainCanvas.getContext('2d');

  // Draw terrain
  const imgData = tctx.createImageData(TEX_W, TEX_H);
  const data = imgData.data;
  for (let y = 0; y < TEX_H; y++) {
    for (let x = 0; x < TEX_W; x++) {
      const v = fbm(x / 280, y / 280, 5);
      const c = terrainColor(v);
      const rgb = c.match(/\d+/g).map(Number);
      const i = (y * TEX_W + x) * 4;
      data[i] = rgb[0];
      data[i+1] = rgb[1];
      data[i+2] = rgb[2];
      data[i+3] = 255;
    }
  }
  tctx.putImageData(imgData, 0, 0);

  // Add subtle noise grain
  tctx.globalCompositeOperation = 'overlay';
  for (let y = 0; y < TEX_H; y += 2) {
    for (let x = 0; x < TEX_W; x += 2) {
      const g = (Math.random() * 30) | 0;
      tctx.fillStyle = `rgba(${g},${g},${g},0.08)`;
      tctx.fillRect(x, y, 2, 2);
    }
  }
  tctx.globalCompositeOperation = 'source-over';

  // Buildings with shadows
  const buildings = [];
  for (let i = 0; i < 180; i++) {
    buildings.push({
      x: Math.random() * TEX_W,
      y: Math.random() * TEX_H,
      w: 12 + Math.random() * 30,
      h: 10 + Math.random() * 22,
      height: 20 + Math.random() * 60, // "3D" height for shadow length
      angle: Math.random() * Math.PI * 2
    });
  }

  // Roads (simple lines)
  const roads = [];
  for (let i = 0; i < 40; i++) {
    roads.push({
      x1: Math.random() * TEX_W,
      y1: Math.random() * TEX_H,
      x2: Math.random() * TEX_W,
      y2: Math.random() * TEX_H,
      w: 2 + Math.random() * 4
    });
  }

  // Clouds
  const clouds = [];
  for (let i = 0; i < 18; i++) {
    clouds.push({
      x: Math.random() * TEX_W,
      y: Math.random() * TEX_H,
      r: 60 + Math.random() * 120,
      speed: 0.15 + Math.random() * 0.35,
      opacity: 0.12 + Math.random() * 0.18
    });
  }

  // Units
  const players = [];
  for (let i = 0; i < 6; i++) {
    players.push({
      x: Math.random() * TEX_W,
      y: Math.random() * TEX_H,
      vx: (Math.random() - 0.5) * 0.6,
      vy: (Math.random() - 0.5) * 0.6
    });
  }
  const enemies = [];
  for (let i = 0; i < 5; i++) {
    enemies.push({
      x: Math.random() * TEX_W,
      y: Math.random() * TEX_H,
      vx: (Math.random() - 0.5) * 0.5,
      vy: (Math.random() - 0.5) * 0.5
    });
  }

  // Camera pan
  let camX = 0, camY = 0;
  const panSpeed = 0.25;
  const panRadiusX = TEX_W * 0.35;
  const panRadiusY = TEX_H * 0.35;
  let panAngle = 0;

  // Inset values
  const zoomEl = document.getElementById('zoomVal');
  const latEl = document.getElementById('latVal');
  const lonEl = document.getElementById('lonVal');

  function drawShadowRect(ctx, bx, by, bw, bh, h, lightAngle) {
    const len = h * 1.8;
    const dx = Math.cos(lightAngle) * len;
    const dy = Math.sin(lightAngle) * len;
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(bx, by);
    ctx.lineTo(bx + bw, by);
    ctx.lineTo(bx + bw + dx, by + dy);
    ctx.lineTo(bx + dx, by + dy);
    ctx.closePath();
    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fill();
    ctx.restore();
  }

  function drawBuilding(ctx, b, lightAngle) {
    drawShadowRect(ctx, b.x, b.y, b.w, b.h, b.height, lightAngle);
    ctx.fillStyle = 'rgba(45, 50, 55, 0.9)';
    ctx.fillRect(b.x, b.y, b.w, b.h);
    // Roof highlight
    ctx.fillStyle = 'rgba(70, 75, 80, 0.7)';
    ctx.fillRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
  }

  function drawRoads(ctx) {
    ctx.strokeStyle = 'rgba(100, 95, 85, 0.55)';
    ctx.lineWidth = 3;
    for (const r of roads) {
      ctx.beginPath();
      ctx.moveTo(r.x1, r.y1);
      ctx.lineTo(r.x2, r.y2);
      ctx.stroke();
    }
  }

  function drawClouds(ctx, t) {
    for (const c of clouds) {
      const cx = (c.x + t * c.speed * 20) % (TEX_W + 400) - 200;
      const cy = c.y;
      const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, c.r);
      g.addColorStop(0, `rgba(240, 245, 250, ${c.opacity})`);
      g.addColorStop(0.5, `rgba(220, 230, 240, ${c.opacity * 0.6})`);
      g.addColorStop(1, 'rgba(220, 230, 240, 0)');
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.arc(cx, cy, c.r, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function drawSatelliteCrosshair(ctx, x, y) {
    const size = 14;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.arc(x, y, size, 0, Math.PI * 2);
    ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(x - size - 6, y);
    ctx.lineTo(x + size + 6, y);
    ctx.moveTo(x, y - size - 6);
    ctx.lineTo(x, y + size + 6);
    ctx.stroke();
    // Center dot
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(x, y, 2, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawEnemyMarker(ctx, x, y, t) {
    const pulse = 0.6 + 0.4 * Math.sin(t * 3);
    const r = 18 + pulse * 10;
    ctx.strokeStyle = `rgba(255, 60, 60, ${0.5 + pulse * 0.4})`;
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(x, y, r, 0, Math.PI * 2);
    ctx.stroke();
    // Inner cross
    ctx.strokeStyle = 'rgba(255, 60, 60, 0.9)';
    ctx.lineWidth = 1.5;
    const s = 10;
    ctx.beginPath();
    ctx.moveTo(x - s, y);
    ctx.lineTo(x + s, y);
    ctx.moveTo(x, y - s);
    ctx.lineTo(x, y + s);
    ctx.stroke();
    // Center
    ctx.fillStyle = 'rgba(255, 40, 40, 0.95)';
    ctx.beginPath();
    ctx.arc(x, y, 3, 0, Math.PI * 2);
    ctx.fill();
  }

  function updateUnits(arr, boundsW, boundsH) {
    for (const u of arr) {
      u.x += u.vx;
      u.y += u.vy;
      if (u.x < 0 || u.x > boundsW) u.vx *= -1;
      if (u.y < 0 || u.y > boundsH) u.vy *= -1;
    }
  }

  let last = performance.now();
  function loop(now) {
    const dt = (now - last) / 1000;
    last = now;
    const t = now / 1000;

    // Camera pan in a slow ellipse
    panAngle += panSpeed * dt;
    camX = TEX_W / 2 + Math.cos(panAngle) * panRadiusX - W / 2;
    camY = TEX_H / 2 + Math.sin(panAngle * 0.7) * panRadiusY - H / 2;

    // Clamp
    camX = Math.max(0, Math.min(TEX_W - W, camX));
    camY = Math.max(0, Math.min(TEX_H - H, camY));

    // Update inset
    const zoom = 1.0 + 0.15 * Math.sin(t * 0.4);
    zoomEl.textContent = zoom.toFixed(2) + 'x';
    const lat = 34.0522 + Math.sin(panAngle) * 0.08;
    const lon = 118.2437 + Math.cos(panAngle * 0.7) * 0.1;
    latEl.textContent = (lat >= 0 ? lat.toFixed(4) + ' N' : Math.abs(lat).toFixed(4) + ' S');
    lonEl.textContent = (lon >= 0 ? lon.toFixed(4) + ' W' : Math.abs(lon).toFixed(4) + ' E');

    // Clear
    ctx.fillStyle = '#0b0f0a';
    ctx.fillRect(0, 0, W, H);

    // Draw terrain
    ctx.drawImage(terrainCanvas, -camX, -camY);

    // Roads
    ctx.save();
    ctx.translate(-camX, -camY);
    drawRoads(ctx);
    ctx.restore();

    // Buildings + shadows
    const lightAngle = Math.PI / 4 + Math.sin(t * 0.2) * 0.15;
    ctx.save();
    ctx.translate(-camX, -camY);
    for (const b of buildings) {
      drawBuilding(ctx, b, lightAngle);
    }
    ctx.restore();

    // Clouds
    ctx.save();
    ctx.translate(-camX, -camY);
    drawClouds(ctx, t);
    ctx.restore();

    // Units
    ctx.save();
    ctx.translate(-camX, -camY);
    updateUnits(players, TEX_W, TEX_H);
    updateUnits(enemies, TEX_W, TEX_H);
    for (const p of players) {
      drawSatelliteCrosshair(ctx, p.x, p.y);
    }
    for (const e of enemies) {
      drawEnemyMarker(ctx, e.x, e.y, t);
    }
    ctx.restore();

    // Vignette
    const vig = ctx.createRadialGradient(W/2, H/2, W*0.25, W/2, H/2, W*0.75);
    vig.addColorStop(0, 'rgba(0,0,0,0)');
    vig.addColorStop(1, 'rgba(0,10,0,0.45)');
    ctx.fillStyle = vig;
    ctx.fillRect(0, 0, W, H);

    // Scanline overlay (subtle)
    ctx.fillStyle = 'rgba(0, 0, 0, 0.03)';
    for (let y = 0; y < H; y += 3) {
      ctx.fillRect(0, y, W, 1);
    }

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
