<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CHAT V8 — Ping Wheel</title>
<style>
  :root {
    --bg: #0b0c10;
    --panel: #1f2833;
    --accent: #66fcf1;
    --accent2: #45a29e;
    --text: #c5c6c7;
    --muted: #6c757d;
    --danger: #ff4d4d;
    --warn: #ffc107;
    --success: #2ecc71;
    --info: #3498db;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }

  /* HUD */
  .hud {
    position: absolute; top: 12px; left: 16px;
    font-size: 12px; letter-spacing: 2px; color: var(--accent);
    text-transform: uppercase; opacity: .9; pointer-events: none; z-index: 50;
  }

  /* Tactical map */
  #map {
    position: absolute; inset: 0;
    background:
      radial-gradient(circle at 20% 30%, rgba(102,252,241,0.06) 0%, transparent 60%),
      radial-gradient(circle at 80% 70%, rgba(255,77,77,0.05) 0%, transparent 60%),
      linear-gradient(180deg, #0b0c10 0%, #14161d 100%);
    z-index: 1;
  }
  .grid-line {
    position: absolute; background: rgba(102,252,241,0.06);
  }
  .map-marker {
    position: absolute; width: 14px; height: 14px; border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 10px currentColor, 0 0 20px currentColor;
    animation: markerIn .4s ease-out;
    z-index: 5; pointer-events: none;
  }
  @keyframes markerIn {
    from { transform: translate(-50%, -50%) scale(0); opacity: 0; }
    to   { transform: translate(-50%, -50%) scale(1); opacity: 1; }
  }
  .marker-label {
    position: absolute; top: -22px; left: 50%; transform: translateX(-50%);
    font-size: 10px; letter-spacing: 1px; text-transform: uppercase;
    white-space: nowrap; color: currentColor; text-shadow: 0 0 6px currentColor;
    pointer-events: none;
  }

  /* Chat bar */
  .chat-wrap {
    position: absolute; bottom: 180px; right: 24px;
    width: 320px; z-index: 20;
    display: flex; flex-direction: column; align-items: flex-end;
  }
  .chat-toggle {
    background: var(--panel); color: var(--accent); border: 1px solid var(--accent2);
    padding: 6px 14px; font-size: 11px; letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; border-radius: 4px; margin-bottom: 6px;
    transition: background .2s;
  }
  .chat-toggle:hover { background: #2a3a4a; }
  .chat-box {
    background: rgba(31,40,51,0.95); border: 1px solid var(--accent2);
    border-radius: 6px; width: 100%; max-height: 220px;
    display: none; flex-direction: column; overflow: hidden;
    backdrop-filter: blur(4px);
  }
  .chat-box.open { display: flex; }
  .chat-messages {
    flex: 1; overflow-y: auto; padding: 10px 12px;
    font-size: 12px; line-height: 1.5;
  }
  .chat-messages::-webkit-scrollbar { width: 4px; }
  .chat-messages::-webkit-scrollbar-thumb { background: var(--accent2); border-radius: 2px; }
  .msg { margin-bottom: 6px; }
  .msg .ts { color: var(--muted); font-size: 10px; margin-right: 6px; }
  .msg .who { font-weight: 700; margin-right: 4px; }
  .msg.sys { color: var(--accent); font-style: italic; opacity: .85; }
  .chat-input-row {
    display: flex; border-top: 1px solid var(--accent2);
  }
  .chat-input {
    flex: 1; background: transparent; border: none; outline: none;
    color: var(--text); padding: 8px 10px; font-size: 12px;
  }
  .chat-send {
    background: var(--accent2); color: #000; border: none;
    padding: 0 14px; font-size: 11px; font-weight: 700;
    cursor: pointer; text-transform: uppercase; letter-spacing: 1px;
  }
  .chat-send:hover { background: var(--accent); }

  /* Ping wheel */
  .ping-area {
    position: absolute; bottom: 24px; right: 24px;
    width: 180px; height: 180px; z-index: 20;
  }
  .ping-btn {
    position: absolute; bottom: 0; right: 0;
    width: 56px; height: 56px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--accent);
    color: var(--accent); font-size: 10px; font-weight: 700;
    letter-spacing: 1px; text-transform: uppercase;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 14px rgba(102,252,241,0.25);
    transition: transform .15s, box-shadow .15s; z-index: 22;
  }
  .ping-btn:hover { transform: scale(1.08); box-shadow: 0 0 22px rgba(102,252,241,0.45); }
  .ping-wheel {
    position: absolute; bottom: 28px; right: 28px;
    width: 160px; height: 160px; border-radius: 50%;
    opacity: 0; pointer-events: none; transform: scale(0.9);
    transition: opacity .18s ease, transform .18s ease; z-index: 21;
  }
  .ping-wheel.active { opacity: 1; pointer-events: auto; transform: scale(1); }
  .ping-slice {
    position: absolute; width: 72px; height: 72px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 9px; font-weight: 700; letter-spacing: .6px;
    text-transform: uppercase; text-align: center; line-height: 1.1;
    cursor: pointer; border: 2px solid transparent;
    transition: transform .12s, border-color .12s, box-shadow .12s;
    color: #000; user-select: none;
  }
  .ping-slice:hover { transform: scale(1.12); z-index: 23; }

  /* Slice positions (clockwise from top) */
  .s1 { top: 0; left: 50%; transform: translateX(-50%); background: var(--danger); }
  .s1:hover { border-color: #ff8080; box-shadow: 0 0 14px var(--danger); }
  .s2 { top: 18%; right: 4%; background: var(--warn); color: #000; }
  .s2:hover { border-color: #ffe066; box-shadow: 0 0 14px var(--warn); }
  .s3 { bottom: 18%; right: 4%; background: var(--success); }
  .s3:hover { border-color: #6ee7a1; box-shadow: 0 0 14px var(--success); }
  .s4 { bottom: 0; left: 50%; transform: translateX(-50%); background: var(--info); }
  .s4:hover { border-color: #7ec8f0; box-shadow: 0 0 14px var(--info); }
  .s5 { bottom: 18%; left: 4%; background: #9b59b6; }
  .s5:hover { border-color: #c39bd3; box-shadow: 0 0 14px #9b59b6; }
  .s6 { top: 18%; left: 4%; background: #e67e22; }
  .s6:hover { border-color: #f5b041; box-shadow: 0 0 14px #e67e22; }

  /* Center deadzone */
  .wheel-center {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 44px; height: 44px; border-radius: 50%;
    background: var(--panel); border: 2px solid var(--accent2);
    z-index: 22; pointer-events: none;
  }

  /* Hint */
  .hint {
    position: absolute; bottom: 8px; right: 210px;
    font-size: 10px; color: var(--muted); letter-spacing: .5px; z-index: 20;
    text-align: right; line-height: 1.4;
  }
</style>
</head>
<body>

<div class="hud">CHAT V8</div>

<!-- Tactical map -->
<div id="map"></div>

<!-- Chat -->
<div class="chat-wrap">
  <button class="chat-toggle" id="chatToggle">Open Chat</button>
  <div class="chat-box" id="chatBox">
    <div class="chat-messages" id="chatMessages"></div>
    <div class="chat-input-row">
      <input class="chat-input" id="chatInput" type="text" placeholder="Type message…" autocomplete="off" />
      <button class="chat-send" id="chatSend">Send</button>
    </div>
  </div>
</div>

<!-- Ping wheel -->
<div class="ping-area" id="pingArea">
  <div class="ping-wheel" id="pingWheel">
    <div class="ping-slice s1" data-label="Enemy Here" data-color="var(--danger)">Enemy<br>Here</div>
    <div class="ping-slice s2" data-label="Looking Here" data-color="var(--warn)">Looking<br>Here</div>
    <div class="ping-slice s3" data-label="Going Here" data-color="var(--success)">Going<br>Here</div>
    <div class="ping-slice s4" data-label="Watching Here" data-color="var(--info)">Watching<br>Here</div>
    <div class="ping-slice s5" data-label="Defending" data-color="#9b59b6">Defending</div>
    <div class="ping-slice s6" data-label="Attacking" data-color="#e67e22">Attacking</div>
    <div class="wheel-center"></div>
  </div>
  <button class="ping-btn" id="pingBtn">Ping</button>
</div>

<div class="hint">Hold / click Ping to open wheel<br>Select a ping to mark map &amp; send chat</div>

<script>
  const mapEl = document.getElementById('map');
  const chatToggle = document.getElementById('chatToggle');
  const chatBox = document.getElementById('chatBox');
  const chatMessages = document.getElementById('chatMessages');
  const chatInput = document.getElementById('chatInput');
  const chatSend = document.getElementById('chatSend');
  const pingBtn = document.getElementById('pingBtn');
  const pingWheel = document.getElementById('pingWheel');
  const slices = document.querySelectorAll('.ping-slice');

  // Draw faint grid on map
  (function drawGrid() {
    const cols = 12, rows = 8;
    for (let i = 1; i < cols; i++) {
      const d = document.createElement('div');
      d.className = 'grid-line';
      d.style.left = (i / cols * 100) + '%';
      d.style.top = '0'; d.style.width = '1px'; d.style.height = '100%';
      mapEl.appendChild(d);
    }
    for (let i = 1; i < rows; i++) {
      const d = document.createElement('div');
      d.className = 'grid-line';
      d.style.top = (i / rows * 100) + '%';
      d.style.left = '0'; d.style.height = '1px'; d.style.width = '100%';
      mapEl.appendChild(d);
    }
  })();

  let chatOpen = false;
  function toggleChat() {
    chatOpen = !chatOpen;
    chatBox.classList.toggle('open', chatOpen);
    chatToggle.textContent = chatOpen ? 'Close Chat' : 'Open Chat';
    if (chatOpen) setTimeout(() => chatInput.focus(), 50);
  }
  chatToggle.addEventListener('click', toggleChat);

  function now() {
    const d = new Date();
    return d.toTimeString().slice(0, 5);
  }

  function addMessage(who, text, type='') {
    const row = document.createElement('div');
    row.className = 'msg ' + type;
    row.innerHTML = `<span class="ts">[${now()}]</span><span class="who">${who}:</span><span class="txt">${escapeHtml(text)}</span>`;
    chatMessages.appendChild(row);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
  function addSystem(text) {
    const row = document.createElement('div');
    row.className = 'msg sys';
    row.innerHTML = `<span class="ts">[${now()}]</span><span class="txt">${escapeHtml(text)}</span>`;
    chatMessages.appendChild(row);
    chatMessages.scrollTop = chatMessages.scrollHeight;
  }
  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  chatSend.addEventListener('click', () => {
    const v = chatInput.value.trim();
    if (!v) return;
    addMessage('You', v);
    chatInput.value = '';
    // simulated reply
    setTimeout(() => addMessage('Squadmate', randomReply()), 900 + Math.random()*900);
  });
  chatInput.addEventListener('keydown', e => { if (e.key === 'Enter') chatSend.click(); });

  const replies = [
    "Copy that.", "On my way.", "Roger.", "Eyes on.", "Got your back.",
    "Moving now.", "Affirmative.", "Hold position.", "Engaging.", "Fallback!"
  ];
  function randomReply() { return replies[Math.floor(Math.random()*replies.length)]; }

  // Ping wheel logic
  let wheelOpen = false;
  let holdTimer = null;

  function openWheel() {
    wheelOpen = true;
    pingWheel.classList.add('active');
    pingBtn.style.opacity = '0';
    pingBtn.style.pointerEvents = 'none';
  }
  function closeWheel() {
    wheelOpen = false;
    pingWheel.classList.remove('active');
    pingBtn.style.opacity = '1';
    pingBtn.style.pointerEvents = 'auto';
  }

  pingBtn.addEventListener('mousedown', () => {
    holdTimer = setTimeout(() => { holdTimer = null; openWheel(); }, 180);
  });
  pingBtn.addEventListener('mouseup', () => {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; openWheel(); }
  });
  pingBtn.addEventListener('mouseleave', () => {
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; }
  });
  // touch support
  pingBtn.addEventListener('touchstart', e => {
    e.preventDefault();
    holdTimer = setTimeout(() => { holdTimer = null; openWheel(); }, 180);
  }, {passive:false});
  pingBtn.addEventListener('touchend', e => {
    e.preventDefault();
    if (holdTimer) { clearTimeout(holdTimer); holdTimer = null; openWheel(); }
  });

  // Close wheel on outside click
  document.addEventListener('click', e => {
    if (!wheelOpen) return;
    if (!pingWheel.contains(e.target) && e.target !== pingBtn) closeWheel();
  });

  // Slice selection
  slices.forEach(slice => {
    slice.addEventListener('click', () => {
      const label = slice.dataset.label;
      const color = slice.dataset.color;
      firePing(label, color);
      closeWheel();
    });
  });

  function firePing(label, color) {
    // Map marker at random tactical location
    const x = 15 + Math.random() * 70; // %
    const y = 15 + Math.random() * 70; // %
    const mk = document.createElement('div');
    mk.className = 'map-marker';
    mk.style.left = x + '%';
    mk.style.top = y + '%';
    mk.style.color = color;
    mk.style.background = color;
    mk.innerHTML = `<div class="marker-label">${escapeHtml(label)}</div>`;
    mapEl.appendChild(mk);

    // Fade out marker after 8s then remove
    setTimeout(() => {
      mk.style.transition = 'opacity 1.2s';
      mk.style.opacity = '0';
      setTimeout(() => mk.remove(), 1200);
    }, 8000);

    // Chat message
    addSystem(`Ping: ${label} at grid ${gridRef(x, y)}`);

    // Simulated squadmate ping response occasionally
    if (Math.random() > 0.55) {
      setTimeout(() => addMessage('Squadmate', `${randomAck()} — ${label}`), 600 + Math.random()*700);
    }
  }

  function gridRef(x, y) {
    const cols = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
    const gx = cols[Math.floor(x / (100/12))] || 'Z';
    const gy = Math.floor(y / (100/8)) + 1;
    return `${gx}${gy}`;
  }
  function randomAck() {
    const a = ["Roger", "Copy", "Acknowledged", "Wilco", "Heard"];
    return a[Math.floor(Math.random()*a.length)];
  }

  // Seed initial messages
  const seed = [
    ["Squadmate", "Moving to high ground."],
    ["You", "Enemy spotted east ridge."],
    ["Squadmate", "I need shields."],
    ["Squadmate", "Ring's close, 45s."],
    ["You", "Replicator dropping nearby."],
    ["Squadmate", "Careful, third party possible."],
    ["Squadmate", "Ultimate ready."],
    ["You", "Let's rotate left."],
  ];
  seed.forEach(([who, text]) => addMessage(who, text));
</script>
</body>
</html>
