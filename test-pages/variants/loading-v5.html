<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mission Briefing — Loading V5</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Black+Ops+One&display=swap');

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0a0a0a;
    color: #c8c4b8;
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  /* Paper texture overlay */
  body::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      url("data:image/svg+xml,%3Csvg viewBox='0 0 400 400' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.08'/%3E%3C/svg%3E"),
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(139, 125, 107, 0.03) 2px,
        rgba(139, 125, 107, 0.03) 4px
      );
    pointer-events: none;
    z-index: 1;
  }

  /* Vignette */
  body::after {
    content: '';
    position: absolute;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* HUD Header */
  .hud-header {
    position: relative;
    z-index: 10;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 32px;
    border-bottom: 1px solid rgba(139, 125, 107, 0.3);
    background: rgba(10, 10, 10, 0.8);
  }

  .hud-title {
    font-family: 'Black Ops One', cursive;
    font-size: 1.4rem;
    color: #8b7d6b;
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  .hud-version {
    font-size: 0.75rem;
    color: #6b5d4f;
    letter-spacing: 3px;
    border: 1px solid rgba(107, 93, 79, 0.4);
    padding: 4px 12px;
  }

  /* Main content */
  .briefing-container {
    flex: 1;
    display: flex;
    position: relative;
    z-index: 10;
    padding: 32px;
    gap: 40px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }

  /* Left: Soldier silhouette */
  .silhouette-panel {
    flex: 0 0 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 1px solid rgba(139, 125, 107, 0.25);
    background: rgba(10, 10, 10, 0.5);
    position: relative;
    overflow: hidden;
  }

  .silhouette-panel::before {
    content: 'CLASSIFIED';
    position: absolute;
    top: 12px;
    left: 12px;
    font-size: 0.6rem;
    color: rgba(139, 125, 107, 0.5);
    letter-spacing: 3px;
  }

  .silhouette-panel::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background:
      repeating-linear-gradient(
        90deg,
        transparent,
        transparent 1px,
        rgba(139, 125, 107, 0.05) 1px,
        rgba(139, 125, 107, 0.05) 2px
      );
    pointer-events: none;
  }

  .soldier-svg {
    width: 220px;
    height: 380px;
    opacity: 0.7;
    filter: drop-shadow(0 0 20px rgba(139, 125, 107, 0.2));
  }

  .soldier-label {
    margin-top: 16px;
    font-size: 0.65rem;
    color: rgba(139, 125, 107, 0.5);
    letter-spacing: 4px;
    text-transform: uppercase;
  }

  /* Right: Mission details */
  .details-panel {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 24px;
    border: 1px solid rgba(139, 125, 107, 0.25);
    background: rgba(10, 10, 10, 0.5);
    position: relative;
  }

  .details-panel::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background:
      repeating-linear-gradient(
        0deg,
        transparent,
        transparent 1px,
        rgba(139, 125, 107, 0.04) 1px,
        rgba(139, 125, 107, 0.04) 2px
      );
    pointer-events: none;
  }

  .panel-header {
    font-family: 'Black Ops One', cursive;
    font-size: 1.1rem;
    color: #8b7d6b;
    letter-spacing: 3px;
    margin-bottom: 28px;
    padding-bottom: 12px;
    border-bottom: 1px solid rgba(139, 125, 107, 0.3);
    text-transform: uppercase;
  }

  .field {
    margin-bottom: 20px;
    position: relative;
  }

  .field-label {
    font-size: 0.65rem;
    color: rgba(139, 125, 107, 0.6);
    letter-spacing: 3px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .field-value {
    font-size: 1.1rem;
    color: #c8c4b8;
    letter-spacing: 1px;
    min-height: 1.4em;
    position: relative;
  }

  .field-value.typing::after {
    content: '_';
    animation: blink 0.5s step-end infinite;
    color: #8b7d6b;
  }

  @keyframes blink {
    50% { opacity: 0; }
  }

  .field-value.completed {
    color: #a09888;
  }

  /* Stamp effect for completed fields */
  .stamp {
    position: absolute;
    right: 0;
    top: 50%;
    transform: translateY(-50%) rotate(-12deg);
    font-size: 0.55rem;
    color: rgba(139, 125, 107, 0.3);
    border: 1px solid rgba(139, 125, 107, 0.3);
    padding: 2px 8px;
    letter-spacing: 2px;
    text-transform: uppercase;
    opacity: 0;
    transition: opacity 0.3s ease;
  }

  .stamp.visible {
    opacity: 1;
  }

  /* Progress bar at bottom */
  .progress-container {
    position: relative;
    z-index: 10;
    padding: 20px 32px 32px;
    max-width: 1200px;
    margin: 0 auto;
    width: 100%;
  }

  .progress-label {
    font-size: 0.75rem;
    color: #8b7d6b;
    letter-spacing: 3px;
    margin-bottom: 8px;
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-bar-bg {
    width: 100%;
    height: 8px;
    background: rgba(139, 125, 107, 0.15);
    border: 1px solid rgba(139, 125, 107, 0.2);
    position: relative;
    overflow: hidden;
  }

  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: #8b7d6b;
    transition: width 0.3s ease;
    position: relative;
  }

  .progress-bar-fill::after {
    content: '';
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    width: 20px;
    background: linear-gradient(90deg, transparent, rgba(200, 196, 184, 0.4));
  }

  .progress-percent {
    font-size: 0.75rem;
    color: #8b7d6b;
    letter-spacing: 2px;
    margin-top: 6px;
    text-align: right;
  }

  /* Decorative corner brackets */
  .corner-bracket {
    position: absolute;
    width: 16px;
    height: 16px;
    border-color: rgba(139, 125, 107, 0.4);
    border-style: solid;
    z-index: 5;
  }

  .corner-bracket.tl { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
  .corner-bracket.tr { top: -1px; right: -1px; border-width: 2px 2px 0 0; }
  .corner-bracket.bl { bottom: -1px; left: -1px; border-width: 0 0 2px 2px; }
  .corner-bracket.br { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }

  /* Scanline effect */
  .scanline {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    height: 2px;
    background: rgba(139, 125, 107, 0.08);
    animation: scanline 6s linear infinite;
    pointer-events: none;
    z-index: 20;
  }

  @keyframes scanline {
    0% { top: -2px; }
    100% { top: 100vh; }
  }

  /* Responsive */
  @media (max-width: 768px) {
    .briefing-container {
      flex-direction: column;
      padding: 16px;
      gap: 20px;
    }
    .silhouette-panel {
      flex: none;
      height: 200px;
    }
    .soldier-svg {
      width: 140px;
      height: 240px;
    }
  }
</style>
</head>
<body>

<div class="scanline"></div>

<!-- HUD Header -->
<div class="hud-header">
  <div class="hud-title">Mission Briefing</div>
  <div class="hud-version">LOADING V5</div>
</div>

<!-- Main Briefing -->
<div class="briefing-container">
  <!-- Left: Soldier Silhouette -->
  <div class="silhouette-panel">
    <div class="corner-bracket tl"></div>
    <div class="corner-bracket tr"></div>
    <div class="corner-bracket bl"></div>
    <div class="corner-bracket br"></div>

    <svg class="soldier-svg" viewBox="0 0 200 350" xmlns="http://www.w3.org/2000/svg">
      <!-- Helmet -->
      <ellipse cx="100" cy="55" rx="38" ry="32" fill="#3a3530"/>
      <rect x="62" y="50" width="76" height="8" rx="2" fill="#2a2520"/>
      <!-- Helmet strap -->
      <path d="M72 78 Q100 95 128 78" stroke="#2a2520" stroke-width="3" fill="none"/>
      <!-- Face silhouette -->
      <path d="M72 55 L72 78 Q72 95 85 105 L100 115 L115 105 Q128 95 128 78 L128 55 Z" fill="#3a3530"/>
      <!-- NVG mount -->
      <rect x="90" y="42" width="20" height="10" rx="2" fill="#2a2520"/>
      <!-- Body / Plate carrier -->
      <path d="M55 120 L145 120 L155 180 L150 240 L140 280 L130 320 L120 350 L80 350 L70 320 L60 280 L50 240 L45 180 Z" fill="#3a3530"/>
      <!-- Shoulders -->
      <ellipse cx="45" cy="130" rx="18" ry="22" fill="#3a3530"/>
      <ellipse cx="155" cy="130" rx="18" ry="22" fill="#3a3530"/>
      <!-- Arms -->
      <path d="M35 145 L25 200 L30 250" stroke="#3a3530" stroke-width="14" fill="none" stroke-linecap="round"/>
      <path d="M165 145 L175 200 L170 250" stroke="#3a3530" stroke-width="14" fill="none" stroke-linecap="round"/>
      <!-- Magazine pouches -->
      <rect x="75" y="160" width="16" height="28" rx="2" fill="#2a2520"/>
      <rect x="95" y="160" width="16" height="28" rx="2" fill="#2a2520"/>
      <rect x="115" y="160" width="16" height="28" rx="2" fill="#2a2520"/>
      <!-- Radio pouch -->
      <rect x="130" y="150" width="14" height="22" rx="2" fill="#2a2520"/>
      <!-- Belt -->
      <rect x="60" y="230" width="80" height="8" rx="2" fill="#2a2520"/>
      <!-- Thigh rig -->
      <rect x="120" y="245" width="18" height="35" rx="3" fill="#2a2520"/>
      <!-- Knees -->
      <ellipse cx="75" cy="300" rx="12" ry="10" fill="#2a2520"/>
      <ellipse cx="125" cy="300" rx="12" ry="10" fill="#2a2520"/>
      <!-- Boots -->
      <path d="M65 320 L55 350 L85 350 L80 320 Z" fill="#2a2520"/>
      <path d="M135 320 L145 350 L115 350 L120 320 Z" fill="#2a2520"/>
      <!-- Weapon silhouette (held in front) -->
      <rect x="88" y="200" width="24" height="90" rx="3" fill="#2a2520"/>
      <rect x="82" y="195" width="36" height="8" rx="2" fill="#1a1510"/>
      <!-- Weapon details -->
      <rect x="94" y="190" width="12" height="8" rx="1" fill="#1a1510"/>
      <rect x="92" y="250" width="16" height="4" rx="1" fill="#1a1510"/>
      <rect x="92" y="270" width="16" height="4" rx="1" fill="#1a1510"/>
    </svg>

    <div class="soldier-label">Operative Profile</div>
  </div>

  <!-- Right: Mission Details -->
  <div class="details-panel">
    <div class="corner-bracket tl"></div>
    <div class="corner-bracket tr"></div>
    <div class="corner-bracket bl"></div>
    <div class="corner-bracket br"></div>

    <div class="panel-header">Operation Parameters</div>

    <div class="field">
      <div class="field-label">OP NAME</div>
      <div class="field-value" id="field-op" data-text="SILENT SPECTER"></div>
      <div class="stamp" id="stamp-op">VERIFIED</div>
    </div>

    <div class="field">
      <div class="field-label">LOCATION</div>
      <div class="field-value" id="field-loc" data-text="SECTOR 7-G, NORTHERN PERIMETER"></div>
      <div class="stamp" id="stamp-loc">CONFIRMED</div>
    </div>

    <div class="field">
      <div class="field-label">THREAT LEVEL</div>
      <div class="field-value" id="field-threat" data-text="CRITICAL — HOSTILE FORCES DETECTED"></div>
      <div class="stamp" id="stamp-threat">ELEVATED</div>
    </div>

    <div class="field">
      <div class="field-label">OBJECTIVE</div>
      <div class="field-value" id="field-obj" data-text="INFILTRATE, SECURE ASSETS, EXFIL"></div>
      <div class="stamp" id="stamp-obj">PRIORITY</div>
    </div>

    <div class="field">
      <div class="field-label">TIMELINE</div>
      <div class="field-value" id="field-time" data-text="0400 HRS — ZERO DARK THIRTY"></div>
      <div class="stamp" id="stamp-time">SYNCED</div>
    </div>
  </div>
</div>

<!-- Progress Bar -->
<div class="progress-container">
  <div class="progress-label">
    <span>MISSION LOAD</span>
  </div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="progress-fill"></div>
  </div>
  <div class="progress-percent" id="progress-text">0%</div>
</div>

<script>
(function() {
  const fields = [
    { id: 'field-op',    stamp: 'stamp-op',    delay: 300 },
    { id: 'field-loc',   stamp: 'stamp-loc',   delay: 1800 },
    { id: 'field-threat',stamp: 'stamp-threat',delay: 3800 },
    { id: 'field-obj',   stamp: 'stamp-obj',   delay: 5800 },
    { id: 'field-time',  stamp: 'stamp-time',  delay: 7800 },
  ];

  const progressFill = document.getElementById('progress-fill');
  const progressText = document.getElementById('progress-text');

  let currentProgress = 0;
  const targetProgress = 60;

  function typeField(fieldEl, stampEl, text, speed = 45) {
    fieldEl.classList.add('typing');
    let i = 0;
    function type() {
      if (i < text.length) {
        fieldEl.textContent += text.charAt(i);
        i++;
        setTimeout(type, speed + Math.random() * 30);
      } else {
        fieldEl.classList.remove('typing');
        fieldEl.classList.add('completed');
        if (stampEl) stampEl.classList.add('visible');
      }
    }
    type();
  }

  // Start typing each field with staggered delays
  fields.forEach(f => {
    const el = document.getElementById(f.id);
    const stamp = document.getElementById(f.stamp);
    const text = el.dataset.text;
    setTimeout(() => {
      typeField(el, stamp, text);
    }, f.delay);
  });

  // Progress bar animation
  function updateProgress() {
    if (currentProgress < targetProgress) {
      currentProgress++;
      progressFill.style.width = currentProgress + '%';
      progressText.textContent = currentProgress + '%';
      // Slow down as we approach target
      const delay = currentProgress > 50 ? 120 : 80;
      setTimeout(updateProgress, delay);
    }
  }

  // Start progress after a brief delay
  setTimeout(updateProgress, 500);

  // Subtle soldier silhouette pulse
  const soldierSvg = document.querySelector('.soldier-svg');
  setInterval(() => {
    soldierSvg.style.opacity = 0.65 + Math.random() * 0.15;
  }, 2000);
})();
</script>

</body>
</html>
