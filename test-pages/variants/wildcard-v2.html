<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WILDCARD V2 — PIXEL</title>
<style>
  @font-face {
    font-family: 'PixelFont';
    src: local('Courier New'), local('Courier'), monospace;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    background: #0f0f0f;
    color: #eee;
    font-family: 'Courier New', Courier, monospace;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* CRT overlay */
  .crt-overlay {
    position: fixed;
    top: 0; left: 0;
    width: 100vw;
    height: 100vh;
    pointer-events: none;
    z-index: 9999;
    background:
      radial-gradient(ellipse at center, transparent 60%, rgba(0,0,0,0.4) 100%),
      repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 2px, transparent 2px, transparent 4px);
    box-shadow: inset 0 0 80px rgba(0,0,0,0.6);
  }

  .page-container {
    max-width: 960px;
    margin: 0 auto;
    padding: 20px;
    position: relative;
    z-index: 1;
  }

  h1 {
    text-align: center;
    font-size: 28px;
    color: #ffcc00;
    text-shadow: 4px 4px 0px #aa4400;
    margin-bottom: 24px;
    letter-spacing: 2px;
  }

  .hud-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    background: #004400;
    border: 4px solid #00aa00;
    padding: 8px 16px;
    margin-bottom: 20px;
    font-size: 14px;
    color: #00ff00;
    text-shadow: 2px 2px 0 #004400;
  }

  .section {
    background: #111;
    border: 4px solid #555;
    margin-bottom: 24px;
    padding: 12px;
    position: relative;
  }

  .section-title {
    background: #222;
    color: #00ffff;
    font-size: 16px;
    padding: 6px 12px;
    margin: -12px -12px 12px -12px;
    border-bottom: 4px solid #555;
    text-shadow: 2px 2px 0 #004444;
  }

  canvas {
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    display: block;
    margin: 0 auto;
    background: #000;
    border: 4px solid #333;
  }

  #radarCanvas {
    width: 320px;
    height: 320px;
  }

  #loadingCanvas {
    width: 320px;
    height: 120px;
  }

  #chatCanvas {
    width: 320px;
    height: 240px;
  }

  .chat-input-row {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }

  .chat-input-row input {
    flex: 1;
    background: #000;
    border: 4px solid #555;
    color: #0f0;
    font-family: 'Courier New', Courier, monospace;
    font-size: 14px;
    padding: 6px 10px;
    outline: none;
    image-rendering: pixelated;
  }

  .chat-input-row button {
    background: #004400;
    border: 4px solid #00aa00;
    color: #0f0;
    font-family: 'Courier New', Courier, monospace;
    font-size: 14px;
    padding: 6px 16px;
    cursor: pointer;
    text-shadow: 2px 2px 0 #002200;
  }

  .chat-input-row button:hover {
    background: #006600;
  }

  .pixel-info {
    text-align: center;
    font-size: 12px;
    color: #888;
    margin-top: 8px;
  }
</style>
</head>
<body>
<div class="crt-overlay"></div>

<div class="page-container">
  <h1>WILDCARD V2 — PIXEL</h1>

  <div class="hud-bar">
    <span>HP: 100/100</span>
    <span>SCORE: 004200</span>
    <span>LVL: 05</span>
  </div>

  <!-- RADAR -->
  <div class="section">
    <div class="section-title">◄ RADAR ►</div>
    <canvas id="radarCanvas" width="160" height="160"></canvas>
    <div class="pixel-info">PIXEL GRID 16x16 // SPRITES 8-BIT</div>
  </div>

  <!-- LOADING -->
  <div class="section">
    <div class="section-title">◄ LOADING ►</div>
    <canvas id="loadingCanvas" width="160" height="60"></canvas>
    <div class="pixel-info">CASSETTE LOAD // 8-BIT STORAGE</div>
  </div>

  <!-- CHAT -->
  <div class="section">
    <div class="section-title">◄ CHAT ►</div>
    <canvas id="chatCanvas" width="160" height="120"></canvas>
    <div class="chat-input-row">
      <input type="text" id="chatInput" placeholder="TYPE MESSAGE..." maxlength="24">
      <button id="chatSend">SEND</button>
    </div>
    <div class="pixel-info">BLOCKY FONT // 8-COLOR PALETTE</div>
  </div>
</div>

<script>
/* =========================================================
   NES-ERA PALETTE (8 colors)
   ========================================================= */
const PAL = {
  blk: '#0f0f0f',
  wht: '#eeeeee',
  red: '#dd2222',
  grn: '#22cc22',
  blu: '#2266dd',
  yel: '#ffcc00',
  cyn: '#00dddd',
  mag: '#cc44cc',
  dgr: '#004400',
  gry: '#555555',
  dgy: '#333333'
};

/* =========================================================
   PIXEL FONT (3x5 + spacing)
   ========================================================= */
const FONT = {
  'A':[0b010,0b101,0b111,0b101,0b101],
  'B':[0b110,0b101,0b110,0b101,0b110],
  'C':[0b011,0b100,0b100,0b100,0b011],
  'D':[0b110,0b101,0b101,0b101,0b110],
  'E':[0b111,0b100,0b111,0b100,0b111],
  'F':[0b111,0b100,0b110,0b100,0b100],
  'G':[0b011,0b100,0b101,0b101,0b011],
  'H':[0b101,0b101,0b111,0b101,0b101],
  'I':[0b111,0b010,0b010,0b010,0b111],
  'J':[0b001,0b001,0b001,0b101,0b010],
  'K':[0b101,0b101,0b110,0b101,0b101],
  'L':[0b100,0b100,0b100,0b100,0b111],
  'M':[0b101,0b111,0b101,0b101,0b101],
  'N':[0b111,0b101,0b101,0b101,0b101],
  'O':[0b010,0b101,0b101,0b101,0b010],
  'P':[0b110,0b101,0b110,0b100,0b100],
  'Q':[0b010,0b101,0b101,0b011,0b001],
  'R':[0b110,0b101,0b110,0b101,0b101],
  'S':[0b011,0b100,0b010,0b001,0b110],
  'T':[0b111,0b010,0b010,0b010,0b010],
  'U':[0b101,0b101,0b101,0b101,0b011],
  'V':[0b101,0b101,0b101,0b101,0b010],
  'W':[0b101,0b101,0b101,0b111,0b101],
  'X':[0b101,0b101,0b010,0b101,0b101],
  'Y':[0b101,0b101,0b010,0b010,0b010],
  'Z':[0b111,0b001,0b010,0b100,0b111],
  '0':[0b010,0b101,0b101,0b101,0b010],
  '1':[0b010,0b110,0b010,0b010,0b111],
  '2':[0b110,0b001,0b010,0b100,0b111],
  '3':[0b110,0b001,0b010,0b001,0b110],
  '4':[0b101,0b101,0b111,0b001,0b001],
  '5':[0b111,0b100,0b110,0b001,0b110],
  '6':[0b011,0b100,0b110,0b101,0b011],
  '7':[0b111,0b001,0b010,0b010,0b010],
  '8':[0b010,0b101,0b010,0b101,0b010],
  '9':[0b010,0b101,0b011,0b001,0b110],
  ' ':[0,0,0,0,0],
  '-':[0,0,0b111,0,0],
  '—':[0,0,0b111,0,0],
  '►':[0b100,0b110,0b111,0b110,0b100],
  '◄':[0b001,0b011,0b111,0b011,0b001],
  ':':[0,0b010,0,0b010,0],
  '.':[0,0,0,0,0b010],
  '!':[0b010,0b010,0b010,0,0b010],
  '?':[0b010,0b101,0b010,0,0b010],
  '/':[0b001,0b001,0b010,0b100,0b100],
};

function drawPixelText(ctx, text, x, y, color, scale = 1) {
  ctx.fillStyle = color;
  let cx = x;
  for (let ch of text.toUpperCase()) {
    const pat = FONT[ch] || FONT['?'];
    for (let row = 0; row < 5; row++) {
      const bits = pat[row];
      for (let col = 0; col < 3; col++) {
        if (bits & (1 << (2 - col))) {
          ctx.fillRect(cx + col * scale, y + row * scale, scale, scale);
        }
      }
    }
    cx += 4 * scale;
  }
  return cx;
}

/* =========================================================
   RADAR
   ========================================================= */
const radarC = document.getElementById('radarCanvas');
const radarCtx = radarC.getContext('2d');

const GRID_W = 10;
const GRID_H = 10;
const CELL = 16;

// Pixel sprites (8x8) for soldiers
const SPR_GREEN = [
  0b00011000,
  0b00011000,
  0b00111100,
  0b00100100,
  0b01111110,
  0b00100100,
  0b00100100,
  0b00100100
];
const SPR_RED = [
  0b00011000,
  0b00111100,
  0b00011000,
  0b01111110,
  0b00011000,
  0b00100100,
  0b01000010,
  0b00000000
];
const SPR_BLUE = [
  0b00111100,
  0b01111110,
  0b00111100,
  0b00011000,
  0b00011000,
  0b00100100,
  0b00100100,
  0b00000000
];

function drawSprite(ctx, spr, x, y, color, scale = 1) {
  ctx.fillStyle = color;
  for (let row = 0; row < 8; row++) {
    const bits = spr[row];
    for (let col = 0; col < 8; col++) {
      if (bits & (1 << (7 - col))) {
        ctx.fillRect(x + col * scale, y + row * scale, scale, scale);
      }
    }
  }
}

// Background battlefield: trees and buildings
const bgMap = [];
for (let y = 0; y < GRID_H; y++) {
  const row = [];
  for (let x = 0; x < GRID_W; x++) {
    const r = Math.random();
    if (r < 0.08) row.push('tree');
    else if (r < 0.14) row.push('building');
    else row.push('empty');
  }
  bgMap.push(row);
}

// Units
const units = [];
for (let i = 0; i < 6; i++) {
  let ux, uy;
  do {
    ux = Math.floor(Math.random() * GRID_W);
    uy = Math.floor(Math.random() * GRID_H);
  } while (bgMap[uy][ux] !== 'empty');
  units.push({
    x: ux, y: uy,
    color: i < 2 ? PAL.red : (i < 4 ? PAL.blu : PAL.grn),
    sprite: i < 2 ? SPR_RED : (i < 4 ? SPR_BLUE : SPR_GREEN),
    dx: (Math.random() < 0.5 ? -1 : 1),
    dy: (Math.random() < 0.5 ? -1 : 1),
    moveTimer: Math.random() * 60
  });
}

function drawRadar() {
  // Clear
  radarCtx.fillStyle = PAL.blk;
  radarCtx.fillRect(0, 0, radarC.width, radarC.height);

  // Background battlefield
  for (let y = 0; y < GRID_H; y++) {
    for (let x = 0; x < GRID_W; x++) {
      const px = x * CELL;
      const py = y * CELL;
      if (bgMap[y][x] === 'tree') {
        radarCtx.fillStyle = PAL.dgr;
        radarCtx.fillRect(px + 4, py + 2, 8, 12);
        radarCtx.fillStyle = PAL.grn;
        radarCtx.fillRect(px + 2, py + 4, 12, 8);
        radarCtx.fillRect(px + 4, py, 8, 4);
      } else if (bgMap[y][x] === 'building') {
        radarCtx.fillStyle = PAL.gry;
        radarCtx.fillRect(px + 2, py + 4, 12, 12);
        radarCtx.fillStyle = PAL.dgy;
        radarCtx.fillRect(px + 4, py + 6, 3, 3);
        radarCtx.fillRect(px + 9, py + 6, 3, 3);
        radarCtx.fillRect(px + 4, py + 11, 3, 3);
        radarCtx.fillRect(px + 9, py + 11, 3, 3);
      } else {
        // Grass pattern
        radarCtx.fillStyle = ((x + y) % 2 === 0) ? '#0a1a0a' : '#081808';
        radarCtx.fillRect(px, py, CELL, CELL);
      }
    }
  }

  // Grid lines
  radarCtx.strokeStyle = '#1a331a';
  radarCtx.lineWidth = 1;
  for (let i = 0; i <= GRID_W; i++) {
    radarCtx.beginPath();
    radarCtx.moveTo(i * CELL, 0);
    radarCtx.lineTo(i * CELL, GRID_H * CELL);
    radarCtx.stroke();
  }
  for (let i = 0; i <= GRID_H; i++) {
    radarCtx.beginPath();
    radarCtx.moveTo(0, i * CELL);
    radarCtx.lineTo(GRID_W * CELL, i * CELL);
    radarCtx.stroke();
  }

  // Units
  for (let u of units) {
    drawSprite(radarCtx, u.sprite, u.x * CELL + 4, u.y * CELL + 4, u.color, 1);
  }

  // Radar sweep line
  const sweepAngle = (Date.now() / 800) % (Math.PI * 2);
  const cx = radarC.width / 2;
  const cy = radarC.height / 2;
  const maxR = Math.sqrt(cx * cx + cy * cy);
  const sx = cx + Math.cos(sweepAngle) * maxR;
  const sy = cy + Math.sin(sweepAngle) * maxR;
  radarCtx.strokeStyle = 'rgba(0,255,0,0.3)';
  radarCtx.lineWidth = 2;
  radarCtx.beginPath();
  radarCtx.moveTo(cx, cy);
  radarCtx.lineTo(sx, sy);
  radarCtx.stroke();
}

function updateRadar() {
  for (let u of units) {
    u.moveTimer++;
    if (u.moveTimer > 40) {
      u.moveTimer = 0;
      if (Math.random() < 0.4) {
        const nx = u.x + u.dx;
        const ny = u.y + u.dy;
        if (nx >= 0 && nx < GRID_W && ny >= 0 && ny < GRID_H && bgMap[ny][nx] === 'empty') {
          u.x = nx; u.y = ny;
        } else {
          u.dx *= -1; u.dy *= -1;
        }
      }
    }
  }
}

/* =========================================================
   LOADING (Pixel Art Cassette)
   ========================================================= */
const loadC = document.getElementById('loadingCanvas');
const loadCtx = loadC.getContext('2d');
let loadProgress = 0;

function drawLoading() {
  loadCtx.fillStyle = PAL.blk;
  loadCtx.fillRect(0, 0, loadC.width, loadC.height);

  // Cassette body
  const cx = 80, cy = 30;
  loadCtx.fillStyle = PAL.yel;
  loadCtx.fillRect(cx - 44, cy - 18, 88, 36);
  loadCtx.fillStyle = PAL.blk;
  loadCtx.fillRect(cx - 40, cy - 14, 80, 28);
  loadCtx.fillStyle = PAL.yel;
  loadCtx.fillRect(cx - 36, cy - 10, 72, 20);

  // Reels
  const reel1 = cx - 20 + Math.sin(Date.now() / 150) * 3;
  const reel2 = cx + 20 + Math.cos(Date.now() / 150) * 3;
  loadCtx.fillStyle = PAL.wht;
  loadCtx.fillRect(reel1 - 4, cy - 4, 8, 8);
  loadCtx.fillRect(reel2 - 4, cy - 4, 8, 8);
  loadCtx.fillStyle = PAL.blk;
  loadCtx.fillRect(reel1 - 2, cy - 2, 4, 4);
  loadCtx.fillRect(reel2 - 2, cy - 2, 4, 4);

  // Label
  drawPixelText(loadCtx, 'LOAD', cx - 16, cy - 6, PAL.blk, 1);

  // Progress bar background
  loadCtx.fillStyle = PAL.dgy;
  loadCtx.fillRect(20, 52, 120, 8);
  // Progress fill
  loadCtx.fillStyle = PAL.grn;
  loadCtx.fillRect(20, 52, Math.floor(120 * (loadProgress / 100)), 8);

  // Percent text
  drawPixelText(loadCtx, Math.floor(loadProgress) + '%', 68, 44, PAL.cyn, 1);

  loadProgress += 0.4;
  if (loadProgress > 100) loadProgress = 0;
}

/* =========================================================
   CHAT
   ========================================================= */
const chatC = document.getElementById('chatCanvas');
const chatCtx = chatC.getContext('2d');

const chatMessages = [
  { user: 'SOLDIER1', text: 'ENEMY SPOTTED!', color: PAL.red },
  { user: 'SOLDIER2', text: 'COPY THAT', color: PAL.blu },
  { user: 'COMMAND', text: 'HOLD POSITION', color: PAL.yel },
  { user: 'SOLDIER3', text: 'ROGER', color: PAL.grn },
];

let chatBlink = true;
setInterval(() => { chatBlink = !chatBlink; }, 500);

function drawChat() {
  chatCtx.fillStyle = PAL.blk;
  chatCtx.fillRect(0, 0, chatC.width, chatC.height);

  // Border inset
  chatCtx.strokeStyle = PAL.gry;
  chatCtx.lineWidth = 1;
  chatCtx.strokeRect(2, 2, chatC.width - 4, chatC.height - 4);

  let y = 6;
  for (let msg of chatMessages) {
    drawPixelText(chatCtx, msg.user + ':', 6, y, msg.color, 1);
    drawPixelText(chatCtx, msg.text, 6, y + 8, PAL.wht, 1);
    y += 22;
  }

  // Blinking cursor at bottom
  if (chatBlink) {
    chatCtx.fillStyle = PAL.grn;
    chatCtx.fillRect(6, y + 2, 4, 6);
  }
}

function addChatMessage(text) {
  const users = ['SOLDIER1', 'SOLDIER2', 'SOLDIER3', 'COMMAND'];
  const colors = [PAL.red, PAL.blu, PAL.grn, PAL.yel];
  const idx = Math.floor(Math.random() * users.length);
  chatMessages.push({ user: users[idx], text: text.toUpperCase().substring(0, 24), color: colors[idx] });
  if (chatMessages.length > 4) chatMessages.shift();
}

document.getElementById('chatSend').addEventListener('click', () => {
  const inp = document.getElementById('chatInput');
  if (inp.value.trim()) {
    addChatMessage(inp.value.trim());
    inp.value = '';
  }
});
document.getElementById('chatInput').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    const inp = document.getElementById('chatInput');
    if (inp.value.trim()) {
      addChatMessage(inp.value.trim());
      inp.value = '';
    }
  }
});

/* =========================================================
   MAIN LOOP
   ========================================================= */
function loop() {
  updateRadar();
  drawRadar();
  drawLoading();
  drawChat();
  requestAnimationFrame(loop);
}
loop();
</script>
</body>
</html>
