<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RADAR V5 — Tactical Tablet</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0f14;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }

  /* Ambient glow behind tablet */
  .tablet-glow {
    position: absolute;
    width: 420px;
    height: 620px;
    border-radius: 40px;
    background: radial-gradient(ellipse at center, rgba(0,255,128,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Tablet frame */
  .tablet {
    position: relative;
    width: 380px;
    height: 580px;
    background: linear-gradient(145deg, #2a2f35 0%, #1a1f24 50%, #111418 100%);
    border-radius: 32px;
    padding: 18px;
    box-shadow:
      /* Outer ambient glow */
      0 0 60px rgba(0,255,128,0.06),
      /* Bevel highlight top-left */
      inset 2px 2px 4px rgba(255,255,255,0.08),
      /* Bevel shadow bottom-right */
      inset -2px -2px 4px rgba(0,0,0,0.6),
      /* Outer drop shadow */
      0 20px 60px rgba(0,0,0,0.8),
      0 8px 24px rgba(0,0,0,0.6);
    z-index: 1;
  }

  /* Camera / sensor dot */
  .tablet::before {
    content: '';
    position: absolute;
    top: 8px;
    left: 50%;
    transform: translateX(-50%);
    width: 6px;
    height: 6px;
    background: #0a0f14;
    border-radius: 50%;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.8);
  }

  /* Screen bezel */
  .screen-bezel {
    width: 100%;
    height: 100%;
    background: #050a0e;
    border-radius: 20px;
    overflow: hidden;
    position: relative;
    box-shadow:
      inset 0 0 20px rgba(0,0,0,0.9),
      inset 0 0 4px rgba(0,255,128,0.1);
  }

  /* Screen content */
  .screen {
    width: 100%;
    height: 100%;
    position: relative;
    cursor: crosshair;
    overflow: hidden;
  }

  /* Tactical map canvas */
  #mapCanvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
  }

  /* HUD overlay */
  .hud {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 2;
  }

  .hud-title {
    position: absolute;
    top: 12px;
    left: 14px;
    color: #00ff80;
    font-size: 13px;
    font-weight: bold;
    letter-spacing: 3px;
    text-shadow: 0 0 8px rgba(0,255,128,0.5);
    opacity: 0.9;
  }

  .hud-coords {
    position: absolute;
    top: 12px;
    right: 14px;
    color: #00ff80;
    font-size: 10px;
    letter-spacing: 1px;
    opacity: 0.7;
    text-align: right;
  }

  .hud-scale {
    position: absolute;
    bottom: 12px;
    left: 14px;
    color: #00ff80;
    font-size: 9px;
    opacity: 0.5;
    letter-spacing: 1px;
  }

  .hud-status {
    position: absolute;
    bottom: 12px;
    right: 14px;
    color: #00ff80;
    font-size: 9px;
    opacity: 0.6;
    letter-spacing: 1px;
  }

  /* Corner brackets */
  .corner {
    position: absolute;
    width: 16px;
    height: 16px;
    border-color: rgba(0,255,128,0.4);
    border-style: solid;
    pointer-events: none;
  }
  .corner.tl { top: 6px; left: 6px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 6px; right: 6px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 6px; left: 6px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 6px; right: 6px; border-width: 0 2px 2px 0; }

  /* Scan line animation */
  .scanline {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 2px;
    background: linear-gradient(90deg, transparent, rgba(0,255,128,0.3), transparent);
    animation: scan 4s linear infinite;
    pointer-events: none;
    z-index: 3;
  }

  @keyframes scan {
    0% { top: 0; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { top: 100%; opacity: 0; }
  }

  /* Touch ripple */
  .ripple {
    position: absolute;
    border: 1px solid rgba(0,255,128,0.6);
    border-radius: 50%;
    pointer-events: none;
    animation: rippleExpand 0.8s ease-out forwards;
    z-index: 4;
  }

  @keyframes rippleExpand {
    0% { width: 0; height: 0; opacity: 1; }
    100% { width: 60px; height: 60px; opacity: 0; margin-left: -30px; margin-top: -30px; }
  }

  /* Touch marker */
  .touch-marker {
    position: absolute;
    width: 8px;
    height: 8px;
    background: rgba(0,255,128,0.8);
    border-radius: 50%;
    transform: translate(-50%, -50%);
    pointer-events: none;
    z-index: 4;
    box-shadow: 0 0 8px rgba(0,255,128,0.6);
    animation: markerPulse 1.5s ease-in-out infinite;
  }

  @keyframes markerPulse {
    0%, 100% { opacity: 0.6; transform: translate(-50%, -50%) scale(1); }
    50% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
  }

  /* Screen edge vignette */
  .vignette {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    box-shadow: inset 0 0 40px rgba(0,0,0,0.5);
    pointer-events: none;
    z-index: 5;
    border-radius: 20px;
  }

  /* Home button area */
  .tablet-home {
    position: absolute;
    bottom: 4px;
    left: 50%;
    transform: translateX(-50%);
    width: 36px;
    height: 4px;
    background: rgba(255,255,255,0.1);
    border-radius: 2px;
  }
</style>
</head>
<body>

<div class="tablet-glow"></div>

<div class="tablet">
  <div class="screen-bezel">
    <div class="screen" id="screen">
      <canvas id="mapCanvas"></canvas>
      <div class="hud">
        <div class="hud-title">RADAR V5</div>
        <div class="hud-coords" id="hudCoords">GRID: -- --</div>
        <div class="hud-scale">SCALE 1:50K</div>
        <div class="hud-status" id="hudStatus">SCANNING...</div>
        <div class="corner tl"></div>
        <div class="corner tr"></div>
        <div class="corner bl"></div>
        <div class="corner br"></div>
      </div>
      <div class="scanline"></div>
      <div class="vignette"></div>
    </div>
  </div>
  <div class="tablet-home"></div>
</div>

<script>
(function() {
  const canvas = document.getElementById('mapCanvas');
  const ctx = canvas.getContext('2d');
  const screen = document.getElementById('screen');
  const hudCoords = document.getElementById('hudCoords');
  const hudStatus = document.getElementById('hudStatus');

  let width, height;
  let offsetX = 0, offsetY = 0;
  let isDragging = false;
  let lastX, lastY;
  let markers = [];
  let blips = [];
  let scanAngle = 0;

  // Generate random radar blips
  function initBlips() {
    blips = [];
    for (let i = 0; i < 6; i++) {
      blips.push({
        x: Math.random() * 2000 - 1000,
        y: Math.random() * 2000 - 1000,
        type: Math.random() > 0.5 ? 'friendly' : 'unknown',
        size: 3 + Math.random() * 4,
        pulse: Math.random() * Math.PI * 2
      });
    }
  }
  initBlips();

  function resize() {
    const rect = screen.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    canvas.width = width * window.devicePixelRatio;
    canvas.height = height * window.devicePixelRatio;
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }
  resize();
  window.addEventListener('resize', resize);

  // Military grid letters
  const gridLetters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';

  function gridRef(gx, gy) {
    const col = gridLetters[Math.abs(gx) % 26];
    const row = String(Math.abs(gy) % 99).padStart(2, '0');
    return col + row;
  }

  function drawMap() {
    ctx.clearRect(0, 0, width, height);

    const gridSize = 60;
    const startCol = Math.floor((-offsetX) / gridSize);
    const startRow = Math.floor((-offsetY) / gridSize);

    // Background
    ctx.fillStyle = '#050a0e';
    ctx.fillRect(0, 0, width, height);

    // Grid lines
    ctx.strokeStyle = 'rgba(0, 255, 128, 0.12)';
    ctx.lineWidth = 0.5;

    for (let c = startCol - 1; c * gridSize + offsetX < width + gridSize; c++) {
      const x = c * gridSize + offsetX;
      ctx.beginPath();
      ctx.moveTo(x, 0);
      ctx.lineTo(x, height);
      ctx.stroke();
    }

    for (let r = startRow - 1; r * gridSize + offsetY < height + gridSize; r++) {
      const y = r * gridSize + offsetY;
      ctx.beginPath();
      ctx.moveTo(0, y);
      ctx.lineTo(width, y);
      ctx.stroke();
    }

    // Grid labels
    ctx.fillStyle = 'rgba(0, 255, 128, 0.35)';
    ctx.font = '9px Courier New';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';

    for (let c = startCol - 1; c * gridSize + offsetX < width + gridSize; c++) {
      for (let r = startRow - 1; r * gridSize + offsetY < height + gridSize; r++) {
        const x = c * gridSize + offsetX + gridSize / 2;
        const y = r * gridSize + offsetY + gridSize / 2;
        if (x > 30 && x < width - 30 && y > 30 && y < height - 30) {
          ctx.fillText(gridRef(c, r), x, y);
        }
      }
    }

    // Terrain features (simple polygons)
    ctx.fillStyle = 'rgba(0, 255, 128, 0.04)';
    ctx.strokeStyle = 'rgba(0, 255, 128, 0.1)';
    ctx.lineWidth = 0.5;

    const terrainSeed = 12345;
    function pseudoRandom(x, y) {
      return Math.abs(Math.sin(x * 12.9898 + y * 78.233 + terrainSeed) * 43758.5453) % 1;
    }

    for (let i = 0; i < 30; i++) {
      const tx = (pseudoRandom(i, 0) * 3000 - 1500) + offsetX;
      const ty = (pseudoRandom(i, 1) * 3000 - 1500) + offsetY;
      if (tx < -100 || tx > width + 100 || ty < -100 || ty > height + 100) continue;

      ctx.beginPath();
      const sides = 3 + Math.floor(pseudoRandom(i, 2) * 4);
      const radius = 20 + pseudoRandom(i, 3) * 60;
      for (let s = 0; s < sides; s++) {
        const angle = (s / sides) * Math.PI * 2 + pseudoRandom(i, 4);
        const px = tx + Math.cos(angle) * radius;
        const py = ty + Math.sin(angle) * radius;
        if (s === 0) ctx.moveTo(px, py);
        else ctx.lineTo(px, py);
      }
      ctx.closePath();
      ctx.fill();
      ctx.stroke();
    }

    // Radar blips
    const time = Date.now() / 1000;
    blips.forEach((blip, i) => {
      const bx = blip.x + offsetX;
      const by = blip.y + offsetY;
      if (bx < 0 || bx > width || by < 0 || by > height) return;

      const pulseScale = 1 + Math.sin(time * 2 + blip.pulse) * 0.3;
      const alpha = 0.4 + Math.sin(time * 2 + blip.pulse) * 0.3;

      // Blip glow
      const glow = ctx.createRadialGradient(bx, by, 0, bx, by, blip.size * 4 * pulseScale);
      const color = blip.type === 'friendly' ? '0, 255, 128' : '255, 200, 0';
      glow.addColorStop(0, `rgba(${color}, ${alpha})`);
      glow.addColorStop(1, `rgba(${color}, 0)`);
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(bx, by, blip.size * 4 * pulseScale, 0, Math.PI * 2);
      ctx.fill();

      // Blip core
      ctx.fillStyle = `rgba(${color}, ${alpha + 0.3})`;
      ctx.beginPath();
      ctx.arc(bx, by, blip.size, 0, Math.PI * 2);
      ctx.fill();

      // Label
      ctx.fillStyle = `rgba(${color}, 0.6)`;
      ctx.font = '8px Courier New';
      ctx.textAlign = 'left';
      ctx.fillText(blip.type === 'friendly' ? 'FR' : 'UNK', bx + 8, by - 4);
    });

    // Sweep line
    const sweepX = width / 2 + Math.cos(scanAngle) * Math.max(width, height);
    const sweepY = height / 2 + Math.sin(scanAngle) * Math.max(width, height);

    const sweepGrad = ctx.createLinearGradient(
      width / 2, height / 2,
      sweepX, sweepY
    );
    sweepGrad.addColorStop(0, 'rgba(0, 255, 128, 0)');
    sweepGrad.addColorStop(0.7, 'rgba(0, 255, 128, 0.03)');
    sweepGrad.addColorStop(1, 'rgba(0, 255, 128, 0.15)');

    ctx.fillStyle = sweepGrad;
    ctx.beginPath();
    ctx.moveTo(width / 2, height / 2);
    ctx.arc(width / 2, height / 2, Math.max(width, height) * 1.5, scanAngle - 0.3, scanAngle);
    ctx.closePath();
    ctx.fill();

    // Center crosshair
    ctx.strokeStyle = 'rgba(0, 255, 128, 0.4)';
    ctx.lineWidth = 0.5;
    ctx.beginPath();
    ctx.moveTo(width / 2 - 10, height / 2);
    ctx.lineTo(width / 2 + 10, height / 2);
    ctx.moveTo(width / 2, height / 2 - 10);
    ctx.lineTo(width / 2, height / 2 + 10);
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(width / 2, height / 2, 6, 0, Math.PI * 2);
    ctx.stroke();

    // Range rings
    ctx.strokeStyle = 'rgba(0, 255, 128, 0.08)';
    ctx.lineWidth = 0.5;
    for (let r = 40; r < 200; r += 40) {
      ctx.beginPath();
      ctx.arc(width / 2, height / 2, r, 0, Math.PI * 2);
      ctx.stroke();
    }

    scanAngle += 0.008;
    requestAnimationFrame(drawMap);
  }

  drawMap();

  // Touch / drag to pan
  screen.addEventListener('pointerdown', (e) => {
    isDragging = true;
    lastX = e.clientX;
    lastY = e.clientY;
    screen.setPointerCapture(e.pointerId);

    // Create ripple
    const rect = screen.getBoundingClientRect();
    const rx = e.clientX - rect.left;
    const ry = e.clientY - rect.top;

    const ripple = document.createElement('div');
    ripple.className = 'ripple';
    ripple.style.left = rx + 'px';
    ripple.style.top = ry + 'px';
    screen.appendChild(ripple);
    setTimeout(() => ripple.remove(), 800);

    // Add touch marker
    const marker = document.createElement('div');
    marker.className = 'touch-marker';
    marker.style.left = rx + 'px';
    marker.style.top = ry + 'px';
    screen.appendChild(marker);
    markers.push(marker);

    // Limit markers
    if (markers.length > 5) {
      markers.shift().remove();
    }

    // Update HUD
    const gx = Math.floor((rx - offsetX) / 60);
    const gy = Math.floor((ry - offsetY) / 60);
    hudCoords.textContent = 'GRID: ' + gridRef(gx, gy);
    hudStatus.textContent = 'CONTACT MARKED';
    setTimeout(() => { hudStatus.textContent = 'SCANNING...'; }, 1500);
  });

  screen.addEventListener('pointermove', (e) => {
    if (!isDragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    offsetX += dx;
    offsetY += dy;
    lastX = e.clientX;
    lastY = e.clientY;
  });

  screen.addEventListener('pointerup', () => {
    isDragging = false;
  });

  // Update coords on hover
  screen.addEventListener('pointermove', (e) => {
    if (isDragging) return;
    const rect = screen.getBoundingClientRect();
    const rx = e.clientX - rect.left;
    const ry = e.clientY - rect.top;
    const gx = Math.floor((rx - offsetX) / 60);
    const gy = Math.floor((ry - offsetY) / 60);
    hudCoords.textContent = 'GRID: ' + gridRef(gx, gy);
  });

})();
</script>

</body>
</html>
