<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading V10 — Compass Rose</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Black+Ops+One&display=swap');

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050a05;
    color: #7ec96c;
    font-family: 'Share Tech Mono', monospace;
    height: 100vh;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    position: relative;
  }

  /* Tactical grid background */
  .grid-bg {
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(20, 60, 20, 0.25) 1px, transparent 1px),
      linear-gradient(90deg, rgba(20, 60, 20, 0.25) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Subtle radial gradient overlay */
  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 30%, rgba(5, 10, 5, 0.9) 100%);
    pointer-events: none;
    z-index: 1;
  }

  /* HUD */
  .hud {
    position: fixed;
    top: 18px;
    left: 24px;
    z-index: 20;
    font-family: 'Black Ops One', cursive;
    font-size: 0.9rem;
    letter-spacing: 4px;
    color: #5a8f4e;
    opacity: 0.8;
  }

  /* Compass container */
  .compass-wrap {
    position: relative;
    z-index: 10;
    width: 320px;
    height: 320px;
  }

  /* Outer ring — clock fill */
  .ring-track {
    fill: none;
    stroke: rgba(90, 143, 78, 0.15);
    stroke-width: 6;
  }
  .ring-fill {
    fill: none;
    stroke: #5a8f4e;
    stroke-width: 6;
    stroke-linecap: round;
    stroke-dasharray: 880;
    stroke-dashoffset: 880;
    transition: stroke-dashoffset 0.1s linear;
    filter: drop-shadow(0 0 4px #5a8f4e);
  }

  /* Tick marks */
  .tick {
    stroke: rgba(90, 143, 78, 0.3);
    stroke-width: 1.5;
  }
  .tick-major {
    stroke: rgba(90, 143, 78, 0.5);
    stroke-width: 2.5;
  }

  /* Cardinal direction labels */
  .cardinal {
    font-family: 'Black Ops One', cursive;
    font-size: 22px;
    fill: rgba(90, 143, 78, 0.25);
    text-anchor: middle;
    dominant-baseline: central;
    transition: fill 0.3s, filter 0.3s;
  }
  .cardinal.glow {
    fill: #7ec96c;
    filter: drop-shadow(0 0 6px #7ec96c);
  }

  /* Intercardinal labels */
  .inter {
    font-family: 'Share Tech Mono', monospace;
    font-size: 11px;
    fill: rgba(90, 143, 78, 0.2);
    text-anchor: middle;
    dominant-baseline: central;
  }

  /* Compass needle */
  .needle-group {
    transform-origin: 160px 160px;
    transition: transform 0.1s linear;
  }
  .needle-north {
    fill: #c94a4a;
    filter: drop-shadow(0 0 5px rgba(201, 74, 74, 0.6));
  }
  .needle-south {
    fill: #4a6bc9;
    filter: drop-shadow(0 0 5px rgba(74, 107, 201, 0.4));
  }
  .needle-cap {
    fill: #1a2a1a;
    stroke: #5a8f4e;
    stroke-width: 1.5;
  }

  /* Center hub ring */
  .hub-ring {
    fill: none;
    stroke: rgba(90, 143, 78, 0.3);
    stroke-width: 1;
  }

  /* Progress text below compass */
  .progress-area {
    position: relative;
    z-index: 10;
    margin-top: 32px;
    text-align: center;
  }

  .progress-pct {
    font-size: 1.6rem;
    letter-spacing: 6px;
    color: #7ec96c;
    text-shadow: 0 0 8px rgba(126, 201, 108, 0.4);
  }

  .progress-bar-bg {
    width: 260px;
    height: 3px;
    background: rgba(90, 143, 78, 0.15);
    margin: 10px auto 0;
    position: relative;
  }
  .progress-bar-fill {
    height: 100%;
    width: 0%;
    background: #5a8f4e;
    box-shadow: 0 0 8px #5a8f4e;
    transition: width 0.1s linear;
  }

  .tip-text {
    margin-top: 14px;
    font-size: 0.7rem;
    letter-spacing: 2px;
    color: rgba(126, 201, 108, 0.5);
    min-height: 1.4em;
  }

  /* Corner brackets */
  .corner {
    position: fixed;
    width: 24px;
    height: 24px;
    border-color: rgba(90, 143, 78, 0.35);
    border-style: solid;
    z-index: 20;
    pointer-events: none;
  }
  .corner.tl { top: 12px; left: 12px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 12px; right: 12px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 12px; left: 12px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 12px; right: 12px; border-width: 0 2px 2px 0; }

  /* Scanline */
  .scanline {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 1px;
    background: rgba(126, 201, 108, 0.06);
    animation: scan 5s linear infinite;
    z-index: 15;
    pointer-events: none;
  }
  @keyframes scan {
    0% { top: -1px; }
    100% { top: 100vh; }
  }

  /* Locked state */
  .locked .needle-group {
    transition: transform 0.6s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .locked .ring-fill {
    stroke: #7ec96c;
    filter: drop-shadow(0 0 8px #7ec96c);
  }
  .locked .cardinal-n {
    fill: #c94a4a;
    filter: drop-shadow(0 0 8px #c94a4a);
  }
</style>
</head>
<body>

<div class="grid-bg"></div>
<div class="scanline"></div>

<div class="hud">LOADING V10</div>

<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<div class="compass-wrap">
  <svg viewBox="0 0 320 320" width="320" height="320">
    <!-- Defs for glow -->
    <defs>
      <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur stdDeviation="3" result="blur"/>
        <feMerge>
          <feMergeNode in="blur"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>

    <!-- Outer ring track -->
    <circle class="ring-track" cx="160" cy="160" r="140"/>
    <!-- Outer ring fill (clockwise from top) -->
    <circle class="ring-fill" id="ringFill" cx="160" cy="160" r="140"
            transform="rotate(-90 160 160)"/>

    <!-- Tick marks -->
    <g id="ticks"></g>

    <!-- Cardinal directions -->
    <text class="cardinal cardinal-n" id="cardN" x="160" y="28">N</text>
    <text class="cardinal cardinal-e" id="cardE" x="292" y="165">E</text>
    <text class="cardinal cardinal-s" id="cardS" x="160" y="302">S</text>
    <text class="cardinal cardinal-w" id="cardW" x="28" y="165">W</text>

    <!-- Intercardinal -->
    <text class="inter" x="222" y="55">NE</text>
    <text class="inter" x="258" y="100">NE</text>
    <text class="inter" x="258" y="230">SE</text>
    <text class="inter" x="222" y="275">SE</text>
    <text class="inter" x="98" y="275">SW</text>
    <text class="inter" x="62" y="230">SW</text>
    <text class="inter" x="62" y="100">NW</text>
    <text class="inter" x="98" y="55">NW</text>

    <!-- Inner hub ring -->
    <circle class="hub-ring" cx="160" cy="160" r="18"/>
    <circle class="hub-ring" cx="160" cy="160" r="8"/>

    <!-- Needle -->
    <g class="needle-group" id="needle">
      <!-- North half (red) -->
      <polygon class="needle-north" points="160,50 154,160 160,165 166,160"/>
      <!-- South half (blue) -->
      <polygon class="needle-south" points="160,270 154,160 160,155 166,160"/>
      <!-- Center cap -->
      <circle class="needle-cap" cx="160" cy="160" r="6"/>
    </g>
  </svg>
</div>

<div class="progress-area">
  <div class="progress-pct" id="pctText">000%</div>
  <div class="progress-bar-bg">
    <div class="progress-bar-fill" id="barFill"></div>
  </div>
  <div class="tip-text" id="tipText">CALIBRATING GYROSCOPE</div>
</div>

<script>
(function() {
  // ─── Generate tick marks ───
  const tickGroup = document.getElementById('ticks');
  for (let i = 0; i < 72; i++) {
    const angle = (i * 5) * Math.PI / 180;
    const isMajor = i % 6 === 0; // every 30°
    const r1 = isMajor ? 122 : 128;
    const r2 = 140;
    const x1 = 160 + Math.cos(angle) * r1;
    const y1 = 160 + Math.sin(angle) * r1;
    const x2 = 160 + Math.cos(angle) * r2;
    const y2 = 160 + Math.sin(angle) * r2;
    const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
    line.setAttribute('x1', x1);
    line.setAttribute('y1', y1);
    line.setAttribute('x2', x2);
    line.setAttribute('y2', y2);
    line.setAttribute('class', isMajor ? 'tick-major' : 'tick');
    tickGroup.appendChild(line);
  }

  // ─── Elements ───
  const ringFill = document.getElementById('ringFill');
  const needle = document.getElementById('needle');
  const pctText = document.getElementById('pctText');
  const barFill = document.getElementById('barFill');
  const tipText = document.getElementById('tipText');
  const cardinals = {
    n: document.getElementById('cardN'),
    e: document.getElementById('cardE'),
    s: document.getElementById('cardS'),
    w: document.getElementById('cardW'),
  };

  // ─── Tips ───
  const tips = [
    'CALIBRATING GYROSCOPE',
    'SYNCHRONIZING SATELLITE LINK',
    'MAPPING TERRAIN GRID',
    'ACQUIRING MAGNETIC NORTH',
    'STABILIZING COMPASS BEARING',
    'VERIFYING WAYPOINT DATA',
    'LOCKING ORIENTATION VECTORS',
    'FINALIZING NAVIGATION FIX',
  ];

  // ─── State ───
  const DURATION = 6000; // ms
  const startTime = performance.now();
  let locked = false;

  // Ring circumference = 2 * PI * 140 ≈ 880
  const CIRCUMFERENCE = 2 * Math.PI * 140;
  ringFill.style.strokeDasharray = CIRCUMFERENCE;
  ringFill.style.strokeDashoffset = CIRCUMFERENCE;

  // ─── Animation loop ───
  function frame(now) {
    const elapsed = now - startTime;
    let progress = Math.min(elapsed / DURATION, 1);

    // Update ring (clock fill)
    const offset = CIRCUMFERENCE * (1 - progress);
    ringFill.style.strokeDashoffset = offset;

    // Update needle rotation
    if (!locked) {
      // Needle spins faster at start, slows as it approaches 100%
      const spinSpeed = 1 + (1 - progress) * 5; // revolutions per duration-ish
      const angle = (elapsed * 0.25 * spinSpeed) % 360;
      needle.style.transform = `rotate(${angle}deg)`;
    }

    // Update progress text
    const pct = Math.floor(progress * 100);
    pctText.textContent = String(pct).padStart(3, '0') + '%';
    barFill.style.width = pct + '%';

    // Cycle tips
    const tipIndex = Math.min(Math.floor(progress * tips.length), tips.length - 1);
    tipText.textContent = tips[tipIndex];

    // Cardinal glow sequence: N → E → S → W
    const glowIndex = Math.floor(progress * 4);
    ['n','e','s','w'].forEach((dir, i) => {
      cardinals[dir].classList.toggle('glow', i === glowIndex && progress < 1);
    });

    if (progress < 1) {
      requestAnimationFrame(frame);
    } else {
      // LOCKED state
      locked = true;
      document.body.classList.add('locked');
      needle.style.transform = 'rotate(0deg)';
      pctText.textContent = '100%';
      pctText.style.color = '#c94a4a';
      tipText.textContent = 'NORTH LOCKED — SYSTEM READY';
      tipText.style.color = '#7ec96c';
      // Ensure N glows red via locked CSS
      Object.values(cardinals).forEach(c => c.classList.remove('glow'));
    }
  }

  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
