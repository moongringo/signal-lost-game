<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settings V2 — Video</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Courier New', Courier, monospace;
      background: #0a0a0a;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px 16px;
    }

    /* HUD Header */
    .hud-header {
      width: 100%;
      max-width: 640px;
      border: 2px solid #333;
      background: #111;
      padding: 12px 20px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .hud-header::before {
      content: '◆';
      color: #00ff66;
      font-size: 14px;
    }

    .hud-header h1 {
      font-size: 14px;
      letter-spacing: 3px;
      color: #00ff66;
      text-transform: uppercase;
    }

    /* Visual Preview Area */
    .preview-area {
      width: 100%;
      max-width: 640px;
      height: 200px;
      border: 2px solid #333;
      background: #111;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }

    .preview-scene {
      width: 100%;
      height: 100%;
      position: relative;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 40%, #0f3460 70%, #1a1a2e 100%);
      transition: filter 0.4s ease;
    }

    /* Scene elements */
    .preview-scene .moon {
      position: absolute;
      top: 20px;
      right: 60px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: #c8d6e5;
      box-shadow: 0 0 30px rgba(200, 214, 229, 0.3);
    }

    .preview-scene .mountain {
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
      border-style: solid;
    }

    .preview-scene .mountain-1 {
      left: 10%;
      border-left-width: 80px;
      border-right-width: 80px;
      border-bottom-width: 120px;
      border-left-color: transparent;
      border-right-color: transparent;
      border-bottom-color: #2d3436;
    }

    .preview-scene .mountain-2 {
      left: 35%;
      border-left-width: 100px;
      border-right-width: 100px;
      border-bottom-width: 160px;
      border-left-color: transparent;
      border-right-color: transparent;
      border-bottom-color: #636e72;
    }

    .preview-scene .mountain-3 {
      left: 60%;
      border-left-width: 70px;
      border-right-width: 70px;
      border-bottom-width: 100px;
      border-left-color: transparent;
      border-right-color: transparent;
      border-bottom-color: #2d3436;
    }

    .preview-scene .tree {
      position: absolute;
      bottom: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-left-width: 15px;
      border-right-width: 15px;
      border-bottom-width: 50px;
      border-left-color: transparent;
      border-right-color: transparent;
      border-bottom-color: #1b4332;
    }

    .preview-scene .tree-1 { left: 5%; }
    .preview-scene .tree-2 { left: 25%; border-bottom-width: 70px; border-bottom-color: #2d6a4f; }
    .preview-scene .tree-3 { left: 50%; }
    .preview-scene .tree-4 { left: 75%; border-bottom-width: 60px; }
    .preview-scene .tree-5 { left: 90%; border-bottom-width: 45px; }

    .preview-scene .ground {
      position: absolute;
      bottom: 0;
      width: 100%;
      height: 20px;
      background: #1b4332;
    }

    /* Shadow elements */
    .preview-scene .shadow {
      position: absolute;
      bottom: 20px;
      background: rgba(0, 0, 0, 0.5);
      border-radius: 50%;
      transition: opacity 0.4s ease;
    }

    .preview-scene .shadow-1 { left: 38%; width: 60px; height: 12px; }
    .preview-scene .shadow-2 { left: 52%; width: 30px; height: 8px; }
    .preview-scene .shadow-3 { left: 77%; width: 40px; height: 10px; }

    /* Quality filter states */
    .preview-scene.quality-low {
      filter: blur(2px) contrast(0.8) brightness(0.7);
    }

    .preview-scene.quality-low::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-conic-gradient(#000 0% 25%, transparent 0% 50%) 50% / 4px 4px;
      opacity: 0.4;
      pointer-events: none;
    }

    .preview-scene.quality-med {
      filter: blur(1px) contrast(0.9) brightness(0.85);
    }

    .preview-scene.quality-med::after {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-conic-gradient(#000 0% 25%, transparent 0% 50%) 50% / 2px 2px;
      opacity: 0.2;
      pointer-events: none;
    }

    .preview-scene.quality-high {
      filter: none;
    }

    .preview-scene.quality-ultra {
      filter: saturate(1.2) contrast(1.05);
    }

    .preview-scene.quality-ultra::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 30% 20%, rgba(255,255,255,0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    /* Shadows off state */
    .preview-scene.shadows-off .shadow {
      opacity: 0;
    }

    /* Preview label */
    .preview-label {
      position: absolute;
      bottom: 8px;
      right: 12px;
      font-size: 10px;
      letter-spacing: 2px;
      color: #00ff66;
      background: rgba(0, 0, 0, 0.7);
      padding: 4px 10px;
      border: 1px solid #00ff66;
    }

    /* Settings Container */
    .settings-container {
      width: 100%;
      max-width: 640px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Setting Row */
    .setting-row {
      border: 2px solid #333;
      background: #111;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
    }

    .setting-label {
      font-size: 12px;
      letter-spacing: 2px;
      color: #888;
      text-transform: uppercase;
      min-width: 160px;
    }

    .setting-options {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      flex: 1;
    }

    /* Option Buttons */
    .option-btn {
      background: #1a1a1a;
      border: 1px solid #444;
      color: #aaa;
      padding: 8px 16px;
      font-family: inherit;
      font-size: 11px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: all 0.2s ease;
      text-transform: uppercase;
    }

    .option-btn:hover {
      border-color: #666;
      color: #ddd;
    }

    .option-btn.active {
      border-color: #00ff66;
      color: #00ff66;
      background: rgba(0, 255, 102, 0.08);
      box-shadow: 0 0 8px rgba(0, 255, 102, 0.15);
    }

    /* Toggle Switch */
    .toggle-switch {
      position: relative;
      width: 52px;
      height: 28px;
      background: #1a1a1a;
      border: 1px solid #444;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .toggle-switch.active {
      border-color: #00ff66;
      background: rgba(0, 255, 102, 0.08);
    }

    .toggle-switch::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 20px;
      height: 20px;
      background: #666;
      transition: all 0.2s ease;
    }

    .toggle-switch.active::after {
      left: 27px;
      background: #00ff66;
      box-shadow: 0 0 6px rgba(0, 255, 102, 0.4);
    }

    /* Footer */
    .footer {
      width: 100%;
      max-width: 640px;
      margin-top: 24px;
      padding: 12px 20px;
      border: 2px solid #333;
      background: #111;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .footer-text {
      font-size: 10px;
      letter-spacing: 2px;
      color: #555;
    }

    .footer-status {
      font-size: 10px;
      letter-spacing: 2px;
      color: #00ff66;
    }

    /* Scanline effect */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: repeating-linear-gradient(
        0deg,
        transparent,
        transparent 2px,
        rgba(0, 0, 0, 0.03) 2px,
        rgba(0, 0, 0, 0.03) 4px
      );
      pointer-events: none;
      z-index: 100;
    }
  </style>
</head>
<body>

  <!-- HUD Header -->
  <div class="hud-header">
    <h1>Settings V2 — Video</h1>
  </div>

  <!-- Visual Preview Area -->
  <div class="preview-area">
    <div class="preview-scene quality-high" id="previewScene">
      <div class="moon"></div>
      <div class="mountain mountain-1"></div>
      <div class="mountain mountain-2"></div>
      <div class="mountain mountain-3"></div>
      <div class="tree tree-1"></div>
      <div class="tree tree-2"></div>
      <div class="tree tree-3"></div>
      <div class="tree tree-4"></div>
      <div class="tree tree-5"></div>
      <div class="ground"></div>
      <div class="shadow shadow-1"></div>
      <div class="shadow shadow-2"></div>
      <div class="shadow shadow-3"></div>
    </div>
    <div class="preview-label" id="previewLabel">HIGH</div>
  </div>

  <!-- Settings Container -->
  <div class="settings-container">

    <!-- Resolution -->
    <div class="setting-row">
      <span class="setting-label">Resolution</span>
      <div class="setting-options" id="resolutionOptions">
        <button class="option-btn" data-value="720p">720p</button>
        <button class="option-btn active" data-value="1080p">1080p</button>
        <button class="option-btn" data-value="1440p">1440p</button>
      </div>
    </div>

    <!-- Frame Rate Limit -->
    <div class="setting-row">
      <span class="setting-label">Frame Rate Limit</span>
      <div class="setting-options" id="fpsOptions">
        <button class="option-btn" data-value="30">30</button>
        <button class="option-btn active" data-value="60">60</button>
        <button class="option-btn" data-value="90">90</button>
        <button class="option-btn" data-value="120">120</button>
        <button class="option-btn" data-value="unlimited">Unlimited</button>
      </div>
    </div>

    <!-- Quality Preset -->
    <div class="setting-row">
      <span class="setting-label">Quality Preset</span>
      <div class="setting-options" id="qualityOptions">
        <button class="option-btn" data-value="low">Low</button>
        <button class="option-btn" data-value="med">Med</button>
        <button class="option-btn active" data-value="high">High</button>
        <button class="option-btn" data-value="ultra">Ultra</button>
      </div>
    </div>

    <!-- Shadows -->
    <div class="setting-row">
      <span class="setting-label">Shadows</span>
      <div class="setting-options">
        <div class="toggle-switch active" id="shadowsToggle" data-enabled="true"></div>
      </div>
    </div>

    <!-- Texture Quality -->
    <div class="setting-row">
      <span class="setting-label">Texture Quality</span>
      <div class="setting-options" id="textureOptions">
        <button class="option-btn" data-value="low">Low</button>
        <button class="option-btn" data-value="med">Med</button>
        <button class="option-btn active" data-value="high">High</button>
        <button class="option-btn" data-value="ultra">Ultra</button>
      </div>
    </div>

    <!-- Anti-Aliasing -->
    <div class="setting-row">
      <span class="setting-label">Anti-Aliasing</span>
      <div class="setting-options" id="aaOptions">
        <button class="option-btn" data-value="off">Off</button>
        <button class="option-btn" data-value="fxaa">FXAA</button>
        <button class="option-btn active" data-value="smaa">SMAA</button>
        <button class="option-btn" data-value="taa">TAA</button>
      </div>
    </div>

  </div>

  <!-- Footer -->
  <div class="footer">
    <span class="footer-text">SYS.SETTINGS.VIDEO</span>
    <span class="footer-status" id="footerStatus">APPLIED</span>
  </div>

  <script>
    // State
    const state = {
      resolution: '1080p',
      fps: '60',
      quality: 'high',
      shadows: true,
      texture: 'high',
      antiAliasing: 'smaa'
    };

    // Helper: set active button in a group
    function setActiveButton(container, value) {
      container.querySelectorAll('.option-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.value === value);
      });
    }

    // Helper: update preview based on quality preset
    function updatePreview() {
      const scene = document.getElementById('previewScene');
      const label = document.getElementById('previewLabel');

      // Remove old quality classes
      scene.classList.remove('quality-low', 'quality-med', 'quality-high', 'quality-ultra');
      scene.classList.add(`quality-${state.quality}`);

      // Update shadows
      scene.classList.toggle('shadows-off', !state.shadows);

      // Update label
      label.textContent = state.quality.toUpperCase();
    }

    // Helper: flash status
    function flashStatus() {
      const status = document.getElementById('footerStatus');
      status.textContent = 'APPLYING...';
      setTimeout(() => {
        status.textContent = 'APPLIED';
      }, 300);
    }

    // Resolution
    document.getElementById('resolutionOptions').addEventListener('click', (e) => {
      if (e.target.classList.contains('option-btn')) {
        state.resolution = e.target.dataset.value;
        setActiveButton(document.getElementById('resolutionOptions'), state.resolution);
        flashStatus();
      }
    });

    // Frame Rate
    document.getElementById('fpsOptions').addEventListener('click', (e) => {
      if (e.target.classList.contains('option-btn')) {
        state.fps = e.target.dataset.value;
        setActiveButton(document.getElementById('fpsOptions'), state.fps);
        flashStatus();
      }
    });

    // Quality Preset
    document.getElementById('qualityOptions').addEventListener('click', (e) => {
      if (e.target.classList.contains('option-btn')) {
        state.quality = e.target.dataset.value;
        setActiveButton(document.getElementById('qualityOptions'), state.quality);
        updatePreview();
        flashStatus();
      }
    });

    // Shadows Toggle
    document.getElementById('shadowsToggle').addEventListener('click', function() {
      state.shadows = !state.shadows;
      this.classList.toggle('active', state.shadows);
      this.dataset.enabled = state.shadows;
      updatePreview();
      flashStatus();
    });

    // Texture Quality
    document.getElementById('textureOptions').addEventListener('click', (e) => {
      if (e.target.classList.contains('option-btn')) {
        state.texture = e.target.dataset.value;
        setActiveButton(document.getElementById('textureOptions'), state.texture);
        flashStatus();
      }
    });

    // Anti-Aliasing
    document.getElementById('aaOptions').addEventListener('click', (e) => {
      if (e.target.classList.contains('option-btn')) {
        state.antiAliasing = e.target.dataset.value;
        setActiveButton(document.getElementById('aaOptions'), state.antiAliasing);
        flashStatus();
      }
    });

    // Initialize preview
    updatePreview();
  </script>

</body>
</html>
