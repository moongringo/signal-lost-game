<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SIGNAL LOST — Main Menu</title>
  <style>
    :root {
      --bg: #050608;
      --panel: rgba(12, 14, 18, 0.72);
      --border: rgba(100, 255, 218, 0.18);
      --accent: #64ffda;
      --accent-dim: rgba(100, 255, 218, 0.25);
      --text: #e8eef2;
      --muted: #8a96a3;
      --danger: #ff5a5a;
      --warn: #ffd166;
      --success: #64ffda;
      --font: 'Segoe UI', system-ui, -apple-system, sans-serif;
      --radius: 12px;
      --shadow: 0 8px 32px rgba(0,0,0,0.45);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font);
      overflow: hidden;
    }

    /* ─── Three.js canvas behind everything ─── */
    #terrain-canvas {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* ─── Fog overlay ─── */
    .fog-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background:
        radial-gradient(ellipse at 30% 80%, rgba(5,6,8,0.6) 0%, transparent 60%),
        radial-gradient(ellipse at 70% 20%, rgba(5,6,8,0.4) 0%, transparent 50%);
    }

    /* ─── Vignette ─── */
    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      box-shadow: inset 0 0 180px 60px rgba(0,0,0,0.7);
    }

    /* ─── Scanlines ─── */
    .scanlines {
      position: fixed;
      inset: 0;
      z-index: 3;
      pointer-events: none;
      opacity: 0.06;
      background: repeating-linear-gradient(
        0deg,
        transparent 0px,
        transparent 2px,
        rgba(0,0,0,0.15) 2px,
        rgba(0,0,0,0.15) 4px
      );
    }

    /* ─── Main menu container ─── */
    .menu-container {
      position: relative;
      z-index: 10;
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 20px;
    }

    /* ─── Title block ─── */
    .title-block {
      text-align: center;
      margin-bottom: 48px;
      animation: titleFadeIn 1.2s ease-out both;
    }

    @keyframes titleFadeIn {
      from { opacity: 0; transform: translateY(-30px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .game-title {
      font-size: clamp(48px, 8vw, 96px);
      font-weight: 900;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--text);
      text-shadow:
        0 0 20px var(--accent-dim),
        0 0 60px rgba(100, 255, 218, 0.15),
        0 0 120px rgba(100, 255, 218, 0.08);
      position: relative;
    }

    .game-title::after {
      content: '';
      position: absolute;
      left: 50%;
      bottom: -8px;
      transform: translateX(-50%);
      width: 60%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.6;
      animation: linePulse 3s ease-in-out infinite;
    }

    @keyframes linePulse {
      0%, 100% { opacity: 0.3; width: 50%; }
      50%      { opacity: 0.8; width: 70%; }
    }

    .game-subtitle {
      font-size: clamp(12px, 2vw, 16px);
      font-weight: 400;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--muted);
      margin-top: 12px;
      opacity: 0.85;
    }

    /* ─── Menu buttons ─── */
    .menu-buttons {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 320px;
      animation: buttonsFadeIn 1s ease-out 0.4s both;
    }

    @keyframes buttonsFadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .menu-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px 32px;
      border-radius: 999px;
      border: 1px solid var(--border);
      background: rgba(12, 14, 18, 0.6);
      backdrop-filter: blur(12px);
      color: var(--text);
      font-family: var(--font);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
      outline: none;
    }

    .menu-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, rgba(100,255,218,0.1), transparent 60%);
      opacity: 0;
      transition: opacity 0.35s ease;
    }

    .menu-btn:hover {
      border-color: var(--accent);
      background: rgba(12, 14, 18, 0.85);
      transform: translateY(-2px) scale(1.02);
      box-shadow:
        0 0 20px rgba(100, 255, 218, 0.15),
        0 0 40px rgba(100, 255, 218, 0.08),
        0 8px 24px rgba(0,0,0,0.3);
      text-shadow: 0 0 8px var(--accent-dim);
    }

    .menu-btn:hover::before {
      opacity: 1;
    }

    .menu-btn:active {
      transform: translateY(0) scale(0.98);
      transition-duration: 0.1s;
    }

    .menu-btn .btn-glow {
      position: absolute;
      inset: -2px;
      border-radius: 999px;
      opacity: 0;
      transition: opacity 0.35s ease;
      background: radial-gradient(ellipse at center, rgba(100,255,218,0.2) 0%, transparent 70%);
      pointer-events: none;
    }

    .menu-btn:hover .btn-glow {
      opacity: 1;
    }

    .menu-btn .btn-icon {
      margin-right: 10px;
      font-size: 16px;
      opacity: 0.7;
      transition: opacity 0.35s ease;
    }

    .menu-btn:hover .btn-icon {
      opacity: 1;
    }

    /* Primary button (PLAY) */
    .menu-btn.primary {
      border-color: rgba(100, 255, 218, 0.35);
      background: rgba(12, 14, 18, 0.75);
    }

    .menu-btn.primary:hover {
      border-color: var(--accent);
      box-shadow:
        0 0 30px rgba(100, 255, 218, 0.2),
        0 0 60px rgba(100, 255, 218, 0.1),
        0 8px 32px rgba(0,0,0,0.4);
    }

    /* ─── Bottom bar ─── */
    .bottom-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      z-index: 10;
      animation: bottomFadeIn 1s ease-out 0.8s both;
    }

    @keyframes bottomFadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .version-info {
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 11px;
      letter-spacing: 0.1em;
      color: var(--muted);
      text-transform: uppercase;
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--success);
      box-shadow: 0 0 6px var(--success);
      animation: statusPulse 2s ease-in-out infinite;
    }

    @keyframes statusPulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50%      { opacity: 0.5; transform: scale(1.3); }
    }

    /* ─── HUD watermark ─── */
    .hud-watermark {
      position: fixed;
      top: 20px;
      right: 24px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      opacity: 0.35;
      pointer-events: none;
      animation: hudFadeIn 1s ease-out 1s both;
    }

    @keyframes hudFadeIn {
      from { opacity: 0; }
      to   { opacity: 0.35; }
    }

    .hud-watermark .hud-line {
      width: 48px;
      height: 1px;
      background: var(--accent);
    }

    .hud-watermark .hud-text {
      font-size: 9px;
      letter-spacing: 0.2em;
      color: var(--accent);
      text-transform: uppercase;
    }

    .hud-watermark .hud-box {
      width: 32px;
      height: 18px;
      border: 1px solid var(--accent);
      opacity: 0.5;
    }

    /* ─── Decorative corner brackets ─── */
    .corner {
      position: fixed;
      width: 24px;
      height: 24px;
      border-color: var(--accent);
      border-style: solid;
      opacity: 0.2;
      z-index: 10;
      pointer-events: none;
    }
    .corner.tl { top: 16px; left: 16px; border-width: 1px 0 0 1px; }
    .corner.tr { top: 16px; right: 16px; border-width: 1px 1px 0 0; }
    .corner.bl { bottom: 16px; left: 16px; border-width: 0 0 1px 1px; }
    .corner.br { bottom: 16px; right: 16px; border-width: 0 1px 1px 0; }

    /* ─── Responsive ─── */
    @media (max-width: 480px) {
      .menu-container { padding: 24px 16px; }
      .title-block { margin-bottom: 32px; }
      .menu-buttons { max-width: 280px; gap: 10px; }
      .menu-btn { padding: 14px 24px; font-size: 13px; }
      .bottom-bar { padding: 16px 20px; flex-direction: column; gap: 8px; align-items: center; }
    }
  </style>
</head>
<body>

  <!-- Three.js terrain canvas -->
  <canvas id="terrain-canvas"></canvas>

  <!-- Atmospheric overlays -->
  <div class="fog-overlay"></div>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <!-- Corner brackets -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- HUD watermark -->
  <div class="hud-watermark">
    <div class="hud-line"></div>
    <div class="hud-text">SYS.HUD</div>
    <div class="hud-box"></div>
  </div>

  <!-- Main menu -->
  <div class="menu-container">
    <div class="title-block">
      <h1 class="game-title">SIGNAL LOST</h1>
      <p class="game-subtitle">Tactical Operations Command</p>
    </div>

    <nav class="menu-buttons" aria-label="Main menu">
      <button class="menu-btn primary" onclick="startGame()">
        <span class="btn-glow"></span>
        <span class="btn-icon">▶</span>
        <span>PLAY</span>
      </button>
      <button class="menu-btn" onclick="openLoadout()">
        <span class="btn-glow"></span>
        <span class="btn-icon">◈</span>
        <span>LOADOUT</span>
      </button>
      <button class="menu-btn" onclick="openOperations()">
        <span class="btn-glow"></span>
        <span class="btn-icon">◉</span>
        <span>OPERATIONS</span>
      </button>
      <button class="menu-btn" onclick="openArmory()">
        <span class="btn-glow"></span>
        <span class="btn-icon">◆</span>
        <span>ARMORY</span>
      </button>
      <button class="menu-btn" onclick="openSettings()">
        <span class="btn-glow"></span>
        <span class="btn-icon">⚙</span>
        <span>SETTINGS</span>
      </button>
    </nav>
  </div>

  <!-- Bottom bar -->
  <div class="bottom-bar">
    <div class="version-info">Build v0.9.2 — Alpha</div>
    <div class="status-indicator">
      <span class="status-dot"></span>
      <span>Online</span>
    </div>
  </div>

  <!-- Three.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    // ─── Three.js slow-panning tactical terrain ───
    (function() {
      const canvas = document.getElementById('terrain-canvas');
      const scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x050608, 0.035);

      const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 12, 18);
      camera.lookAt(0, 0, 0);

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x050608);

      // Terrain geometry
      const geometry = new THREE.PlaneGeometry(60, 60, 80, 80);
      const positions = geometry.attributes.position;
      const vertexCount = positions.count;

      // Procedural terrain height
      for (let i = 0; i < vertexCount; i++) {
        const x = positions.getX(i);
        const y = positions.getY(i);
        const dist = Math.sqrt(x * x + y * y);
        const height =
          Math.sin(x * 0.15) * Math.cos(y * 0.12) * 2.5 +
          Math.sin(x * 0.35 + y * 0.25) * 1.0 +
          Math.cos(dist * 0.2) * 0.8 +
          (Math.random() - 0.5) * 0.3;
        positions.setZ(i, height);
      }
      geometry.computeVertexNormals();

      // Terrain material — dark tactical look
      const material = new THREE.MeshStandardMaterial({
        color: 0x0c1218,
        roughness: 0.92,
        metalness: 0.08,
        flatShading: true,
        side: THREE.DoubleSide
      });

      const terrain = new THREE.Mesh(geometry, material);
      terrain.rotation.x = -Math.PI / 2;
      scene.add(terrain);

      // Grid overlay lines
      const gridHelper = new THREE.GridHelper(60, 40, 0x1a2a35, 0x0f1a22);
      gridHelper.position.y = 0.05;
      scene.add(gridHelper);

      // Ambient light
      const ambientLight = new THREE.AmbientLight(0x1a2530, 0.6);
      scene.add(ambientLight);

      // Directional light (moon/cold light)
      const dirLight = new THREE.DirectionalLight(0x4a6a7a, 0.5);
      dirLight.position.set(10, 20, 10);
      scene.add(dirLight);

      // Accent point lights for atmosphere
      const accentLight1 = new THREE.PointLight(0x64ffda, 0.3, 25);
      accentLight1.position.set(-8, 4, -5);
      scene.add(accentLight1);

      const accentLight2 = new THREE.PointLight(0x3a8a9a, 0.2, 20);
      accentLight2.position.set(8, 3, 5);
      scene.add(accentLight2);

      // Floating particles (dust / signal fragments)
      const particleCount = 200;
      const particleGeo = new THREE.BufferGeometry();
      const particlePositions = new Float32Array(particleCount * 3);
      for (let i = 0; i < particleCount * 3; i++) {
        particlePositions[i] = (Math.random() - 0.5) * 50;
      }
      particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePositions, 3));
      const particleMat = new THREE.PointsMaterial({
        color: 0x64ffda,
        size: 0.08,
        transparent: true,
        opacity: 0.4
      });
      const particles = new THREE.Points(particleGeo, particleMat);
      scene.add(particles);

      // Animation
      let time = 0;
      const cameraRadius = 18;
      const cameraHeight = 12;

      function animate() {
        requestAnimationFrame(animate);
        time += 0.0015;

        // Slow camera orbit
        camera.position.x = Math.sin(time * 0.5) * cameraRadius * 0.6;
        camera.position.z = Math.cos(time * 0.5) * cameraRadius;
        camera.position.y = cameraHeight + Math.sin(time * 0.3) * 1.5;
        camera.lookAt(0, 0, 0);

        // Particle drift
        const pPos = particles.geometry.attributes.position.array;
        for (let i = 0; i < particleCount; i++) {
          pPos[i * 3 + 1] += Math.sin(time + i) * 0.002;
          if (pPos[i * 3 + 1] > 15) pPos[i * 3 + 1] = -5;
        }
        particles.geometry.attributes.position.needsUpdate = true;

        // Accent light pulse
        accentLight1.intensity = 0.25 + Math.sin(time * 2) * 0.08;
        accentLight2.intensity = 0.15 + Math.cos(time * 1.5) * 0.06;

        renderer.render(scene, camera);
      }
      animate();

      // Resize handler
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    })();

    // ─── Menu button handlers ───
    function startGame() {
      console.log('[MENU] Starting game...');
      // window.location.href = 'game.html';
    }
    function openLoadout() {
      console.log('[MENU] Opening loadout...');
    }
    function openOperations() {
      console.log('[MENU] Opening operations...');
    }
    function openArmory() {
      console.log('[MENU] Opening armory...');
    }
    function openSettings() {
      console.log('[MENU] Opening settings...');
    }
  </script>
</body>
</html>
