<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marker V3 — Threats</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0f0b;
    color: #c8d4c8;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px;
  }
  h1 {
    font-size: 1.6rem;
    letter-spacing: 3px;
    color: #ff4d4d;
    text-transform: uppercase;
    margin-bottom: 24px;
    text-shadow: 0 0 8px rgba(255, 77, 77, 0.4);
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
    gap: 20px;
    width: 100%;
    max-width: 1200px;
  }
  .card {
    background: #111811;
    border: 1px solid #223322;
    border-radius: 6px;
    overflow: hidden;
    position: relative;
  }
  .card-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 10px 14px;
    background: #161d16;
    border-bottom: 1px solid #223322;
  }
  .card-title {
    font-size: 0.85rem;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: #e0e8e0;
  }
  .risk {
    display: flex;
    gap: 4px;
  }
  .risk-bar {
    width: 8px;
    height: 14px;
    background: #2a332a;
    border-radius: 2px;
  }
  .risk-bar.active { background: #ff4d4d; box-shadow: 0 0 4px rgba(255, 77, 77, 0.6); }
  .map {
    width: 100%;
    height: 180px;
    position: relative;
    background: #0e130e;
    overflow: hidden;
  }
  /* Grid lines for map texture */
  .map::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(40, 60, 40, 0.15) 1px, transparent 1px),
      linear-gradient(90deg, rgba(40, 60, 40, 0.15) 1px, transparent 1px);
    background-size: 20px 20px;
    pointer-events: none;
  }

  /* Common danger pulse */
  @keyframes danger-pulse {
    0%, 100% { opacity: 0.6; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.08); }
  }
  .pulse {
    animation: danger-pulse 1.6s ease-in-out infinite;
  }

  /* RED ZONE — hatched red area */
  .red-zone {
    position: absolute;
    left: 20%; top: 20%;
    width: 60%; height: 60%;
    background: repeating-linear-gradient(
      45deg,
      rgba(255, 60, 60, 0.15),
      rgba(255, 60, 60, 0.15) 6px,
      rgba(255, 60, 60, 0.35) 6px,
      rgba(255, 60, 60, 0.35) 12px
    );
    border: 2px solid rgba(255, 60, 60, 0.7);
    border-radius: 4px;
    animation: danger-pulse 2s ease-in-out infinite;
  }
  .red-zone::after {
    content: 'RED ZONE';
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255, 80, 80, 0.9);
    font-size: 0.75rem;
    letter-spacing: 2px;
    font-weight: 700;
  }

  /* SNIPER — crosshair */
  .sniper {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 64px; height: 64px;
  }
  .sniper-ring {
    position: absolute;
    inset: 0;
    border: 2px solid rgba(255, 60, 60, 0.8);
    border-radius: 50%;
    animation: danger-pulse 1.4s ease-in-out infinite;
  }
  .sniper-cross {
    position: absolute;
    background: rgba(255, 60, 60, 0.9);
  }
  .sniper-cross.h { left: 50%; top: 0; bottom: 0; width: 2px; transform: translateX(-50%); }
  .sniper-cross.v { top: 50%; left: 0; right: 0; height: 2px; transform: translateY(-50%); }
  .sniper-dot {
    position: absolute;
    left: 50%; top: 50%;
    width: 6px; height: 6px;
    background: #ff3c3c;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  /* AMBUSH — triangle with exclamation */
  .ambush {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 0; height: 0;
    border-left: 32px solid transparent;
    border-right: 32px solid transparent;
    border-bottom: 52px solid rgba(255, 180, 0, 0.85);
    animation: danger-pulse 1.5s ease-in-out infinite;
    filter: drop-shadow(0 0 6px rgba(255, 180, 0, 0.5));
  }
  .ambush::after {
    content: '!';
    position: absolute;
    left: 50%; top: 18px;
    transform: translateX(-50%);
    color: #111;
    font-size: 1.4rem;
    font-weight: 900;
  }

  /* MINE FIELD — skull icon pattern */
  .mine-field {
    position: absolute;
    left: 15%; top: 15%;
    width: 70%; height: 70%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(3, 1fr);
    gap: 8px;
    padding: 8px;
  }
  .skull {
    width: 100%; height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    animation: danger-pulse 1.7s ease-in-out infinite;
  }
  .skull svg {
    width: 28px; height: 28px;
    fill: rgba(200, 200, 200, 0.9);
    filter: drop-shadow(0 0 4px rgba(200,200,200,0.4));
  }

  /* ARTILLERY — explosion burst */
  .artillery {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 80px; height: 80px;
  }
  .burst {
    position: absolute;
    left: 50%; top: 50%;
    width: 100%; height: 100%;
    transform: translate(-50%, -50%);
  }
  .burst-ray {
    position: absolute;
    left: 50%; top: 50%;
    width: 2px; height: 50%;
    background: rgba(255, 120, 40, 0.9);
    transform-origin: bottom center;
    border-radius: 1px;
  }
  .burst-core {
    position: absolute;
    left: 50%; top: 50%;
    width: 16px; height: 16px;
    background: #ff7828;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 12px rgba(255, 120, 40, 0.8);
    animation: danger-pulse 0.9s ease-in-out infinite;
  }

  /* GAS ZONE — skull with cloud */
  .gas-zone {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 90px; height: 70px;
    animation: danger-pulse 1.8s ease-in-out infinite;
  }
  .cloud {
    position: absolute;
    background: rgba(160, 220, 100, 0.35);
    border-radius: 50%;
    filter: blur(4px);
  }
  .gas-skull {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -40%);
    width: 32px; height: 32px;
  }
  .gas-skull svg {
    width: 100%; height: 100%;
    fill: rgba(180, 240, 120, 0.95);
    filter: drop-shadow(0 0 5px rgba(160,220,100,0.6));
  }

  /* FIRE ZONE — flame icon */
  .fire-zone {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 64px; height: 80px;
    animation: danger-pulse 1.2s ease-in-out infinite;
  }
  .flame {
    position: absolute;
    bottom: 0;
    background: linear-gradient(to top, #ff3c3c, #ff8800, #ffcc00);
    border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
    opacity: 0.9;
    filter: drop-shadow(0 0 6px rgba(255, 100, 30, 0.6));
  }

  /* RADIATION — trefoil */
  .radiation {
    position: absolute;
    left: 50%; top: 50%;
    transform: translate(-50%, -50%);
    width: 72px; height: 72px;
    animation: danger-pulse 1.6s ease-in-out infinite;
  }
  .rad-center {
    position: absolute;
    left: 50%; top: 50%;
    width: 14px; height: 14px;
    background: #c8ff3c;
    border-radius: 50%;
    transform: translate(-50%, -50%);
    box-shadow: 0 0 8px rgba(200, 255, 60, 0.6);
  }
  .rad-blade {
    position: absolute;
    left: 50%; top: 50%;
    width: 22px; height: 30px;
    background: #c8ff3c;
    border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    transform-origin: 50% 10%;
    box-shadow: 0 0 6px rgba(200, 255, 60, 0.4);
  }
</style>
</head>
