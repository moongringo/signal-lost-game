<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Signal Lost — Mission Select</title>
  <style>
    :root {
      --bg: #0a0f14;
      --panel: #111820;
      --panel-border: #1e2a35;
      --text: #c8d4e0;
      --muted: #6b7f8f;
      --green: #2ecc71;
      --green-glow: rgba(46, 204, 113, 0.35);
      --blue: #3498db;
      --blue-glow: rgba(52, 152, 219, 0.45);
      --gray: #4a5560;
      --red: #e74c3c;
      --yellow: #f1c40f;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Tactical map background */
    .map-bg {
      position: absolute;
      inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 20% 30%, rgba(30,80,60,0.12) 0%, transparent 70%),
        radial-gradient(ellipse 500px 350px at 75% 70%, rgba(20,50,80,0.10) 0%, transparent 70%),
        repeating-linear-gradient(0deg, transparent, transparent 39px, rgba(30,60,50,0.06) 40px),
        repeating-linear-gradient(90deg, transparent, transparent 39px, rgba(30,60,50,0.06) 40px);
      pointer-events: none;
      z-index: 0;
    }

    .map-bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at 50% 50%, transparent 40%, rgba(10,15,20,0.7) 100%);
    }

    /* HUD Header */
    .hud {
      position: relative;
      z-index: 10;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--panel-border);
      background: rgba(10,15,20,0.85);
      backdrop-filter: blur(8px);
    }

    .hud-title {
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: var(--muted);
    }

    .hud-title span { color: var(--blue); }

    .hud-stats {
      display: flex;
      gap: 18px;
      font-size: 12px;
      color: var(--muted);
    }

    .hud-stat { display: flex; align-items: center; gap: 6px; }
    .hud-stat .dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green-glow);
    }

    /* Map Area */
    .map-wrap {
      position: relative;
      flex: 1;
      overflow: hidden;
    }

    svg.map-svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Mission Nodes */
    .nodes-layer {
      position: absolute;
      inset: 0;
      z-index: 2;
    }

    .node {
      position: absolute;
      width: 56px;
      height: 56px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 800;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: transform 0.2s, box-shadow 0.2s;
      user-select: none;
      border: 3px solid transparent;
    }

    .node:hover { transform: translate(-50%, -50%) scale(1.12); }

    .node.completed {
      background: rgba(46, 204, 113, 0.12);
      border-color: var(--green);
      color: var(--green);
      box-shadow: 0 0 20px var(--green-glow), inset 0 0 12px var(--green-glow);
    }

    .node.available {
      background: rgba(52, 152, 219, 0.12);
      border-color: var(--blue);
      color: var(--blue);
      box-shadow: 0 0 20px var(--blue-glow), inset 0 0 12px var(--blue-glow);
      animation: pulseNode 2.2s ease-in-out infinite;
    }

    .node.locked {
      background: rgba(74, 85, 96, 0.12);
      border-color: var(--gray);
      color: var(--gray);
      cursor: not-allowed;
    }

    .node.selected {
      transform: translate(-50%, -50%) scale(1.2);
      z-index: 5;
    }

    .node .check { font-size: 22px; }

    @keyframes pulseNode {
      0%, 100% { box-shadow: 0 0 16px var(--blue-glow), inset 0 0 10px var(--blue-glow); }
      50% { box-shadow: 0 0 32px var(--blue-glow), inset 0 0 18px var(--blue-glow); }
    }

    /* Node labels */
    .node-label {
      position: absolute;
      transform: translate(-50%, 0);
      margin-top: 34px;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      white-space: nowrap;
      pointer-events: none;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }

    .node-label.completed { color: var(--green); }
    .node-label.available { color: var(--blue); }
    .node-label.locked { color: var(--gray); }

    /* Mission Detail Panel */
    .detail-panel {
      position: absolute;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%) translateY(20px);
      width: min(380px, 90vw);
      background: rgba(17, 24, 32, 0.95);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      padding: 20px 22px;
      z-index: 10;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s, transform 0.25s;
      backdrop-filter: blur(12px);
    }

    .detail-panel.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(-50%) translateY(0);
    }

    .detail-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .detail-name {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .detail-difficulty {
      display: flex;
      gap: 3px;
    }

    .skull {
      font-size: 14px;
      color: var(--gray);
    }

    .skull.active { color: var(--red); }

    .detail-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      font-size: 12px;
      line-height: 1.5;
    }

    .detail-row .label {
      color: var(--muted);
      font-weight: 600;
      min-width: 62px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-size: 10px;
      padding-top: 1px;
    }

    .detail-row .value { color: var(--text); }

    .rewards-list {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .reward-chip {
      background: rgba(52, 152, 219, 0.12);
      border: 1px solid rgba(52, 152, 219, 0.25);
      color: var(--blue);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
    }

    .reward-chip.gold {
      background: rgba(241, 196, 15, 0.12);
      border-color: rgba(241, 196, 15, 0.25);
      color: var(--yellow);
    }

    /* Bottom Action Bar */
    .action-bar {
      position: relative;
      z-index: 10;
      padding: 14px 20px 20px;
      display: flex;
      justify-content: center;
      background: rgba(10,15,20,0.85);
      border-top: 1px solid var(--panel-border);
      backdrop-filter: blur(8px);
    }

    .btn-start {
      background: var(--blue);
      color: #fff;
      border: none;
      padding: 14px 44px;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      opacity: 0;
      pointer-events: none;
      transform: translateY(8px);
      transition: opacity 0.25s, transform 0.25s, background 0.2s;
      box-shadow: 0 4px 20px rgba(52, 152, 219, 0.3);
    }

    .btn-start.show {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(0);
    }

    .btn-start:hover { background: #2980b9; }
    .btn-start:active { transform: scale(0.97); }

    /* Decorative map elements */
    .map-deco {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      z-index: 0;
    }

    .map-deco.d1 {
      width: 180px; height: 180px;
      top: 10%; left: 8%;
      background: radial-gradient(circle, rgba(46,204,113,0.04) 0%, transparent 70%);
    }

    .map-deco.d2 {
      width: 220px; height: 220px;
      bottom: 15%; right: 5%;
      background: radial-gradient(circle, rgba(52,152,219,0.04) 0%, transparent 70%);
    }

    .map-deco.d3 {
      width: 120px; height: 120px;
      top: 40%; right: 25%;
      background: radial-gradient(circle, rgba(231,76,60,0.03) 0%, transparent 70%);
    }
  </style>
</head>
<body>

  <!-- Tactical Map Background -->
  <div class="map-bg"></div>
  <div class="map-deco d1"></div>
  <div class="map-deco d2"></div>
  <div class="map-deco d3"></div>

  <!-- HUD Header -->
  <div class="hud">
    <div class="hud-title">Menu V2 — <span>Missions</span></div>
    <div class="hud-stats">
      <div class="hud-stat"><div class="dot"></div> 5/8 Complete</div>
      <div class="hud-stat">Sector 7</div>
    </div>
  </div>

  <!-- Map Area -->
  <div class="map-wrap" id="mapWrap">
    <svg class="map-svg" id="mapSvg">
      <!-- Paths drawn dynamically -->
    </svg>
    <div class="nodes-layer" id="nodesLayer">
      <!-- Nodes injected dynamically -->
    </div>
  </div>

  <!-- Mission Detail Panel -->
  <div class="detail-panel" id="detailPanel">
    <div class="detail-header">
      <div class="detail-name" id="detailName">—</div>
      <div class="detail-difficulty" id="detailDifficulty"></div>
    </div>
    <div class="detail-row">
      <div class="label">Objective</div>
      <div class="value" id="detailObjective">—</div>
    </div>
    <div class="detail-row">
      <div class="label">Rewards</div>
      <div class="value rewards-list" id="detailRewards"></div>
    </div>
  </div>

  <!-- Bottom Action Bar -->
  <div class="action-bar">
    <button class="btn-start" id="btnStart">Start Mission</button>
  </div>

  <script>
    // Mission data — 8 nodes in branching structure
    const missions = [
      { id: 1, name: 'Awakening',        status: 'completed', difficulty: 1, objective: 'Escape the abandoned facility and establish comms.',      rewards: ['+150 XP', 'Basic Medkit'],           x: 0.50, y: 0.88 },
      { id: 2, name: 'Signal Trace',     status: 'completed', difficulty: 2, objective: 'Track the mysterious broadcast to its source.',          rewards: ['+250 XP', 'Encrypted Key'],          x: 0.35, y: 0.70 },
      { id: 3, name: 'Deep Scan',        status: 'completed', difficulty: 2, objective: 'Deploy scanner drones across the wasteland.',            rewards: ['+250 XP', 'Drone Module'],           x: 0.65, y: 0.70 },
      { id: 4, name: 'Hostile Contact',  status: 'completed', difficulty: 3, objective: 'Survive the ambush and extract enemy intel.',           rewards: ['+400 XP', 'Tactical Vest'],          x: 0.22, y: 0.48 },
      { id: 5, name: 'Dead Zone',        status: 'available', difficulty: 3, objective: 'Navigate the radiation field without detection.',        rewards: ['+400 XP', 'Filter Mask'],            x: 0.50, y: 0.48 },
      { id: 6, name: 'Relay Break',      status: 'completed', difficulty: 3, objective: 'Sabotage the enemy communication relay.',                rewards: ['+400 XP', 'Detonator'],              x: 0.78, y: 0.48 },
      { id: 7, name: 'The Nest',         status: 'available', difficulty: 4, objective: 'Infiltrate the enemy stronghold and rescue the asset.', rewards: ['+600 XP', 'Stealth Chip', 'Rare'],   x: 0.35, y: 0.26 },
      { id: 8, name: 'Last Signal',      status: 'locked',    difficulty: 5, objective: 'Transmit the final message before the network falls.',   rewards: ['+1000 XP', 'Legendary Core'],        x: 0.65, y: 0.26 },
    ];

    // Branching connections (parent -> child)
    const connections = [
      [1, 2], [1, 3],
      [2, 4], [2, 5],
      [3, 5], [3, 6],
      [4, 7],
      [5, 7], [5, 8],
      [6, 8],
    ];

    const mapWrap = document.getElementById('mapWrap');
    const mapSvg = document.getElementById('mapSvg');
    const nodesLayer = document.getElementById('nodesLayer');
    const detailPanel = document.getElementById('detailPanel');
    const btnStart = document.getElementById('btnStart');

    let selectedId = null;

    function getStatusClass(s) {
      if (s === 'completed') return 'completed';
      if (s === 'available') return 'available';
      return 'locked';
    }

    function renderNodes() {
      nodesLayer.innerHTML = '';
      const w = mapWrap.clientWidth;
      const h = mapWrap.clientHeight;

      missions.forEach(m => {
        const left = m.x * w;
        const top = m.y * h;
        const cls = getStatusClass(m.status);

        const node = document.createElement('div');
        node.className = `node ${cls}`;
        node.style.left = left + 'px';
        node.style.top = top + 'px';
        node.dataset.id = m.id;

        if (m.status === 'completed') {
          node.innerHTML = '<span class="check">&#10003;</span>';
        } else {
          node.textContent = m.id;
        }

        node.addEventListener('click', () => selectMission(m.id));

        const label = document.createElement('div');
        label.className = `node-label ${cls}`;
        label.style.left = left + 'px';
        label.style.top = top + 'px';
        label.textContent = m.name;

        nodesLayer.appendChild(node);
        nodesLayer.appendChild(label);
      });
    }

    function renderPaths() {
      const w = mapWrap.clientWidth;
      const h = mapWrap.clientHeight;
      let svgHTML = '';

      connections.forEach(([fromId, toId]) => {
        const a = missions.find(m => m.id === fromId);
        const b = missions.find(m => m.id === toId);
        if (!a || !b) return;

        const x1 = a.x * w;
        const y1 = a.y * h;
        const x2 = b.x * w;
        const y2 = b.y * h;

        // Determine stroke color based on target status
        let stroke = '#2a3a45';
        let width = 2;
        let dash = 'none';

        if (b.status === 'completed') {
          stroke = 'rgba(46,204,113,0.35)';
          width = 2.5;
        } else if (b.status === 'available') {
          stroke = 'rgba(52,152,219,0.30)';
          width = 2;
          dash = '6,4';
        }

        svgHTML += `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${stroke}" stroke-width="${width}" stroke-dasharray="${dash}" stroke-linecap="round" />`;
      });

      mapSvg.innerHTML = svgHTML;
    }

    function selectMission(id) {
      const m = missions.find(x => x.id === id);
      if (!m || m.status === 'locked') return;

      selectedId = id;

      // Update node selection visuals
      document.querySelectorAll('.node').forEach(n => {
        n.classList.toggle('selected', parseInt(n.dataset.id) === id);
      });

      // Populate detail panel
      document.getElementById('detailName').textContent = m.name;
      document.getElementById('detailObjective').textContent = m.objective;

      // Difficulty skulls
      const diffContainer = document.getElementById('detailDifficulty');
      diffContainer.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const skull = document.createElement('span');
        skull.className = 'skull' + (i <= m.difficulty ? ' active' : '');
        skull.textContent = '☠';
        diffContainer.appendChild(skull);
      }

      // Rewards
      const rewardsContainer = document.getElementById('detailRewards');
      rewardsContainer.innerHTML = '';
      m.rewards.forEach(r => {
        const chip = document.createElement('span');
        chip.className = 'reward-chip' + (r.includes('Rare') || r.includes('Legendary') ? ' gold' : '');
        chip.textContent = r;
        rewardsContainer.appendChild(chip);
      });

      detailPanel.classList.add('show');
      btnStart.classList.add('show');
    }

    btnStart.addEventListener('click', () => {
      if (!selectedId) return;
      const m = missions.find(x => x.id === selectedId);
      alert(`Launching: ${m.name}`);
    });

    function init() {
      renderPaths();
      renderNodes();
    }

    window.addEventListener('resize', () => {
      renderPaths();
      renderNodes();
      // Re-select to reposition panel if needed
      if (selectedId) selectMission(selectedId);
    });

    init();
  </script>
</body>
</html>
