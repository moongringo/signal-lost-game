<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Chat V15</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    overflow: hidden;
    background: #000;
    font-family: 'Courier New', Courier, monospace;
    color: #1a3a1a;
    user-select: none;
    -webkit-user-select: none;
  }

  /* Night vision terrain background */
  #nv-bg {
    position: fixed; inset: 0;
    background:
      radial-gradient(ellipse 120% 80% at 30% 70%, #0d2b0d 0%, transparent 60%),
      radial-gradient(ellipse 100% 100% at 70% 30%, #143314 0%, transparent 55%),
      radial-gradient(ellipse 80% 60% at 50% 90%, #0a1f0a 0%, transparent 50%),
      linear-gradient(180deg, #0b1a0b 0%, #051005 40%, #020a02 100%);
    filter: contrast(1.3) brightness(0.7);
    z-index: 0;
  }
  #nv-bg::before {
    content: '';
    position: absolute; inset: 0;
    background:
      repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,30,0,0.08) 2px, rgba(0,30,0,0.08) 3px),
      repeating-linear-gradient(90deg, transparent, transparent 2px, rgba(0,30,0,0.05) 2px, rgba(0,30,0,0.05) 3px);
    pointer-events: none;
  }
  #nv-bg::after {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(circle at 50% 50%, transparent 30%, rgba(0,10,0,0.6) 100%);
    pointer-events: none;
  }

  /* Scanline overlay */
  #scanlines {
    position: fixed; inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 1px, rgba(0,20,0,0.15) 1px, rgba(0,20,0,0.15) 2px);
    pointer-events: none;
    z-index: 1;
    opacity: 0.4;
  }

  /* Vignette */
  #vignette {
    position: fixed; inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,5,0,0.85) 100%);
    pointer-events: none;
    z-index: 2;
  }

  /* Brief HUD on load */
  #hud-load {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    font-size: 9px; letter-spacing: 4px; color: #1a4a1a;
    opacity: 0; pointer-events: none; z-index: 10;
    animation: hudFade 4s ease-out forwards;
  }
  @keyframes hudFade {
    0% { opacity: 0; }
    10% { opacity: 0.6; }
    30% { opacity: 0.4; }
    100% { opacity: 0; }
  }

  /* TX indicator */
  #tx {
    position: fixed; top: 12px; right: 14px;
    font-size: 8px; letter-spacing: 2px; color: #1a4a1a;
    opacity: 0; pointer-events: none; z-index: 10;
    transition: opacity 0.2s;
  }
  #tx.on { opacity: 0.5; animation: txBlink 0.15s ease-in-out 3 alternate; }
  @keyframes txBlink { to { opacity: 1; color: #2d6b2d; } }

  /* Messages area */
  #messages {
    position: fixed; top: 0; left: 0; right: 0; bottom: 44px;
    overflow-y: auto; overflow-x: hidden;
    padding: 32px 16px 16px;
    display: flex; flex-direction: column; gap: 10px;
    z-index: 5;
    scrollbar-width: none;
  }
  #messages::-webkit-scrollbar { display: none; }

  .msg {
    max-width: 78%;
    font-size: 11px; line-height: 1.5;
    color: #1a3a1a;
    opacity: 0;
    animation: ghostIn 1.2s ease-out forwards, ghostOut 2s ease-in 8s forwards;
    word-break: break-word;
    text-shadow: 0 0 1px rgba(20,60,20,0.1);
  }
  .msg.sent { align-self: flex-end; text-align: right; }
  .msg.received { align-self: flex-start; text-align: left; }
  @keyframes ghostIn {
    0% { opacity: 0; transform: translateY(6px); filter: blur(2px); }
    100% { opacity: 0.35; transform: translateY(0); filter: blur(0px); }
  }
  @keyframes ghostOut {
    0% { opacity: 0.35; }
    100% { opacity: 0; }
  }

  /* Whisper button (tap-to-send, always barely visible at bottom center) */
  #whisper-btn {
    position: fixed; bottom: 8px; left: 50%; transform: translateX(-50%);
    width: 48px; height: 48px; border-radius: 50%;
    background: rgba(10,30,10,0.15);
    border: 1px solid rgba(20,60,20,0.08);
    color: #1a3a1a;
    font-size: 7px; letter-spacing: 2px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; z-index: 10;
    opacity: 0.25;
    transition: opacity 0.4s, background 0.4s, border-color 0.4s;
  }
  #whisper-btn:hover, #whisper-btn:active {
    opacity: 0.55;
    background: rgba(15,45,15,0.25);
    border-color: rgba(30,80,30,0.15);
  }
  #whisper-btn.hidden { opacity: 0; pointer-events: none; }

  /* Hidden input field, revealed on tap at very bottom */
  #input-area {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 56px;
    display: flex; align-items: center; gap: 8px;
    padding: 0 12px;
    background: rgba(3,10,3,0.85);
    backdrop-filter: blur(4px);
    border-top: 1px solid rgba(20,60,20,0.1);
    z-index: 11;
    transform: translateY(100%);
    transition: transform 0.35s cubic-bezier(0.25,0.8,0.25,1);
  }
  #input-area.open { transform: translateY(0); }
  #chat-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: #2d6b2d;
    font-family: inherit;
    font-size: 12px;
    caret-color: #2d6b2d;
  }
  #chat-input::placeholder { color: #0f2a0f; }
  #send-btn {
    background: transparent;
    border: none;
    color: #1a4a1a;
    font-size: 10px; letter-spacing: 1px;
    cursor: pointer;
    padding: 6px 10px;
    opacity: 0.5;
  }
  #send-btn:active { opacity: 1; color: #3d8b3d; }

  /* Inactivity auto-hide overlay for all UI except background */
  #ui-layer {
    position: fixed; inset: 0;
    z-index: 5;
    pointer-events: none;
  }
  #ui-layer.interactive { pointer-events: auto; }

  /* Tap zone hint (fades quickly) */
  #tap-hint {
    position: fixed; bottom: 64px; left: 50%; transform: translateX(-50%);
    font-size: 8px; letter-spacing: 3px; color: #1a3a1a;
    opacity: 0; pointer-events: none; z-index: 10;
    animation: hintFade 3s ease-out 1s forwards;
  }
  @keyframes hintFade {
    0% { opacity: 0; }
    15% { opacity: 0.35; }
    60% { opacity: 0.2; }
    100% { opacity: 0; }
  }
</style>
</head>
<body>

<div id="nv-bg"></div>
<div id="scanlines"></div>
<div id="vignette"></div>

<div id="ui-layer" class="interactive">
  <div id="hud-load">CHAT V15</div>
  <div id="tx">TX</div>
  <div id="tap-hint">TAP BOTTOM TO WHISPER</div>

  <div id="messages"></div>

  <button id="whisper-btn" aria-label="Whisper">WHISPER</button>

  <div id="input-area">
    <input type="text" id="chat-input" placeholder="type..." autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <button id="send-btn">SEND</button>
  </div>
</div>

<script>
  const messagesEl = document.getElementById('messages');
  const inputArea = document.getElementById('input-area');
  const chatInput = document.getElementById('chat-input');
  const sendBtn = document.getElementById('send-btn');
  const whisperBtn = document.getElementById('whisper-btn');
  const txEl = document.getElementById('tx');
  const uiLayer = document.getElementById('ui-layer');

  let inactivityTimer = null;
  const INACTIVITY_MS = 3000;

  function resetInactivity() {
    uiLayer.classList.add('interactive');
    whisperBtn.classList.remove('hidden');
    clearTimeout(inactivityTimer);
    inactivityTimer = setTimeout(() => {
      if (!inputArea.classList.contains('open')) {
        uiLayer.classList.remove('interactive');
        whisperBtn.classList.add('hidden');
      }
    }, INACTIVITY_MS);
  }

  function flashTx() {
    txEl.classList.add('on');
    setTimeout(() => txEl.classList.remove('on'), 600);
  }

  function addMessage(text, sent = true) {
    const div = document.createElement('div');
    div.className = 'msg ' + (sent ? 'sent' : 'received');
    div.textContent = text;
    messagesEl.appendChild(div);
    messagesEl.scrollTop = messagesEl.scrollHeight;
    // Remove from DOM after fade out completes
    setTimeout(() => {
      if (div.parentNode) div.parentNode.removeChild(div);
    }, 11000);
  }

  function send() {
    const text = chatInput.value.trim();
    if (!text) return;
    flashTx();
    addMessage(text, true);
    chatInput.value = '';
    resetInactivity();
    // Simulated echo reply
    setTimeout(() => addMessage('...', false), 1800);
  }

  function openInput() {
    inputArea.classList.add('open');
    chatInput.focus();
    resetInactivity();
  }
  function closeInput() {
    inputArea.classList.remove('open');
    chatInput.blur();
    resetInactivity();
  }

  whisperBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    openInput();
  });

  sendBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    send();
  });

  chatInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); send(); }
    if (e.key === 'Escape') { closeInput(); }
    resetInactivity();
  });

  // Tap very bottom edge (below whisper button) also opens input
  document.addEventListener('click', (e) => {
    const y = e.clientY;
    const h = window.innerHeight;
    if (y > h - 60 && !inputArea.classList.contains('open')) {
      openInput();
    }
    resetInactivity();
  });

  // Touch support
  document.addEventListener('touchstart', resetInactivity, { passive: true });
  document.addEventListener('touchmove', resetInactivity, { passive: true });
  document.addEventListener('keydown', resetInactivity);
  document.addEventListener('mousemove', resetInactivity);

  // Start inactivity timer
  resetInactivity();

  // Demo: auto-send a ghost message on load
  setTimeout(() => addMessage('signal detected', false), 2500);
</script>

</body>
</html>
