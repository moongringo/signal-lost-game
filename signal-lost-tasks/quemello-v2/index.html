<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quemello — Tactical Combat Simulation</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="quemello-theme.css">
  <style>
    .splash {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 40px;
    }
    .splash-badge {
      display: inline-block;
      padding: 6px 16px;
      border: 1px solid var(--gold);
      color: var(--gold);
      font-family: 'Space Grotesk', sans-serif;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 40px;
      opacity: 0;
      animation: fadeIn 1s ease 0.5s forwards;
    }
    .splash h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: clamp(56px, 14vw, 140px);
      font-weight: 700;
      letter-spacing: -3px;
      line-height: 1;
      margin-bottom: 16px;
      opacity: 0;
      animation: fadeIn 1.2s ease 1s forwards;
    }
    .splash h1 .q { color: var(--gold); text-shadow: 0 0 40px var(--gold-dim), 0 0 80px rgba(201,169,110,0.1); }
    .splash h1 .rest { color: var(--cream); }
    .splash-tagline {
      font-size: 14px;
      color: var(--text-dim);
      letter-spacing: 4px;
      text-transform: uppercase;
      margin-bottom: 60px;
      opacity: 0;
      animation: fadeIn 1s ease 1.5s forwards;
    }
    .splash-cta {
      opacity: 0;
      animation: fadeIn 1s ease 2s forwards, glowPulse 3s ease infinite 3s;
    }
    .splash-footer {
      position: fixed;
      bottom: 40px;
      left: 0; right: 0;
      z-index: 10;
      display: flex;
      justify-content: center;
      gap: 32px;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 2px;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1s ease 2.5s forwards;
    }
    .splash-footer a { color: var(--text-dim); text-decoration: none; transition: color 0.3s; }
    .splash-footer a:hover { color: var(--gold); }
    .splash-version {
      position: fixed;
      bottom: 40px;
      right: 40px;
      z-index: 10;
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      color: var(--text-dim);
      letter-spacing: 2px;
      opacity: 0;
      animation: fadeIn 1s ease 2.5s forwards;
    }
    .key-hint {
      position: fixed;
      bottom: 80px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 10;
      font-size: 11px;
      color: var(--text-dim);
      letter-spacing: 3px;
      text-transform: uppercase;
      opacity: 0;
      animation: fadeIn 1s ease 2.2s forwards, blink 2s ease infinite 3s;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes glowPulse {
      0%, 100% { box-shadow: 0 0 0 rgba(201,169,110,0); }
      50% { box-shadow: 0 0 25px var(--gold-dim); }
    }
    @keyframes blink {
      0%, 100% { opacity: 0.6; }
      50% { opacity: 0.2; }
    }
    /* Q Logo built in CSS */
    .q-logo-container {
      position: relative;
      width: 160px;
      height: 200px;
      margin-bottom: 40px;
      cursor: pointer;
      animation: breathe 4s ease-in-out infinite;
    }
    .q-logo-container:hover { animation-play-state: paused; transform: scale(1.05); }
    .q-logo-container:active { transform: scale(0.95); }
    @keyframes breathe {
      0%, 100% { transform: scale(1); filter: drop-shadow(0 0 30px var(--gold-dim)); }
      50% { transform: scale(1.03); filter: drop-shadow(0 0 50px rgba(201,169,110,0.3)); }
    }
    .q-body {
      position: absolute;
      width: 120px; height: 150px;
      left: 20px; top: 10px;
      border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
      background:
        radial-gradient(ellipse at 35% 40%, var(--coral-dim) 0%, transparent 50%),
        radial-gradient(ellipse at 65% 60%, var(--teal-dim) 0%, transparent 50%),
        radial-gradient(ellipse at 50% 30%, var(--purple-dim) 0%, transparent 50%),
        radial-gradient(ellipse at 45% 70%, var(--gold-dim) 0%, transparent 50%),
        linear-gradient(135deg, #2a1a3a 0%, #1a2a3a 30%, #3a1a2a 60%, #1a3a3a 100%);
      box-shadow: inset 0 0 40px rgba(0,0,0,0.5), inset 0 0 80px var(--purple-dim), 0 10px 40px rgba(0,0,0,0.5), 0 0 60px var(--gold-dim);
      overflow: hidden;
    }
    .q-body::before {
      content: '';
      position: absolute; inset: 0;
      border-radius: inherit;
      background: linear-gradient(160deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.05) 30%, transparent 50%);
    }
    .q-cutout {
      position: absolute;
      width: 60px; height: 80px;
      left: 50px; top: 45px;
      border-radius: 50%;
      background: var(--charcoal);
      box-shadow: inset 0 0 30px rgba(0,0,0,0.6);
    }
    .q-tail {
      position: absolute;
      width: 40px; height: 60px;
      bottom: 10px; right: 35px;
      transform: rotate(-30deg);
      transform-origin: top center;
      background: linear-gradient(180deg, #3a1a2a 0%, #2a1a3a 50%, #1a2a3a 100%);
      border-radius: 50% 50% 50% 50% / 30% 30% 70% 70%;
      box-shadow: inset 0 0 20px rgba(0,0,0,0.4), 0 5px 15px rgba(0,0,0,0.3);
    }
    .q-sparkle {
      position: absolute;
      width: 3px; height: 3px;
      border-radius: 50%;
      background: var(--gold);
      box-shadow: 0 0 8px var(--gold), 0 0 16px var(--gold-light);
      animation: sparkle 3s infinite ease-in-out;
    }
    @keyframes sparkle {
      0%, 100% { opacity: 0; transform: scale(0); }
      50% { opacity: 1; transform: scale(1); }
    }
  </style>
  <link rel="stylesheet" href="design-system-subdir.css" />
</head>
<body>

  <div class="alive-bg">
    <div class="particle"></div><div class="particle"></div><div class="particle"></div>
    <div class="particle"></div><div class="particle"></div>
  </div>
  <div class="paisley-overlay"></div>
  <div class="scanlines"></div>
  <div class="noise"></div>

  <div class="splash">
    <div class="splash-badge">Tactical Combat Simulation</div>

    <div class="q-logo-container" onclick="enterGame()" title="Click to enter">
      <div class="q-sparkle" style="top:-10px;left:20px;animation-delay:0s"></div>
      <div class="q-sparkle" style="top:40px;left:-10px;animation-delay:0.5s"></div>
      <div class="q-sparkle" style="top:90px;right:-5px;animation-delay:1s"></div>
      <div class="q-sparkle" style="bottom:20px;left:40px;animation-delay:1.5s"></div>
      <div class="q-body"></div>
      <div class="q-cutout"></div>
      <div class="q-tail"></div>
    </div>

    <h1><span class="q">Q</span><span class="rest">uemello</span></h1>
    <p class="splash-tagline">Search. Survive. Extract.</p>

    <button class="q-btn primary splash-cta" onclick="enterGame()">
      Enter Combat
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </button>
  </div>

  <div class="key-hint">Press Enter to Start</div>

  <div class="splash-footer">
    <a href="mission-control.html">Mission Control</a>
    <a href="action-center.html">Action Center</a>
    <a href="mobile.html">Mobile</a>
    <a href="roles.html">Roles</a>
    <a href="dashboard.html">Dashboard</a>
  </div>

  <div class="splash-version">v2.0.0 ALPHA</div>

  <script src="quemello-effects.js"></script>
  <script>
    function enterGame() {
      document.body.style.transition = 'opacity 1s ease';
      document.body.style.opacity = '0';
      setTimeout(() => { window.location.href = 'mobile.html'; }, 800);
    }
    document.addEventListener('keydown', e => { if (e.key === 'Enter') enterGame(); });
  </script>

</body>
</html>
